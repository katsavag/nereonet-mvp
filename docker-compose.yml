# Development services only.
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: nereonet
      POSTGRES_USER: nereonet
      POSTGRES_PASSWORD: nereonet
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql

  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web inbox: http://localhost:8025

volumes:
  pgdata:
