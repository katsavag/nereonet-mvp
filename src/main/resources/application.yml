spring:
  application:
    name: nereonet-mvp
  config:
    # Local secrets (P45: VESSELAPI_API_KEY=...) in .env in the working directory, KEY=value per line. Gitignored;
    # optional, and the environment works the same way.
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      # Every datetime is stored as UTC (see CLAUDE.md).
      hibernate.jdbc.time_zone: UTC
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      # Never fall back to plain text.
      mail.smtp.starttls.required: true
      # The sender's address: the Message-ID of every email ends in its domain, not in this computer's name (P30).
      mail.from: ${app.mail.from}
  messages:
    basename: messages
    fallback-to-system-locale: false
  web:
    resources:
      # Static files are linked with a content hash in the URL (/css/app-<md5>.css, added by @{...} in templates
      # and by url(...) rewriting in CSS), so they can be cached for a year: a changed file gets a new URL.
      chain:
        strategy:
          content:
            enabled: true
            paths: /css/**,/js/**,/vendor/**,/fonts/**,/img/**
      cache:
        cachecontrol:
          max-age: 365d
          cache-public: true
  servlet:
    multipart:
      # Library files: at most 10 MB (LibraryItemForm.MAX_FILE_SIZE); the rest of the form fits in the extra 1 MB.
      max-file-size: 10MB
      max-request-size: 11MB

server:
  tomcat:
    # Read the rest of a too large upload instead of dropping the connection, so the browser gets the
    # redirect back to the form (see UploadTooLargeFilter).
    max-swallow-size: 100MB

app:
  # Public address of the app, used in links sent by email. No trailing slash.
  base-url: ${APP_BASE_URL}
  mail:
    from: ${MAIL_FROM}
    # The name the inbox shows next to the sender's address (P30).
    from-name: ${MAIL_FROM_NAME:Nereonix}
  # Optional: the company this installation serves, shown at the bottom of the sign-in panel (P30), e.g.
  # "Nereonix Bulk Carriers" and "NEREONIX". Not shown when the name is empty.
  organisation:
    name: ${ORGANISATION_NAME:}
    code: ${ORGANISATION_CODE:}
  invitation:
    valid-days: 7
    # At least 32 characters (HS256).
    jwt-secret: ${INVITATION_JWT_SECRET}
  # First office user, created on startup only if no office user exists.
  # Can be removed from the environment once that user exists.
  bootstrap:
    office-email: ${BOOTSTRAP_OFFICE_EMAIL:}
    office-password: ${BOOTSTRAP_OFFICE_PASSWORD:}
  orders:
    # P50: the ship is told about the office's changes of an order this long after the last change, unless the office
    # presses "Done editing" first (ISO-8601 duration). Checked every minute.
    office-edit-quiet: ${ORDER_OFFICE_EDIT_QUIET:PT10M}
  stock:
    # P52: a provisions item above 0 and below this quantity (in its own unit) is Low on the Chief cook's Stores page.
    # One threshold for every item.
    low-threshold: ${STOCK_LOW_THRESHOLD:10}
  certificates:
    # Daily certificate expiry reminders (Spring cron: second minute hour day month weekday), in UTC.
    reminder-cron: ${CERTIFICATE_REMINDER_CRON:0 0 6 * * *}
  library:
    # Folder for library files (created if missing). Back it up together with the database.
    storage-dir: ${LIBRARY_STORAGE_DIR}
  # Experiment: the ship's position on the free VesselFinder map, on the office ship page (ship/ShipMap). false: no
  # map and no external script.
  ship-map:
    enabled: ${SHIP_MAP_ENABLED:true}
  # Optional free text (e.g. "Crewing department, crewing@example.com, +30 210 000 0000"), shown on the
  # "link is invalid or has expired" page. Not shown when empty.
  support-contact: ${SUPPORT_CONTACT:}
  # Optional (P40): the RightShip API, read only, for the nightly sync of the vessels' RightShip data and
  # "Refresh from RightShip". Off while any of the three is empty: then the app makes no request to RightShip and
  # the office enters the data by hand. The OAuth token address defaults to <base-url>/oauth/token.
  rightship:
    base-url: ${RIGHTSHIP_BASE_URL:}
    client-id: ${RIGHTSHIP_CLIENT_ID:}
    client-secret: ${RIGHTSHIP_CLIENT_SECRET:}
    token-url: ${RIGHTSHIP_TOKEN_URL:}
    # The nightly sync (Spring cron), in UTC.
    sync-cron: ${RIGHTSHIP_SYNC_CRON:0 30 2 * * *}
  # Optional (P45): VesselAPI, read only, for "Look up by IMO" (Add vessel) and "Refresh from VesselAPI" (Edit vessel),
  # called by the server only when a user presses one of them. Off while the key is empty: the buttons are hidden and
  # the app never calls VesselAPI. The key comes from the environment or the local .env; never put it in a checked-in
  # file. fake: true answers with built-in sample data instead (dev screens; core/vesseldata/FakeVesselApiClient).
  vesselapi:
    base-url: ${VESSELAPI_BASE_URL:https://api.vesselapi.com/v1}
    api-key: ${VESSELAPI_API_KEY:}
    fake: ${VESSELAPI_FAKE:false}
  # Optional (P57): counting the Chief cook's store by voice. AssemblyAI turns the recording into text; Mistral turns
  # the text into count lines (only the text and the vessel's provisions: id, name, unit). Off while either key is
  # empty: the Count page then has no microphone and the app never calls either. The keys come from the environment or
  # the local .env; never put them in a checked-in file. fake: true answers with built-in rules instead (dev screens;
  # core/speech/FakeSpeechClient, core/ai/FakeCountExtractor). Durations as 60s, 2m.
  assemblyai:
    base-url: ${ASSEMBLYAI_BASE_URL:https://api.assemblyai.com}
    api-key: ${ASSEMBLYAI_API_KEY:}
    # From the upload to the text, for one recording.
    timeout: ${ASSEMBLYAI_TIMEOUT:60s}
    language-code: ${ASSEMBLYAI_LANGUAGE_CODE:en}
    fake: ${ASSEMBLYAI_FAKE:false}
  mistral:
    base-url: ${MISTRAL_BASE_URL:https://api.mistral.ai}
    api-key: ${MISTRAL_API_KEY:}
    # Mistral Small 4 (March 2026), pinned: a -latest alias may change behaviour without notice.
    model: ${MISTRAL_MODEL:mistral-small-2603}
    timeout: ${MISTRAL_TIMEOUT:30s}
    fake: ${MISTRAL_FAKE:false}
  # SIRE 2.0 (P41): the company's own policy, shown on the SIRE page as such (not OCIMF rules). The data is entered
  # by hand; the app never connects to OCIMF.
  sire:
    # How long a SIRE 2.0 report is treated as current after the inspection, in months.
    report-current-months: ${SIRE_REPORT_CURRENT_MONTHS:12}
    # How many days the operator has to comment on a draft report, from its published date (else the inspection date).
    comment-days: ${SIRE_COMMENT_DAYS:14}
