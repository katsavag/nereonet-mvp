spring:
  application:
    name: nereonet-mvp
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      # Every datetime is stored as UTC (see CLAUDE.md).
      hibernate.jdbc.time_zone: UTC
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      # Never fall back to plain text.
      mail.smtp.starttls.required: true
      # The sender's address: the Message-ID of every email ends in its domain, not in this computer's name (P30).
      mail.from: ${app.mail.from}
  messages:
    basename: messages
    fallback-to-system-locale: false
  web:
    resources:
      # Static files are linked with a content hash in the URL (/css/app-<md5>.css, added by @{...} in templates
      # and by url(...) rewriting in CSS), so they can be cached for a year: a changed file gets a new URL.
      chain:
        strategy:
          content:
            enabled: true
            paths: /css/**,/js/**,/vendor/**,/fonts/**,/img/**
      cache:
        cachecontrol:
          max-age: 365d
          cache-public: true
  servlet:
    multipart:
      # Library files: at most 10 MB (LibraryItemForm.MAX_FILE_SIZE); the rest of the form fits in the extra 1 MB.
      max-file-size: 10MB
      max-request-size: 11MB

server:
  tomcat:
    # Read the rest of a too large upload instead of dropping the connection, so the browser gets the
    # redirect back to the form (see UploadTooLargeFilter).
    max-swallow-size: 100MB

app:
  # Public address of the app, used in links sent by email. No trailing slash.
  base-url: ${APP_BASE_URL}
  mail:
    from: ${MAIL_FROM}
    # The name the inbox shows next to the sender's address (P30).
    from-name: ${MAIL_FROM_NAME:Nereonix}
  # Optional: the company this installation serves, shown at the bottom of the sign-in panel (P30), e.g.
  # "Nereonix Bulk Carriers" and "NEREONIX". Not shown when the name is empty.
  organisation:
    name: ${ORGANISATION_NAME:}
    code: ${ORGANISATION_CODE:}
  invitation:
    valid-days: 7
    # At least 32 characters (HS256).
    jwt-secret: ${INVITATION_JWT_SECRET}
  # First office user, created on startup only if no office user exists.
  # Can be removed from the environment once that user exists.
  bootstrap:
    office-email: ${BOOTSTRAP_OFFICE_EMAIL:}
    office-password: ${BOOTSTRAP_OFFICE_PASSWORD:}
  certificates:
    # Daily certificate expiry reminders (Spring cron: second minute hour day month weekday), in UTC.
    reminder-cron: ${CERTIFICATE_REMINDER_CRON:0 0 6 * * *}
  library:
    # Folder for library files (created if missing). Back it up together with the database.
    storage-dir: ${LIBRARY_STORAGE_DIR}
  # Optional free text (e.g. "Crewing department, crewing@example.com, +30 210 000 0000"), shown on the
  # "link is invalid or has expired" page. Not shown when empty.
  support-contact: ${SUPPORT_CONTACT:}
  # Optional (P40): the RightShip API, read only, for the nightly sync of the vessels' RightShip data and
  # "Refresh from RightShip". Off while any of the three is empty: then the app makes no request to RightShip and
  # the office enters the data by hand. The OAuth token address defaults to <base-url>/oauth/token.
  rightship:
    base-url: ${RIGHTSHIP_BASE_URL:}
    client-id: ${RIGHTSHIP_CLIENT_ID:}
    client-secret: ${RIGHTSHIP_CLIENT_SECRET:}
    token-url: ${RIGHTSHIP_TOKEN_URL:}
    # The nightly sync (Spring cron), in UTC.
    sync-cron: ${RIGHTSHIP_SYNC_CRON:0 30 2 * * *}
