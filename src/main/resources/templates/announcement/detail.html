<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/layout :: layout(${announcement.title}, ~{::main})}">
<body>
<main>
    <header th:replace="~{layout/parts :: pageHeader(heading=${announcement.title}, crumbs=~{::pageCrumbs}, subtitleParts=~{::pageSubtitle}, eyebrow=${announcement.fleet} ? #{announcement.target.fleet} : (${announcement.ship.name} + ' · ' + #{ship.codeValue(${announcement.ship.imoNumber})}))}">
        <!-- The target: All ships, or the ship's name and IMO number. -->
        <th:block th:fragment="pageCrumbs">
            <li th:replace="~{layout/parts :: crumb(#{nav.announcements}, '/office/announcements')}"></li>
        </th:block>
        <th:block th:fragment="pageSubtitle">
            <time th:replace="~{layout/parts :: localTime(${announcement.createdAt})}"></time>
            ·
            <span th:text="${announcement.createdBy} ? ${announcement.createdBy.fullName} : #{announcement.deletedUser}">Office user</span>
        </th:block>
    </header>

    <div class="card mb-4">
        <div class="card-body text-break text-pre-line" th:text="${announcement.body}">Message text</div>
    </div>

    <!-- Acknowledged -->
    <div id="acknowledged" class="card mb-4">
        <div class="card-header bg-transparent d-flex justify-content-between align-items-center py-3">
            <h2 class="h5 fw-bold mb-0" th:text="#{announcement.acknowledged}">Acknowledged</h2>
            <span class="font-monospace small text-body-secondary" th:text="${recipients.acknowledged.size()}">0</span>
        </div>
        <p th:if="${recipients.acknowledged.isEmpty()}" class="card-body text-body-secondary mb-0"
           th:text="#{announcement.acknowledged.empty}">Nobody has acknowledged it yet.</p>
        <div th:unless="${recipients.acknowledged.isEmpty()}" class="table-responsive">
            <table class="table align-middle mb-0">
                <thead>
                <tr class="small text-body-secondary">
                    <th scope="col" th:text="#{announcement.recipient.name}">Name</th>
                    <th scope="col" th:text="#{announcement.recipient.role}">Role</th>
                    <th scope="col" th:text="#{user.ship}">Ship</th>
                    <th scope="col" th:text="#{announcement.recipient.acknowledgedAt}">Acknowledged at</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="r : ${recipients.acknowledged}">
                    <td class="fw-semibold" th:text="${r.user.fullName}">Jane Doe</td>
                    <td th:text="#{${'role.' + r.user.role}}">Crew member</td>
                    <td th:text="${r.ship.name}">MV Demo</td>
                    <td><time th:replace="~{layout/parts :: localTime(${r.acknowledgedAt})}"></time></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Not yet acknowledged -->
    <div id="pending" class="card">
        <div class="card-header bg-transparent d-flex justify-content-between align-items-center py-3">
            <h2 class="h5 fw-bold mb-0" th:text="#{announcement.pending}">Not yet acknowledged</h2>
            <span class="font-monospace small text-body-secondary" th:text="${recipients.pending.size()}">0</span>
        </div>
        <p th:if="${recipients.pending.isEmpty()}" class="card-body text-body-secondary mb-0"
           th:text="#{announcement.pending.empty}">Everyone has acknowledged it.</p>
        <div th:unless="${recipients.pending.isEmpty()}" class="table-responsive">
            <table class="table align-middle mb-0">
                <thead>
                <tr class="small text-body-secondary">
                    <th scope="col" th:text="#{announcement.recipient.name}">Name</th>
                    <th scope="col" th:text="#{announcement.recipient.role}">Role</th>
                    <th scope="col" th:text="#{user.ship}">Ship</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="r : ${recipients.pending}">
                    <td class="fw-semibold" th:text="${r.user.fullName}">John Doe</td>
                    <td th:text="#{${'role.' + r.user.role}}">Crew member</td>
                    <td th:text="${r.ship.name}">MV Demo</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
</body>
</html>
