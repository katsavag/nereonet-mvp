<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/layout :: layout(~{::title}, ~{::main})}">
<head>
    <title th:text="#{announcement.new.heading}">New announcement</title>
</head>
<body>
<main>
    <p class="eyebrow mb-1" th:text="#{portal.office}">Office portal</p>
    <h1 class="fw-bold mb-4" th:text="#{announcement.new.heading}">New announcement</h1>

    <div class="card form-box">
        <div class="card-body p-3 p-md-4">
            <form th:object="${form}" th:action="@{/office/announcements/new}" method="post" novalidate>
                <div th:replace="~{layout/parts :: errorSummary(${form}, '')}"></div>
                <div class="form-grid">
                    <!-- Full width, so the ship's name and IMO number are never cut off. -->
                    <div>
                        <label for="target" class="form-label" th:text="#{announcement.target}">Target</label>
                        <select th:field="*{target}" class="form-select" th:errorclass="is-invalid" required>
                            <option value="" th:text="#{announcement.target.choose}">Choose…</option>
                            <option th:value="${fleet}" th:text="#{announcement.target.fleet}">All ships</option>
                            <option th:each="s : ${ships}" th:value="${s.id}"
                                    th:text="${s.name} + ' · ' + #{ship.codeValue(${s.imoNumber})}">MV Demo · IMO 9074729</option>
                        </select>
                        <div class="invalid-feedback" th:errors="*{target}"></div>
                    </div>
                    <div>
                        <label for="title" class="form-label" th:text="#{announcement.title}">Title</label>
                        <input type="text" th:field="*{title}" class="form-control" th:errorclass="is-invalid"
                               autocomplete="off" aria-describedby="titleCounter" required>
                        <div class="invalid-feedback" th:errors="*{title}"></div>
                        <div class="form-meta">
                            <div th:replace="~{layout/parts :: counter(${form}, 'title', 'title')}"></div>
                        </div>
                    </div>
                    <div>
                        <label for="body" class="form-label" th:text="#{announcement.body}">Message</label>
                        <textarea th:field="*{body}" class="form-control" th:errorclass="is-invalid" rows="8"
                                  aria-describedby="bodyHint bodyCounter" required></textarea>
                        <div class="invalid-feedback" th:errors="*{body}"></div>
                        <div class="form-meta">
                            <div id="bodyHint" class="form-text" th:text="#{announcement.new.hint}">The crew on board now must acknowledge it. It cannot be edited or deleted after it is sent.</div>
                            <div th:replace="~{layout/parts :: counter(${form}, 'body', 'body')}"></div>
                        </div>
                    </div>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary" th:text="#{announcement.send}">Send</button>
                    <a class="btn btn-ghost" th:href="@{/office/announcements}" th:text="#{form.cancel}">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</main>
</body>
</html>
