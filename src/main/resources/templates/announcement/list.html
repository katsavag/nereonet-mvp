<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/layout :: layout(${shipTab != null} ? ${ship.name} + ' · ' + #{ship.tab.announcements} : #{announcement.list.title}, ~{::main})}">
<body>
<!-- Also the Announcements tab of the ship page (shipTab set, see ship/ShipFrame): the ship header instead of the page
     header, the ship fixed (no ship filter, no ship column), and actions for this ship that come back to the tab. -->
<!-- The ship's tab lists the announcements to this ship and to all ships, so the Target column stays. -->
<!-- No announcements yet (P25): the empty state holds New announcement, so the header leaves it out. -->
<main th:with="onShip=${shipTab != null}, noAnnouncements=${list.emptyUnfiltered(rows)}">
    <th:block th:if="${onShip}">
        <th:block th:replace="~{ship/parts :: header}"></th:block>
        <!-- New announcement: this ship preselected; back to this tab once sent. Not for an inactive ship. -->
        <div th:replace="~{ship/parts :: tabHeading(#{announcement.list.heading}, ${ship.active and !noAnnouncements} ? ~{::tabActions} : null)}">
            <th:block th:fragment="tabActions">
                <a class="btn btn-primary" th:href="@{/office/announcements/new(shipId=${ship.id})}">
                    <svg th:replace="~{layout/parts :: icon('plus')}"></svg>
                    <span th:text="#{announcement.new}">New announcement</span>
                </a>
            </th:block>
        </div>
    </th:block>
    <th:block th:unless="${onShip}">
    <header th:replace="~{layout/parts :: pageHeader(heading=#{announcement.list.heading}, count=${rows.totalElements}, subtitle=#{announcement.list.hint}, actions=${noAnnouncements} ? null : ~{::pageActions})}">
        <th:block th:fragment="pageActions">
            <a class="btn btn-primary" th:href="@{/office/announcements/new}">
                <svg th:replace="~{layout/parts :: icon('plus')}"></svg>
                <span th:text="#{announcement.new}">New announcement</span>
            </a>
        </th:block>
    </header>
    </th:block>

    <!-- Search, filters and chips (P19). Filter by ship: that ship's announcements and the ones to all ships. The ship's
         tab has no ship filter. -->
    <div th:replace="~{layout/parts :: filterBar(${list}, #{announcement.search}, ${onShip} ? null : ~{::listFilters})}">
        <th:block th:fragment="listFilters">
            <div th:replace="~{layout/parts :: shipFilter(${ships}, ${shipId})}"></div>
        </th:block>
    </div>

    <div class="card">
        <th:block th:replace="~{layout/parts :: listEmpty(rows=${rows}, list=${list}, icon='announcements',
                title=#{announcement.list.empty.title}, text=#{announcement.list.empty.text},
                action=${!onShip} ? ~{::pageActions} : (${ship.active} ? ~{::tabActions} : null))}"></th:block>

        <!-- data-table: the shared list style; data-table-stack: one stacked card per row on phones; table-sticky:
             the header stays visible while the page scrolls. -->
        <div th:unless="${rows.isEmpty()}" class="table-responsive table-sticky">
            <table class="table data-table data-table-stack align-middle mb-0">
                <thead>
                <tr>
                    <th th:replace="~{layout/parts :: sortHeader(${list}, 'title', #{announcement.title})}"></th>
                    <th th:replace="~{layout/parts :: sortHeader(${list}, 'target', #{announcement.target})}"></th>
                    <th th:replace="~{layout/parts :: sortHeader(${list}, 'sentAt', #{announcement.sentAt})}"></th>
                    <th scope="col" th:text="#{announcement.acknowledgements}">Acknowledged</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="row : ${rows}" th:with="a=${row.announcement}">
                    <td class="cell-primary">
                        <a th:href="@{/office/announcements/{id}(id=${a.id})}" th:text="${a.title}">Safety drill</a>
                    </td>
                    <td th:attr="data-label=#{announcement.target}">
                        <th:block th:if="${a.fleet}" th:text="#{announcement.target.fleet}">All ships</th:block>
                        <th:block th:unless="${a.fleet}"><a th:replace="~{layout/parts :: shipLink(${a.ship})}">MV Demo</a></th:block>
                    </td>
                    <td th:attr="data-label=#{announcement.sentAt}">
                        <time th:replace="~{layout/parts :: localTime(${a.createdAt})}"></time>
                    </td>
                    <td class="text-nowrap" th:attr="data-label=#{announcement.acknowledgements}"
                        th:text="#{announcement.count(${row.acknowledged}, ${row.recipients})}">12 of 20 acknowledged</td>
                </tr>
                </tbody>
            </table>
        </div>
        <nav th:replace="~{layout/parts :: pager(${rows}, ${list})}"></nav>
    </div>
</main>
</body>
</html>
