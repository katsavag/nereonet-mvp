<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/layout :: layout(${announcement.title}, ~{::main})}">
<body>
<!-- One news item as its recipient sees it (P27; "News" on the crew side since P39): the target as the eyebrow (All
     vessels, or the vessel the person was on when it was sent: never the other target vessels, P28), the title,
     "Office · <sender>" and when it was sent (UTC), the message as plain text with its line breaks, then the person's
     own read receipt: opening this page reads it (P39, ShipAnnouncementController: no button), so it always ends with
     the two ticks and "Read <date and time> UTC", the first time the person opened it. The reading column has a
     comfortable line length. Never who else has or has not read it. -->
<main>
    <header th:replace="~{layout/parts :: pageHeader(heading=${announcement.title}, crumbs=~{::pageCrumbs},
                         subtitleParts=~{::pageSubtitle},
                         eyebrow=${announcement.fleet} ? #{announcement.target.fleet} : null,
                         eyebrowShip=${announcement.fleet} ? null : ${recipient.ship})}">
        <th:block th:fragment="pageCrumbs">
            <li th:replace="~{layout/parts :: crumb(#{announcement.ship.title}, '/ship/news')}"></li>
        </th:block>
        <th:block th:fragment="pageSubtitle">
            <span th:text="${announcement.createdBy} ? #{announcement.ship.from(${announcement.createdBy.fullName})}
                         : #{announcement.ship.fromOffice}">Office · Jane Doe</span>
            ·
            <time th:replace="~{layout/parts :: localTime(${announcement.createdAt})}"></time>
        </th:block>
    </header>

    <div class="announcement-read">
        <div class="card">
            <div class="card-body text-break text-pre-line" th:text="${announcement.body}">Message text</div>
        </div>
        <p class="news-read-at">
            <span th:replace="~{layout/parts :: readReceipt(${recipient.acknowledgedAt})}"></span>
        </p>
    </div>
</main>
</body>
</html>
