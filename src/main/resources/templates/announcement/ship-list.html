<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/layout :: layout(#{announcement.ship.title}, ~{::main})}">
<body>
<!-- The crew's announcements (P27): the ones the signed-in person is a recipient of, newest first. English only, as
     every crew screen. Each row is one link (the title, stretched over the row): title, date sent (UTC) and the
     person's own state. One to acknowledge has a bold title and "To acknowledge"; one acknowledged a regular title and
     "Acknowledged": the words carry the state, weight and colour only repeat it. Nothing about anyone else. -->
<main>
    <header th:replace="~{layout/parts :: pageHeader(heading=#{announcement.ship.title}, eyebrowShip=${ship},
                         subtitle=${rows.isEmpty()} ? null : #{announcement.ship.hint})}"></header>

    <div class="card">
        <th:block th:if="${rows.isEmpty()}">
            <div th:replace="~{layout/parts :: emptyState(icon='announcements', title=#{announcement.ship.empty.title},
                    text=#{announcement.ship.empty.text}, action=null)}"></div>
        </th:block>
        <ul th:unless="${rows.isEmpty()}" class="list-group list-group-flush announcement-list">
            <li th:each="r : ${rows}" class="list-group-item list-group-item-action announcement-row"
                th:classappend="${r.acknowledgedAt == null} ? 'is-unread'" th:with="a=${r.announcement}">
                <div class="announcement-row-main">
                    <a class="announcement-row-title stretched-link" th:href="@{/ship/announcements/{id}(id=${a.id})}"
                       th:text="${a.title}">Safety drill on Friday</a>
                    <p class="announcement-row-meta"><time th:replace="~{layout/parts :: utcDate(${a.createdAt})}"></time></p>
                </div>
                <th:block th:if="${r.acknowledgedAt == null}"><span
                        th:replace="~{layout/parts :: status('warning', #{announcement.ship.toAcknowledge})}"></span></th:block>
                <th:block th:unless="${r.acknowledgedAt == null}"><span
                        th:replace="~{layout/parts :: status('ok', #{announcement.ship.acknowledged})}"></span></th:block>
            </li>
        </ul>
    </div>
</main>
</body>
</html>
