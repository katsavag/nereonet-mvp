<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/layout :: layout(#{approval.title}, ~{::main})}">
<body>
<!-- The Master's approvals (P33, P48): the item requests of their own ship, in three tabs (ordinary links, ?tab=...),
     each with its count. Pending: PENDING, oldest first. Approved: APPROVED, and Declined: REJECTED, newest decision
     first, with the decision and its date. Each row is one link (who asked, stretched over the row) to the request.
     English only, as every crew screen. Model: approvals (ApprovalService.Approvals). -->
<main th:with="a=${approvals}, tab=${approvals.tab.key()}, pendingTab=${approvals.tab.name() == 'PENDING'}">
    <header th:replace="~{layout/parts :: pageHeader(heading=#{approval.title}, eyebrowShip=${a.ship},
            subtitle=#{'approval.hint.' + ${tab}})}"></header>

    <nav th:replace="~{layout/parts :: viewSwitch(#{approval.tabs}, ~{::approvalTabs})}">
        <th:block th:fragment="approvalTabs">
            <a class="view-switch-link" th:href="@{/ship/approvals}" th:aria-current="${tab == 'pending'} ? 'page'">
                <svg th:replace="~{layout/parts :: icon('check')}"></svg>
                <span th:text="#{approval.tab.pending}">Pending</span>
                <span class="num" th:text="${a.pending}">2</span>
            </a>
            <a class="view-switch-link" th:href="@{/ship/approvals(tab='approved')}" th:aria-current="${tab == 'approved'} ? 'page'">
                <svg th:replace="~{layout/parts :: icon('check')}"></svg>
                <span th:text="#{approval.tab.approved}">Approved</span>
                <span class="num" th:text="${a.approved}">5</span>
            </a>
            <a class="view-switch-link" th:href="@{/ship/approvals(tab='declined')}" th:aria-current="${tab == 'declined'} ? 'page'">
                <svg th:replace="~{layout/parts :: icon('x')}"></svg>
                <span th:text="#{approval.tab.declined}">Declined</span>
                <span class="num" th:text="${a.declined}">1</span>
            </a>
        </th:block>
    </nav>

    <div class="card">
        <th:block th:if="${a.requests.isEmpty()}">
            <div th:replace="~{layout/parts :: emptyState(icon='approvals',
                    title=#{'approval.empty.' + ${tab} + '.title'},
                    text=#{'approval.empty.' + ${tab} + '.text'}, action=null)}"></div>
        </th:block>
        <ul th:unless="${a.requests.isEmpty()}" class="list-group list-group-flush approval-list">
            <li th:each="r : ${a.requests}" class="list-group-item list-group-item-action approval-row">
                <div class="approval-row-main">
                    <a class="approval-row-title stretched-link" th:href="@{/ship/approvals/{id}(id=${r.id})}"><th:block
                            th:replace="~{approval/parts :: person(${r.requestedBy})}"></th:block></a>
                    <p class="approval-row-meta">
                        <span th:text="#{request.number(${r.id})}">Request #12</span>
                        <span aria-hidden="true">·</span>
                        <time th:replace="~{layout/parts :: localTime(${r.createdAt})}"></time>
                        <span aria-hidden="true">·</span>
                        <span th:text="#{approval.lineCount(${r.lines.size()})}">3 items</span>
                    </p>
                </div>
                <div th:unless="${pendingTab}" class="approval-row-decision">
                    <span th:replace="~{approval/parts :: statusBadge(${r.status})}"></span>
                    <time th:replace="~{layout/parts :: utcDate(${r.decidedAt})}"></time>
                </div>
            </li>
        </ul>
    </div>
</main>
</body>
</html>
