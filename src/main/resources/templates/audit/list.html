<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/layout :: layout(#{audit.title}, ~{::main})}">
<body>
<main>
    <header th:replace="~{layout/parts :: pageHeader(heading=#{audit.heading}, count=${entries.totalElements})}"></header>

    <!-- Search, filters and chips (P19). A GET form, so the filtered page can be bookmarked. -->
    <div th:replace="~{layout/parts :: filterBar(${list}, #{audit.search}, ~{::listFilters})}">
        <th:block th:fragment="listFilters">
            <div th:replace="~{layout/parts :: shipFilter(${ships}, ${filter.shipId})}"></div>
            <div class="filter-field filter-field-date">
                <label for="from" class="form-label" th:text="#{audit.filter.from}">From (UTC)</label>
                <input type="date" id="from" name="from" th:value="${filter.from}" class="form-control">
            </div>
            <div class="filter-field filter-field-date">
                <label for="to" class="form-label" th:text="#{audit.filter.to}">To (UTC)</label>
                <input type="date" id="to" name="to" th:value="${filter.to}" class="form-control">
            </div>
        </th:block>
    </div>

    <div class="card">
        <!-- Nothing recorded yet (P25): the audit log has no action of its own; the setup steps are on the Overview. -->
        <th:block th:replace="~{layout/parts :: listEmpty(rows=${entries}, list=${list}, icon='audit',
                title=#{audit.empty.title}, text=#{audit.empty.text},
                action=~{layout/parts :: emptyLink('/office', #{empty.goToOverview}, 'btn btn-primary')})}"></th:block>

        <!-- data-table: the shared list style. The audit log keeps its columns on phones and scrolls sideways.
             Every row is one line, so all rows have the same height; long values are cut with an ellipsis and
             shown in full in the title attribute. table-sticky: the header stays visible while the page scrolls. -->
        <div th:unless="${entries.isEmpty()}" class="table-responsive table-sticky">
            <table class="table data-table align-middle mb-0">
                <thead>
                <tr>
                    <th th:replace="~{layout/parts :: sortHeader(${list}, 'when', #{audit.when})}"></th>
                    <th th:replace="~{layout/parts :: sortHeader(${list}, 'who', #{audit.who})}"></th>
                    <th th:replace="~{layout/parts :: sortHeader(${list}, 'action', #{audit.action})}"></th>
                    <th th:replace="~{layout/parts :: sortHeader(${list}, 'ship', #{audit.ship})}"></th>
                    <th scope="col" th:text="#{audit.details}">Details</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="e : ${entries}">
                    <td>
                        <time th:replace="~{layout/parts :: localTime(${e.occurredAt})}"></time>
                    </td>
                    <td class="text-nowrap">
                        <th:block th:if="${e.actor}">
                            <span th:text="${e.actor.fullName}">John Doe</span>
                            <span class="truncate text-body-secondary ms-1" th:title="${e.actor.email}"
                                  th:text="${e.actor.email}">john@example.com</span>
                        </th:block>
                        <span th:unless="${e.actor}" class="text-body-secondary"
                              th:text="${e.actorDeleted} ? #{audit.deletedUser} : #{audit.system}">System</span>
                    </td>
                    <!-- Action codes without a label are shown as they are. -->
                    <td class="text-nowrap"
                        th:text="${#messages.msgOrNull('audit.action.' + e.action)} ?: ${e.action}">Ship added</td>
                    <td class="text-nowrap">
                        <th:block th:if="${e.ship}">
                            <a th:replace="~{layout/parts :: shipLink(${e.ship})}">MV Demo</a>
                            <span class="text-body-secondary ms-1"
                                  th:text="#{ship.codeValue(${e.ship.imoNumber})}">IMO 9074729</span>
                        </th:block>
                        <span th:unless="${e.ship}">—</span>
                    </td>
                    <td>
                        <span class="truncate truncate-wide" th:title="${e.details}"
                              th:text="${e.details} ?: '—'">IMO 9074729, MV Demo</span>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
        <nav th:replace="~{layout/parts :: pager(${entries}, ${list})}"></nav>
    </div>
</main>
</body>
</html>
