<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/layout :: layout(~{::title}, ~{::main})}">
<head>
    <!-- Add and edit. certificate is null when adding. -->
    <title th:text="${certificate == null} ? #{certificate.new.heading} : #{certificate.edit.heading}">Add certificate</title>
</head>
<body>
<main>
    <p class="eyebrow mb-1" th:text="${member.fullName}">Jane Doe</p>
    <h1 class="fw-bold mb-4" th:text="${certificate == null} ? #{certificate.new.heading} : #{certificate.edit.heading}">Add certificate</h1>

    <div class="card form-box">
        <div class="card-body p-3 p-md-4">
            <form th:object="${form}" method="post" novalidate
                  th:action="${certificate == null} ? @{/office/crew/{id}/certificates/new(id=${member.id})} : @{/office/crew/{id}/certificates/{cid}/edit(id=${member.id},cid=${certificate.id})}">
                <div class="mb-3">
                    <label for="type" class="form-label fw-semibold" th:text="#{certificate.type}">Type</label>
                    <input type="text" th:field="*{type}" class="form-control" th:errorclass="is-invalid"
                           autocomplete="off" aria-describedby="typeHint" required>
                    <div class="invalid-feedback" th:errors="*{type}"></div>
                    <div id="typeHint" class="form-text" th:text="#{certificate.typeHint}">For example STCW Basic Safety.</div>
                </div>
                <div class="mb-3">
                    <label for="number" class="form-label fw-semibold" th:text="#{certificate.number}">Number</label>
                    <input type="text" th:field="*{number}" class="form-control" th:errorclass="is-invalid"
                           autocomplete="off" aria-describedby="numberHint">
                    <div class="invalid-feedback" th:errors="*{number}"></div>
                    <div id="numberHint" class="form-text" th:text="#{certificate.numberHint}">Optional.</div>
                </div>
                <div class="mb-4">
                    <label for="expiresOn" class="form-label fw-semibold" th:text="#{certificate.expiresOn}">Expires on</label>
                    <input type="date" th:field="*{expiresOn}" class="form-control" th:errorclass="is-invalid"
                           aria-describedby="expiresOnHint" required>
                    <div class="invalid-feedback" th:errors="*{expiresOn}"></div>
                    <div id="expiresOnHint" class="form-text" th:text="#{certificate.expiresOnHint}">Reminders are sent 90, 60 and 30 days before.</div>
                </div>
                <div class="d-flex flex-wrap gap-2">
                    <button type="submit" class="btn btn-primary" th:text="#{certificate.form.save}">Save</button>
                    <a class="btn btn-outline-secondary" th:href="@{/office/crew/{id}/edit(id=${member.id})}"
                       th:text="#{certificate.form.cancel}">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</main>
</body>
</html>
