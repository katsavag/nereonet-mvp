<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/layout :: layout((${certificate == null} ? #{certificate.new.heading} : #{certificate.edit.heading}), ~{::main})}">
<body>
<!-- Add and edit. certificate is null when adding.
     For one crew member (member set, from their page) or, from the ship page's Certificates tab, for a ship (ship set,
     member null): the crew member is then picked from that ship's crew (shipCrew). A matrix cell fills in the person
     and the type. Save and Cancel go back to backUrl: the page the form was opened from (returnTo), else the crew
     member's page or the ship's Certificates tab. -->
<main class="form-page" th:with="onShip=${member == null},
               action=${member == null} ? ${'/office/ships/' + ship.id + '/certificates/new'} : (${certificate == null} ? ${'/office/crew/' + member.id + '/certificates/new'} : ${'/office/crew/' + member.id + '/certificates/' + certificate.id + '/edit'})">
    <header th:replace="~{layout/parts :: pageHeader(heading=${certificate == null} ? #{certificate.new.heading} : #{certificate.edit.heading}, crumbs=~{::pageCrumbs}, eyebrowShip=${onShip} ? ${ship} : null)}">
        <th:block th:fragment="pageCrumbs">
            <th:block th:if="${onShip}">
                <th:block th:replace="~{ship/parts :: crumbs(${ship}, 'certificates')}"></th:block>
            </th:block>
            <th:block th:unless="${onShip}">
                <li th:replace="~{layout/parts :: crumb(#{nav.crew}, '/office/crew')}"></li>
                <li th:replace="~{layout/parts :: crumb(${member.fullName}, ${'/office/crew/' + member.id + '/edit'})}"></li>
            </th:block>
        </th:block>
    </header>

    <div class="card form-box">
        <div class="card-body p-3 p-md-4">
            <form th:object="${form}" method="post" novalidate th:action="@{${action}}">
                <div th:replace="~{layout/parts :: errorSummary(${form}, '')}"></div>
                <!-- The page this form was opened from (P20, certificate/CertificateReturn); Save and Cancel go back
                     there. -->
                <input th:if="${returnTo != null}" type="hidden" name="returnTo" th:value="${returnTo}">
                <div class="form-grid">
                    <!-- Full width, so long names are never cut off. Only this ship's active crew. -->
                    <div th:if="${onShip}">
                        <label for="userId" class="form-label" th:text="#{certificate.crewMember}">Crew member</label>
                        <select th:field="*{userId}" class="form-select" th:errorclass="is-invalid" required
                                aria-describedby="userIdHint">
                            <option value="" th:text="#{certificate.chooseCrewMember}">Choose a crew member</option>
                            <option th:each="u : ${shipCrew}" th:value="${u.id}"
                                    th:text="${u.rank} ? ${u.fullName} + ' · ' + #{${'rank.' + u.rank}} : ${u.fullName}">Jane Doe · Second Officer</option>
                        </select>
                        <div class="invalid-feedback" th:errors="*{userId}"></div>
                        <div id="userIdHint" class="form-text" th:text="#{certificate.crewMemberHint(${ship.name})}">Active crew of MV Demo.</div>
                    </div>
                    <div>
                        <label for="type" class="form-label" th:text="#{certificate.type}">Type</label>
                        <!-- Free text with suggestions (P20): the types in use, most used first, then the starter
                             list. CertificateTypes stores a type that differs only in case or spaces as the known one. -->
                        <input type="text" th:field="*{type}" class="form-control" th:errorclass="is-invalid"
                               list="certificateTypes" autocomplete="off" aria-describedby="typeHint typeCounter" required>
                        <datalist id="certificateTypes">
                            <option th:each="t : ${typeSuggestions}" th:value="${t}"></option>
                        </datalist>
                        <div class="invalid-feedback" th:errors="*{type}"></div>
                        <div class="form-meta">
                            <div id="typeHint" class="form-text" th:text="#{certificate.typeHint}">Pick a suggestion or type a new one.</div>
                            <div th:replace="~{layout/parts :: counter(${form}, 'type', 'type')}"></div>
                        </div>
                    </div>
                    <div class="field-half">
                        <label for="number" class="form-label">[[#{certificate.number}]] <span th:replace="~{layout/parts :: optional}"></span></label>
                        <input type="text" th:field="*{number}" class="form-control" th:errorclass="is-invalid"
                               autocomplete="off" aria-describedby="numberCounter">
                        <div class="invalid-feedback" th:errors="*{number}"></div>
                        <div class="form-meta">
                            <div th:replace="~{layout/parts :: counter(${form}, 'number', 'number')}"></div>
                        </div>
                    </div>
                    <div class="field-half">
                        <label for="expiresOn" class="form-label" th:text="#{certificate.expiresOn}">Expires on</label>
                        <input type="date" th:field="*{expiresOn}" class="form-control" th:errorclass="is-invalid"
                               aria-describedby="expiresOnHint" required>
                        <div class="invalid-feedback" th:errors="*{expiresOn}"></div>
                        <div id="expiresOnHint" class="form-text" th:text="#{certificate.expiresOnHint}">Reminders are sent 90, 60 and 30 days before.</div>
                    </div>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary" th:text="#{form.save}">Save</button>
                    <a class="btn btn-ghost" th:href="@{${backUrl}}" th:text="#{form.cancel}">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</main>
</body>
</html>
