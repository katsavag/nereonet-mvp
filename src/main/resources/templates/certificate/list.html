<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/layout :: layout(${shipTab != null} ? ${ship.name} + ' · ' + #{ship.tab.certificates} : #{certificate.list.title}, ~{::main})}">
<body>
<!-- Certificates (P20): every certificate, by default the expired ones and those expiring within 90 days, soonest
     first. Also the List view of the ship page's Certificates tab (shipTab set, see ship/ShipFrame): the ship header
     and the Matrix / List switch instead of the page header, the ship fixed (no ship filter, no ship column).
     Export CSV downloads the list as filtered and sorted (every page). Links to a certificate carry returnTo, so its
     form comes back here. -->
<main th:with="onShip=${shipTab != null}">
    <th:block th:if="${onShip}">
        <th:block th:replace="~{certificate/matrix :: tabTop('list', ${exportUrl})}"></th:block>
    </th:block>
    <th:block th:unless="${onShip}">
    <header th:replace="~{layout/parts :: pageHeader(heading=#{certificate.list.heading}, count=${certificates.totalElements},
            subtitle=#{certificate.list.hint}, actions=~{::pageActions})}">
        <th:block th:fragment="pageActions">
            <a class="btn btn-outline-secondary" th:href="@{${exportUrl}}" download>
                <svg th:replace="~{layout/parts :: icon('download')}"></svg>
                <span th:text="#{certificate.export}">Export CSV</span>
            </a>
        </th:block>
    </header>
    </th:block>

    <!-- Search, filters and chips (P19). A GET form, so the filtered page can be bookmarked. Status: one state, or
         the combination a link brought (the Overview's "expired or within 30 days"), kept as an option of its own.
         The ship's list has no ship filter and no "active ships only". -->
    <div th:replace="~{layout/parts :: filterBar(${list}, #{certificate.search}, ~{::listFilters})}">
        <th:block th:fragment="listFilters">
            <th:block th:unless="${onShip}"><div th:replace="~{layout/parts :: shipFilter(${ships}, ${shipId})}"></div></th:block>
            <div class="filter-field filter-field-wide">
                <label for="filterStatus" class="form-label" th:text="#{certificate.status}">Status</label>
                <select id="filterStatus" name="status" class="form-select">
                    <option value="" th:text="#{certificate.filter.status.default}">Expired or within 90 days</option>
                    <option th:unless="${statusOption}" th:value="${status}" th:selected="${true}"
                            th:text="${statusLabel}">Expired or within 30 days</option>
                    <option th:each="o : ${statusOptions}" th:value="${o}" th:selected="${o == status}"
                            th:text="#{${'certificate.filter.status.' + o}}">Expired</option>
                </select>
            </div>
            <div th:unless="${onShip}" class="filter-field filter-field-check">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="filterActiveShips" name="activeShips"
                           value="true" th:checked="${activeShips}">
                    <label class="form-check-label" for="filterActiveShips" th:text="#{certificate.filter.activeShips}">Active ships only</label>
                </div>
            </div>
        </th:block>
    </div>

    <div class="card">
        <th:block th:replace="~{layout/parts :: listEmpty(${certificates}, ${list}, #{certificate.list.empty})}"></th:block>

        <!-- data-table: the shared list style; data-table-stack: one stacked card per row on phones,
             stack-hide: not shown there; table-sticky: the header stays visible while the page scrolls. Soonest
             expiry first unless sorted otherwise (P19). Expires: the date and how far it is ("in 23 days",
             "expired 5 days ago"); Status: the badge with its icon. -->
        <div th:unless="${certificates.isEmpty()}" class="table-responsive table-sticky">
            <table class="table data-table data-table-stack align-middle mb-0">
                <thead>
                <tr>
                    <th th:replace="~{layout/parts :: sortHeader(${list}, 'type', #{certificate.type})}"></th>
                    <th th:replace="~{layout/parts :: sortHeader(${list}, 'crewMember', #{certificate.crewMember})}"></th>
                    <th:block th:unless="${onShip}"><th th:replace="~{layout/parts :: sortHeader(${list}, 'ship', #{user.ship})}"></th></th:block>
                    <th th:replace="~{layout/parts :: sortHeader(${list}, 'number', #{certificate.number})}"></th>
                    <th th:replace="~{layout/parts :: sortHeader(${list}, 'expiresOn', #{certificate.expiresOn})}"></th>
                    <th scope="col" th:text="#{certificate.status}">Status</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="c : ${certificates}">
                    <td class="cell-primary">
                        <a th:href="@{/office/crew/{id}/certificates/{cid}/edit(id=${c.user.id},cid=${c.id},returnTo=${returnTo})}"
                           th:text="${c.type}">STCW Basic Safety</a>
                    </td>
                    <td class="text-nowrap" th:attr="data-label=#{certificate.crewMember}">
                        <span th:text="${c.user.fullName}">Jane Doe</span>
                        <th:block th:unless="${c.user.enabled}"><span
                                th:replace="~{layout/parts :: status('neutral', #{user.status.inactive})}">Inactive</span></th:block>
                    </td>
                    <td th:unless="${onShip}" th:attr="data-label=#{user.ship}">
                        <th:block th:if="${c.user.ship}"><a th:replace="~{layout/parts :: shipLink(${c.user.ship})}">MV Demo</a></th:block>
                        <th:block th:unless="${c.user.ship}">—</th:block>
                    </td>
                    <td class="stack-hide" th:text="${c.number} ?: '—'">12345</td>
                    <td class="text-nowrap" th:attr="data-label=#{certificate.expiresOn}"><span
                            th:replace="~{layout/parts :: expiryDate(${c.expiresOn})}">10 Jan 2027 · in 60 days</span></td>
                    <td class="cell-status">
                        <th:block th:replace="~{layout/parts :: certificateBadge(${c}, ${today})}"></th:block>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
        <nav th:replace="~{layout/parts :: pager(${certificates}, ${list})}"></nav>
    </div>
</main>
</body>
</html>
