<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/layout :: layout(${confirm.title}, ~{::main})}">
<body>
<!-- The plain confirmation page (P10): where a layout/parts :: confirmForm trigger leads when js/confirm.js did not
     load. The same question as the dialog (core/confirm/ConfirmPage, built from the same message keys): the heading
     names the record, one sentence gives the consequence, then the confirm button, which posts the action, and the
     way back. Nothing has changed until the button is pressed. -->
<main class="form-page">
    <header th:replace="~{layout/parts :: pageHeader(heading=${confirm.title}, crumbs=~{::pageCrumbs})}">
        <th:block th:fragment="pageCrumbs">
            <!-- th:each on a wrapper: th:replace runs before th:each on the same element. -->
            <th:block th:each="c : ${confirm.crumbs}">
                <li th:replace="~{layout/parts :: crumb(${c.label}, ${c.url})}"></li>
            </th:block>
        </th:block>
    </header>

    <div class="card form-box confirm-page">
        <div class="card-body p-3 p-md-4">
            <form method="post" th:action="@{${confirm.action}}">
                <input th:each="f : ${confirm.fields}" type="hidden" th:name="${f.key}" th:value="${f.value}">
                <p class="confirm-page-body" th:text="${confirm.body}">No new crew can be invited to MV Demo until it
                    is activated again.</p>
                <!-- P50: an optional note posted with the action (removing an order line). -->
                <div th:if="${confirm.note != null}" class="mb-3">
                    <label for="confirmNote" class="form-label">[[${confirm.note.label}]] <span th:replace="~{layout/parts :: optional}"></span></label>
                    <textarea id="confirmNote" class="form-control" rows="2" th:name="${confirm.note.name}"
                              th:maxlength="${confirm.note.maxLength}"></textarea>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn" th:classappend="${confirm.danger()} ? 'btn-outline-danger' : 'btn-primary'"
                            th:text="${confirm.confirmLabel}">Deactivate</button>
                    <a class="btn btn-ghost" th:href="@{${confirm.cancelUrl}}" th:text="${confirm.dismissLabel}">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</main>
</body>
</html>
