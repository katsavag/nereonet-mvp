<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/layout :: layout(#{crew.edit.title}, ~{::main})}">
<body>
<main>
    <header th:replace="~{layout/parts :: pageHeader(heading=#{crew.edit.heading}, crumbs=~{::pageCrumbs})}">
        <th:block th:fragment="pageCrumbs">
            <li th:replace="~{layout/parts :: crumb(#{nav.crew}, '/office/crew')}"></li>
        </th:block>
    </header>

    <div class="card form-box">
        <div class="card-body p-3 p-md-4">
            <form th:action="@{/office/crew/{id}/edit(id=${member.id})}" th:object="${form}" method="post" novalidate>
                <div th:replace="~{layout/parts :: errorSummary(${form}, '')}"></div>
                <div class="form-grid">
                    <!-- The email cannot be changed: plain text, not an input. -->
                    <dl class="static-fields">
                        <dt th:text="#{user.email}">Email</dt>
                        <dd>
                            <span th:text="${member.email}">jane@example.com</span>
                            <span class="form-text d-block" th:text="#{crew.edit.emailReadOnly}">The email cannot be changed.</span>
                        </dd>
                    </dl>
                    <div>
                        <label for="fullName" class="form-label" th:text="#{user.fullName}">Full name</label>
                        <input type="text" th:field="*{fullName}" class="form-control" th:errorclass="is-invalid"
                               autocomplete="off" aria-describedby="fullNameCounter" required>
                        <div class="invalid-feedback" th:errors="*{fullName}"></div>
                        <div class="form-meta">
                            <div th:replace="~{layout/parts :: counter(${form}, 'fullName', 'fullName')}"></div>
                        </div>
                    </div>
                    <div class="field-half">
                        <label for="rank" class="form-label">[[#{user.rank}]] <span th:replace="~{layout/parts :: optional}"></span></label>
                        <select th:field="*{rank}" class="form-select" th:errorclass="is-invalid">
                            <option value="" th:text="#{user.chooseRank}">Choose a rank</option>
                            <option th:each="r : ${ranks}" th:value="${r}" th:text="#{${'rank.' + r}}">Second Officer</option>
                        </select>
                        <div class="invalid-feedback" th:errors="*{rank}"></div>
                    </div>
                    <div class="field-half">
                        <label for="role" class="form-label" th:text="#{user.role}">Role</label>
                        <select th:field="*{role}" class="form-select" th:errorclass="is-invalid" required>
                            <option th:each="r : ${roles}" th:value="${r}" th:text="#{${'role.' + r}}">Crew member</option>
                        </select>
                        <div class="invalid-feedback" th:errors="*{role}"></div>
                    </div>
                    <!-- Full width, so the ship's name and IMO number are never cut off: a wrong ship is costly. -->
                    <div>
                        <label for="shipId" class="form-label" th:text="#{user.ship}">Ship</label>
                        <select th:field="*{shipId}" class="form-select" th:errorclass="is-invalid"
                                aria-describedby="shipHint" required>
                            <option value="" th:text="#{crew.edit.chooseShip}">Choose a ship</option>
                            <option th:each="s : ${ships}" th:value="${s.id}"
                                    th:text="${s.name} + ' · ' + #{ship.codeValue(${s.imoNumber})}">MV Demo · IMO 9074729</option>
                        </select>
                        <div class="invalid-feedback" th:errors="*{shipId}"></div>
                        <div id="shipHint" class="form-text" th:text="#{crew.edit.shipHint}">Pick another ship to move this crew member.</div>
                    </div>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary" th:text="#{form.save}">Save</button>
                    <a class="btn btn-ghost" th:href="@{/office/crew}" th:text="#{form.cancel}">Cancel</a>
                </div>
            </form>
        </div>
    </div>

    <!-- Certificates: added, edited and deleted on their own pages (certificate feature), which return here. -->
    <div class="card form-box mt-4">
        <div class="card-header bg-transparent d-flex flex-wrap justify-content-between align-items-center gap-2 py-3">
            <h2 class="h5 fw-bold mb-0" th:text="#{certificate.heading}">Certificates</h2>
            <a class="btn btn-outline-secondary btn-sm" th:href="@{/office/crew/{id}/certificates/new(id=${member.id})}"
               th:text="#{certificate.add}">Add certificate</a>
        </div>

        <p th:if="${certificates.isEmpty()}" class="card-body text-body-secondary mb-0"
           th:text="#{certificate.empty}">No certificates yet.</p>

        <ul th:unless="${certificates.isEmpty()}" class="list-group list-group-flush">
            <li th:each="c : ${certificates}" class="list-group-item d-flex flex-wrap align-items-center gap-2 py-3">
                <div class="flex-grow-1">
                    <div class="fw-semibold text-break" th:text="${c.type}">STCW Basic Safety</div>
                    <div class="small text-body-secondary">
                        <span th:if="${c.number}" class="text-break" th:text="${c.number} + ' · '">12345 · </span>
                        <span class="text-nowrap" th:text="#{certificate.expiresOnValue(${@dates.date(c.expiresOn)})}">Expires 10 Jan 2027</span>
                        <span th:replace="~{layout/parts :: certificateHint(${c.expiresOn})}">· in 60 days</span>
                    </div>
                </div>
                <th:block th:replace="~{layout/parts :: certificateBadge(${c}, ${today})}"></th:block>
                <div class="d-flex align-items-start gap-2">
                    <a class="btn btn-ghost btn-sm"
                       th:href="@{/office/crew/{id}/certificates/{cid}/edit(id=${member.id},cid=${c.id})}"
                       th:text="#{certificate.edit}">Edit</a>
                    <details th:replace="~{layout/parts :: rowMenu(#{common.moreActions(${c.type})}, ~{::certificateMenuItems})}">
                        <th:block th:fragment="certificateMenuItems">
                            <form th:replace="~{layout/parts :: confirmForm(
                                    action=${'/office/crew/' + member.id + '/certificates/' + c.id + '/delete'},
                                    label=#{certificate.delete}, linkClass='dropdown-item dropdown-item-danger',
                                    title=#{certificate.delete.confirm.title(${c.type})},
                                    body=#{certificate.delete.confirm.body(${c.type}, ${member.fullName})},
                                    confirm=#{certificate.delete}, tone='danger')}"></form>
                        </th:block>
                    </details>
                </div>
            </li>
        </ul>
    </div>
</main>
</body>
</html>
