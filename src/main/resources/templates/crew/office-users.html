<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/layout :: layout(#{users.list.title}, ~{::main})}">
<body>
<!-- Office users and pending office invitations in one list (P07); /office/invitations redirects here. Searched,
     filtered by status, sorted and paginated on the server (P19). -->
<!-- Empty (P25; only before the first office user, as the signed-in user is listed): the empty state holds Invite. -->
<main th:with="noUsers=${list.emptyUnfiltered(people)}">
    <header th:replace="~{layout/parts :: pageHeader(heading=#{users.list.heading}, count=${people.totalElements}, actions=${noUsers} ? null : ~{::pageActions})}">
        <th:block th:fragment="pageActions">
            <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#inviteModal">
                <svg th:replace="~{layout/parts :: icon('plus')}"></svg>
                <span th:text="#{invitation.list.invite}">Invite office user</span>
            </button>
        </th:block>
    </header>

    <div th:replace="~{layout/parts :: filterBar(${list}, #{users.search}, ~{::listFilters})}">
        <th:block th:fragment="listFilters">
            <div class="filter-field">
                <label for="filterStatus" class="form-label" th:text="#{user.status}">Status</label>
                <select id="filterStatus" name="status" class="form-select">
                    <option value="" th:text="#{crew.filter.allStatuses}">All statuses</option>
                    <option th:each="st : ${statuses}" th:value="${st.key()}" th:selected="${st.key() == status}"
                            th:text="#{${'crew.filter.status.' + st.key()}}">Invitation expired</option>
                </select>
            </div>
        </th:block>
    </div>

    <div class="card">
        <th:block th:replace="~{layout/parts :: listEmpty(rows=${people}, list=${list}, icon='users',
                title=#{users.list.empty.title}, text=#{users.list.empty.text}, action=~{::pageActions})}"></th:block>

        <!-- data-table: the shared list style; data-table-stack: one stacked card per row on phones; table-sticky:
             the header stays visible while the page scrolls. -->
        <div th:unless="${people.isEmpty()}" class="table-responsive table-sticky">
            <table class="table data-table data-table-stack align-middle mb-0">
                <thead>
                <tr>
                    <th th:replace="~{layout/parts :: sortHeader(${list}, 'name', #{user.fullName})}"></th>
                    <th th:replace="~{layout/parts :: sortHeader(${list}, 'email', #{user.email})}"></th>
                    <th th:replace="~{layout/parts :: sortHeader(${list}, 'status', #{user.status})}"></th>
                    <th scope="col"><span class="visually-hidden" th:text="#{user.actions}">Actions</span></th>
                </tr>
                </thead>
                <tbody>
                <th:block th:each="row : ${people}">
                <!-- A pending invitation, expired or not: no account yet. Resend, and Cancel invitation in the menu (crew/parts). -->
                <tr th:if="${row.invitation() != null}" th:with="inv=${row.invitation()}">
                    <td class="cell-primary" th:text="${inv.fullName}">Jane Doe</td>
                    <td th:attr="data-label=#{user.email}">
                        <span th:replace="~{layout/parts :: email(${inv.email})}">jane@example.com</span>
                    </td>
                    <td class="cell-status">
                        <th:block th:replace="~{crew/parts :: invitationStatus(${inv})}"></th:block>
                    </td>
                    <td class="cell-actions">
                        <div th:replace="~{crew/parts :: invitationActions(${inv})}"></div>
                    </td>
                </tr>
                <!-- Office users have no page of their own, so the name is not a link. -->
                <tr th:if="${row.user() != null}" th:with="u=${row.user()}"
                    th:classappend="${!u.enabled} ? 'text-body-secondary'">
                    <td class="cell-primary" th:text="${u.fullName}">John Doe</td>
                    <td th:attr="data-label=#{user.email}">
                        <span th:replace="~{layout/parts :: email(${u.email})}">office@example.com</span>
                    </td>
                    <td class="cell-status">
                        <span th:replace="~{crew/parts :: status(${u.enabled})}">Active</span>
                    </td>
                    <td class="cell-actions">
                        <!-- A user cannot deactivate themselves. -->
                        <div th:unless="${u.email == #authentication.name}" class="row-actions">
                            <details th:replace="~{crew/parts :: userMenu(${u}, null)}"></details>
                        </div>
                    </td>
                </tr>
                </th:block>
                </tbody>
            </table>
        </div>
        <nav th:replace="~{layout/parts :: pager(${people}, ${list})}"></nav>
    </div>

    <!-- Invite office user. Full screen on phones. The email is asked once; the success message names the address it went to. -->
    <div class="modal fade" id="inviteModal" tabindex="-1" aria-labelledby="inviteModalTitle" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-fullscreen-sm-down">
            <form class="modal-content" th:action="@{/office/invitations}" th:object="${form}" method="post" novalidate>
                <div class="modal-header">
                    <h2 class="modal-title h5 fw-bold" id="inviteModalTitle"
                        th:text="#{invitation.office.heading}">Invite office user</h2>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"
                            th:attr="aria-label=#{common.close}"></button>
                </div>
                <div class="modal-body">
                    <div th:replace="~{layout/parts :: errorSummary(${form}, '')}"></div>
                    <div class="form-grid">
                        <div>
                            <label for="fullName" class="form-label" th:text="#{invitation.fullName}">Full name</label>
                            <input type="text" th:field="*{fullName}" class="form-control"
                                   th:errorclass="is-invalid" autocomplete="off" aria-describedby="fullNameCounter" required>
                            <div class="invalid-feedback" th:errors="*{fullName}"></div>
                            <div class="form-meta">
                                <div th:replace="~{layout/parts :: counter(${form}, 'fullName', 'fullName')}"></div>
                            </div>
                        </div>
                        <div>
                            <label for="email" class="form-label" th:text="#{invitation.email}">Email</label>
                            <input type="email" th:field="*{email}" class="form-control"
                                   th:errorclass="is-invalid" autocomplete="off" aria-describedby="emailCounter" required>
                            <div class="invalid-feedback" th:errors="*{email}"></div>
                            <div class="form-meta">
                                <div th:replace="~{layout/parts :: counter(${form}, 'email', 'email')}"></div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-ghost" data-bs-dismiss="modal"
                            th:text="#{form.cancel}">Cancel</button>
                    <button type="submit" class="btn btn-primary" th:text="#{invitation.form.submit}">Send invitation</button>
                </div>

                <!-- The form was posted with errors: open the modal again so they are visible. -->
                <script th:if="${#fields.hasAnyErrors()}">
                    document.addEventListener('DOMContentLoaded',
                        () => bootstrap.Modal.getOrCreateInstance('#inviteModal').show());
                </script>
            </form>
        </div>
    </div>
</main>
</body>
</html>
