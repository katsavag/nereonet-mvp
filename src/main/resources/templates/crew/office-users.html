<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/layout :: layout(~{::title}, ~{::main})}">
<head>
    <title th:text="#{users.list.title}">Office users</title>
</head>
<body>
<main>
    <div class="mb-4">
        <p class="eyebrow mb-1" th:text="#{portal.office}">Office portal</p>
        <h1 class="fw-bold mb-0" th:text="#{users.list.heading}">Office users</h1>
    </div>

    <div class="card">
        <div class="card-header bg-transparent py-3">
            <h2 th:replace="~{layout/parts :: cardTitle(#{users.list.heading}, ${users.size()})}">Office users · 3</h2>
        </div>

        <!-- data-table: the shared list style; data-table-stack: one stacked card per row on phones. -->
        <div class="table-responsive">
            <table class="table data-table data-table-stack align-middle mb-0">
                <thead>
                <tr>
                    <th scope="col" th:text="#{user.fullName}">Full name</th>
                    <th scope="col" th:text="#{user.email}">Email</th>
                    <th scope="col" th:text="#{user.status}">Status</th>
                    <th scope="col"><span class="visually-hidden" th:text="#{user.actions}">Actions</span></th>
                </tr>
                </thead>
                <tbody>
                <!-- Office users have no page of their own, so the name is not a link. -->
                <tr th:each="u : ${users}" th:classappend="${!u.enabled} ? 'text-body-secondary'">
                    <td class="cell-primary" th:text="${u.fullName}">John Doe</td>
                    <td th:attr="data-label=#{user.email}">
                        <span th:replace="~{layout/parts :: email(${u.email})}">office@example.com</span>
                    </td>
                    <td class="cell-status">
                        <span th:replace="~{crew/parts :: status(${u.enabled})}">Active</span>
                    </td>
                    <td class="cell-actions">
                        <!-- A user cannot deactivate themselves. -->
                        <div th:unless="${u.email == #authentication.name}" class="row-actions">
                            <details th:replace="~{crew/parts :: userMenu(${u}, null)}"></details>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
</body>
</html>
