<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!-- Fragments for the crew and office user lists. -->

<span th:fragment="status(enabled)"
      th:replace="~{layout/parts :: status(${enabled} ? 'ok' : 'neutral', ${enabled} ? #{user.status.active} : #{user.status.inactive})}">Active</span>

<!-- A pending invitation's status (P17), on Office users and Crew: "Invited · expires in 3 days", or past its expiry
     date "Invitation expired · 2 days ago" in the warning tone. The words carry the meaning, not the colour. -->
<th:block th:fragment="invitationStatus(inv)">
    <th:block th:if="${inv.displayStatus.name() == 'EXPIRED'}">
        <span th:replace="~{layout/parts :: status('warning', #{users.status.invitationExpired})}">Invitation expired</span>
        <span th:replace="~{layout/parts :: invitationExpiredHint(${inv.expiresAt})}">· 2 days ago</span>
    </th:block>
    <th:block th:unless="${inv.displayStatus.name() == 'EXPIRED'}">
        <span th:replace="~{layout/parts :: status('primary', #{crew.status.invited})}">Invited</span>
        <span th:replace="~{layout/parts :: invitationHint(${inv.expiresAt})}">· expires in 3 days</span>
    </th:block>
</th:block>

<!-- A pending invitation's row actions (P17): Resend, one click, also when expired (new link and expiry date); Cancel
     invitation in the "more" menu, asking first. Both send the fields of the list they are on (listParams, see
     crew/CrewListReturn; none on Office users), so they return to it with its filters. -->
<div th:fragment="invitationActions(inv)" class="row-actions">
    <form th:action="@{/office/invitations/{id}/resend(id=${inv.id})}" method="post">
        <input th:each="p : ${listParams}" type="hidden" th:name="${p.key}" th:value="${p.value}">
        <button type="submit" class="btn btn-ghost btn-sm"
                th:text="#{invitation.resend}">Resend</button>
    </form>
    <details th:replace="~{layout/parts :: rowMenu(#{common.moreActions(${inv.fullName})}, ~{::invitationMenuItems})}">
        <th:block th:fragment="invitationMenuItems">
            <hr class="dropdown-divider">
            <form th:replace="~{layout/parts :: confirmForm(action=${'/office/invitations/' + inv.id + '/cancel'},
                    fields=${listParams}, label=#{invitation.cancel.confirm.submit},
                    linkClass='dropdown-item dropdown-item-danger',
                    title=#{invitation.cancel.confirm.title(${inv.fullName})},
                    body=#{invitation.cancel.confirm.body(${inv.email})},
                    confirm=#{invitation.cancel.confirm.submit},
                    dismiss=#{invitation.cancel.confirm.keep}, tone='danger')}"></form>
        </th:block>
    </details>
</div>

<!-- Row "more" menu of a user: Edit (when editUrl is not null), Activate for an inactive user; then, after the
     divider, Deactivate an active user or Delete an inactive one. -->
<details th:fragment="userMenu(u, editUrl)"
         th:replace="~{layout/parts :: rowMenu(#{common.moreActions(${u.fullName})}, ~{crew/parts :: userMenuItems(${u}, ${editUrl})})}"></details>

<!-- On the ship page's Crew tab (shipTab set) each form sends tab=crew, so CrewController returns there. -->
<th:block th:fragment="userMenuItems(u, editUrl)">
    <a th:if="${editUrl != null}" class="dropdown-item" th:href="${editUrl}" th:text="#{user.edit}">Edit</a>
    <form th:unless="${u.enabled}" th:action="@{/office/users/{id}/activate(id=${u.id})}" method="post">
        <input th:if="${shipTab != null}" type="hidden" name="tab" th:value="${shipTab}">
        <button type="submit" class="dropdown-item" th:text="#{user.activate}">Activate</button>
    </form>
    <hr class="dropdown-divider">
    <!-- Both ask first (layout/parts :: confirmForm). Deactivate is undone by Activate; Delete cannot be undone. -->
    <th:block th:if="${u.enabled}">
        <form th:replace="~{layout/parts :: confirmForm(action=${'/office/users/' + u.id + '/deactivate'}, tab=${shipTab},
                label=#{user.deactivate}, linkClass='dropdown-item dropdown-item-danger',
                title=#{user.deactivate.confirm.title(${u.fullName})}, body=#{user.deactivate.confirm.body(${u.fullName})},
                confirm=#{user.deactivate}, tone='neutral')}"></form>
    </th:block>
    <th:block th:unless="${u.enabled}">
        <form th:replace="~{layout/parts :: confirmForm(action=${'/office/users/' + u.id + '/delete'}, tab=${shipTab},
                label=#{user.delete}, linkClass='dropdown-item dropdown-item-danger',
                title=#{user.delete.confirm.title(${u.fullName})}, body=#{user.delete.confirm.body(${u.fullName}, ${u.email})},
                confirm=#{user.delete}, tone='danger')}"></form>
    </th:block>
</th:block>

</body>
</html>
