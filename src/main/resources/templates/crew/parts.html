<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!-- Fragments for the crew and office user lists. -->

<span th:fragment="status(enabled)"
      th:replace="~{layout/parts :: status(${enabled} ? 'ok' : 'neutral', ${enabled} ? #{user.status.active} : #{user.status.inactive})}">Active</span>

<!-- Row "more" menu of a user: Edit (when editUrl is not null), Activate for an inactive user; then, after the
     divider, Deactivate an active user or Delete an inactive one. -->
<details th:fragment="userMenu(u, editUrl)"
         th:replace="~{layout/parts :: rowMenu(#{common.moreActions(${u.fullName})}, ~{crew/parts :: userMenuItems(${u}, ${editUrl})})}"></details>

<!-- On the ship page's Crew tab (shipTab set) each form sends tab=crew, so CrewController returns there. -->
<th:block th:fragment="userMenuItems(u, editUrl)">
    <a th:if="${editUrl != null}" class="dropdown-item" th:href="${editUrl}" th:text="#{user.edit}">Edit</a>
    <form th:unless="${u.enabled}" th:action="@{/office/users/{id}/activate(id=${u.id})}" method="post">
        <input th:if="${shipTab != null}" type="hidden" name="tab" th:value="${shipTab}">
        <button type="submit" class="dropdown-item" th:text="#{user.activate}">Activate</button>
    </form>
    <hr class="dropdown-divider">
    <!-- Both ask first (layout/parts :: confirmForm). Deactivate is undone by Activate; Delete cannot be undone. -->
    <th:block th:if="${u.enabled}">
        <form th:replace="~{layout/parts :: confirmForm(action=${'/office/users/' + u.id + '/deactivate'}, tab=${shipTab},
                label=#{user.deactivate}, linkClass='dropdown-item dropdown-item-danger',
                title=#{user.deactivate.confirm.title(${u.fullName})}, body=#{user.deactivate.confirm.body(${u.fullName})},
                confirm=#{user.deactivate}, tone='neutral')}"></form>
    </th:block>
    <th:block th:unless="${u.enabled}">
        <form th:replace="~{layout/parts :: confirmForm(action=${'/office/users/' + u.id + '/delete'}, tab=${shipTab},
                label=#{user.delete}, linkClass='dropdown-item dropdown-item-danger',
                title=#{user.delete.confirm.title(${u.fullName})}, body=#{user.delete.confirm.body(${u.fullName}, ${u.email})},
                confirm=#{user.delete}, tone='danger')}"></form>
    </th:block>
</th:block>

</body>
</html>
