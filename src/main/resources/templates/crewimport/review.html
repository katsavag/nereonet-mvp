<!DOCTYPE html>
<!-- Step 3 of the crew import (P24): every crew member from the file, editable. The row filters, the plan and
     "Exclude all rows with errors" are layout/parts :: importSummary; the first two columns (row, full name) stay in
     place when the table scrolls sideways. Every row is a new crew member (an invitation). The cells check themselves
     as they are corrected (P39, js/import-check.js); the server checks everything again. -->
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/layout :: layout(#{crewImport.review.title}, ~{::main})}">
<body>
<main>
    <header th:replace="~{layout/parts :: pageHeader(heading=#{crewImport.review.heading},
            crumbs=~{layout/parts :: importCrumbs(true)}, actions=~{::pageActions})}">
        <th:block th:fragment="pageActions">
            <a class="btn btn-outline-secondary" th:href="@{${flow.path('/map')}}" th:text="#{importFile.review.changeMapping}">Change column mapping</a>
        </th:block>
    </header>
    <nav th:replace="~{layout/parts :: importSteps(3)}"></nav>

    <!-- P18: a file with a Role column (e.g. the template from before): imported, the column ignored. -->
    <th:block th:if="${crewImport.roleColumnIgnored}"><p th:replace="~{layout/parts :: infoNote('roleColumnIgnored',
            #{crewImport.review.roleIgnored})}"></p></th:block>

    <p th:if="${crewImport.rows.isEmpty()}" class="alert alert-warning" th:text="#{crewImport.review.empty}">
        The file has no crew members.</p>

    <form th:action="@{${flow.path('/check')}}" th:object="${crewImport}" method="post" novalidate class="import-review">
        <!-- Enter in a field checks again: the first submit button is the form's default one. -->
        <button type="submit" class="visually-hidden" tabindex="-1" aria-hidden="true" name="show" th:value="${show}"
                th:text="#{importFile.review.check}">Check again</button>
        <div th:replace="~{layout/parts :: importSummary(${crewImport}, ${show})}"></div>

        <div class="card mb-3">
            <p class="card-header bg-transparent small text-body-secondary py-3 mb-0" th:text="#{crewImport.review.hint}">
                Correct the highlighted cells or exclude those rows, then check again.</p>
            <!-- Scrolls sideways inside the card; the row and the name stay in place. -->
            <div class="table-responsive">
                <table class="table align-top mb-0 import-table">
                    <thead>
                    <tr class="small text-body-secondary">
                        <th scope="col" class="import-col-row" th:text="#{importFile.review.row}">Row</th>
                        <th scope="col" class="import-col-name" th:text="#{user.fullName}">Full name</th>
                        <th scope="col" th:text="#{user.email}">Email</th>
                        <th scope="col" th:text="#{user.rank}">Rank</th>
                        <th scope="col" th:text="#{user.ship}">Ship</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="row, stat : *{rows}" th:if="${row.isShownFor(show)}"
                        th:classappend="${row.excluded} ? 'is-excluded'">
                        <td th:replace="~{layout/parts :: importRowHead(${row}, ${stat.index})}"></td>
                        <td th:replace="~{layout/parts :: importTextCell(${row}, ${stat.index}, 'fullName', #{user.fullName},
                                'text', 'user.error.fullNameRequired', 'crewImport.error.tooLong', 'import-col-name')}"></td>
                        <td th:replace="~{layout/parts :: importTextCell(${row}, ${stat.index}, 'email', #{user.email},
                                'email', 'invitation.error.emailRequired', 'crewImport.error.tooLong', null)}"></td>
                        <td>
                            <!-- The rank sets the role (P18): its access in short under it, "Access: Master". -->
                            <select class="form-select form-select-sm" th:field="*{rows[__${stat.index}__].rank}"
                                    th:classappend="${row.errors['rank']} ? 'is-invalid'"
                                    th:attr="aria-label=#{importFile.review.cell(#{user.rank}, ${row.rowNumber})},
                                             aria-describedby=${'rankAccess' + stat.index}, data-access-hint=${'rankAccess' + stat.index},
                                             data-required=#{user.error.rankRequired},
                                             data-server-error=${row.errors['rank'] != null} ? #{${row.errors['rank']}} : null">
                                <option value="" th:text="#{user.chooseRank}">Choose a rank</option>
                                <!-- A value from the file that is not a rank: kept so it can be seen and corrected. -->
                                <option th:if="${!#strings.isEmpty(row.rank) and !rankNames.contains(row.rank)}"
                                        th:value="${row.rank}" th:text="${row.rank}">Captain</option>
                                <th:block th:replace="~{crew/parts :: rankOptions}"></th:block>
                            </select>
                            <div class="invalid-feedback" th:if="${row.errors['rank']}"
                                 th:text="#{${row.errors['rank']}}"></div>
                            <p th:replace="~{crew/parts :: accessHint(${'rankAccess' + stat.index}, ${row.role}, false)}"></p>
                        </td>
                        <td>
                            <select class="form-select form-select-sm" th:field="*{rows[__${stat.index}__].shipImo}"
                                    th:classappend="${row.errors['shipImo']} ? 'is-invalid'"
                                    th:attr="aria-label=#{importFile.review.cell(#{user.ship}, ${row.rowNumber})},
                                             data-required=#{user.error.shipRequired},
                                             data-server-error=${row.errors['shipImo'] != null} ? #{${row.errors['shipImo']}} : null">
                                <option value="" th:text="#{crew.edit.chooseShip}">Choose a ship</option>
                                <!-- A value from the file that names no active ship: kept so it can be seen. -->
                                <option th:if="${!#strings.isEmpty(row.shipImo) and !shipImos.contains(row.shipImo)}"
                                        th:value="${row.shipImo}"
                                        th:text="${row.shipImo.matches('[0-9]+')} ? #{ship.codeValue(${row.shipImo})} : ${row.shipImo}">IMO 1234567</option>
                                <option th:each="s : ${ships}" th:value="${s.imoNumber}"
                                        th:text="${s.name} + ' · ' + #{ship.codeValue(${s.imoNumber})}">MV Demo · IMO 9074729</option>
                            </select>
                            <div class="invalid-feedback" th:if="${row.errors['shipImo']}"
                                 th:text="#{${row.errors['shipImo']}}"></div>
                        </td>
                    </tr>
                    <tr th:replace="~{layout/parts :: importNoRows(${crewImport}, ${show}, 5)}"></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <th:block th:replace="~{layout/parts :: importReviewActions(${crewImport}, ${show},
                #{crewImport.review.submit}, #{crewImport.review.submitHint})}"></th:block>
    </form>
</main>
</body>
</html>
