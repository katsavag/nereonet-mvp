<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/layout :: layout(#{office.title}, ~{::main})}">
<body>
<!-- The office Overview. Model: dashboard (DashboardService.Dashboard), setup (DashboardService.Setup), list (the
     ListQuery of Needs attention: page, sort, the type and vessel filters), groups (every AttentionType.Group),
     overviewUrl (this page as it is, the forms' returnTo) and countries (the Fleet card's flags). The cards are in
     dashboard/parts.html.
     From 1200px the tiles are a row of four over two columns, Needs attention (7/12) and the stacked side cards;
     from 768px the tiles are 2 x 2 and the columns stack; on phones one column, Needs attention first.
     Until the setup checklist is done its next step has the page's one primary button, so New announcement waits;
     while there is no ship or no crew the checklist takes the place of the work list. -->
<main class="overview" th:with="d=${dashboard}, s=${setup}">
    <header th:replace="~{layout/parts :: pageHeader(heading=#{office.heading},
            actions=${s.complete()} ? ~{::pageActions} : null)}">
        <th:block th:fragment="pageActions">
            <a class="btn btn-primary" th:href="@{/office/announcements/new}">
                <svg th:replace="~{layout/parts :: icon('plus')}"></svg>
                <span th:text="#{announcement.new}">New announcement</span>
            </a>
        </th:block>
    </header>

    <section th:replace="~{dashboard/parts :: setup(${s})}"></section>

    <th:block th:if="${s.workListShown()}">
    <ul th:replace="~{dashboard/parts :: tiles(${d})}"></ul>

    <!-- The snooze form of Needs attention: the checked rows' items go to the snooze page. -->
    <form th:replace="~{alert/parts :: snoozeForm('snoozeForm', ${overviewUrl})}"></form>

    <div class="overview-columns">
    <section th:replace="~{dashboard/parts :: attention(${d}, ${list}, ${groups}, ${overviewUrl})}"></section>

    <div class="overview-side">
        <section th:replace="~{dashboard/parts :: upcoming(${d})}"></section>
        <section th:replace="~{dashboard/parts :: fleet(${d})}"></section>
        <section th:replace="~{dashboard/parts :: recent(${d})}"></section>
    </div>
    </div>
    </th:block>
</main>
</body>
</html>
