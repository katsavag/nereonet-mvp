<!DOCTYPE html>
<!-- Default error page, for a status without its own page under templates/error/ (403, 404, 5xx; P12), e.g. 400 or
     405. Spring Boot renders it for any error that no other page handles. See layout/parts :: errorPage. -->
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/layout :: layout(#{error.title}, ~{::main})}">
<body>
<main th:replace="~{layout/parts :: errorPage(#{error.heading}, #{error.text})}"></main>
</body>
</html>
