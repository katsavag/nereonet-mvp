<!DOCTYPE html>
<!-- Default error page. Spring Boot renders templates/error.html for any error that no other page handles. -->
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/layout :: layout(#{error.title}, ~{::main})}">
<body>
<main class="container py-5">
    <div class="login-box mx-auto">
        <!-- The status code is the eyebrow: real context. -->
        <header th:replace="~{layout/parts :: pageHeader(heading=#{error.heading}, eyebrow=#{error.eyebrow(${status})}, subtitle=#{error.text})}"></header>
        <a th:href="@{/}" class="btn btn-primary btn-lg w-100" th:text="#{error.home}">Go to start page</a>
    </div>
</main>
</body>
</html>
