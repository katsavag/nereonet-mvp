<!DOCTYPE html>
<!-- Default error page. Spring Boot renders templates/error.html for any error that no other page handles. -->
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/layout :: layout(~{::title}, ~{::main})}">
<head>
    <title th:text="#{error.title}">Something went wrong</title>
</head>
<body>
<main class="container py-5">
    <div class="login-box mx-auto">
        <p class="eyebrow mb-1" th:text="#{error.eyebrow(${status})}">Error 500</p>
        <h1 class="fw-bold mb-3" th:text="#{error.heading}">Something went wrong</h1>
        <p class="mb-4" th:text="#{error.text}">An unexpected error occurred. Please try again.</p>
        <a th:href="@{/}" class="btn btn-primary btn-lg w-100" th:text="#{error.home}">Go to start page</a>
    </div>
</main>
</body>
</html>
