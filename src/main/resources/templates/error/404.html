<!DOCTYPE html>
<!-- Error page (P12), 404: no such page or record, e.g. an unknown library item id.
     Spring Boot picks error/<status>.html, then error/<series>xx.html, then error.html. See layout/parts :: errorPage. -->
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/layout :: layout(#{error.404.title}, ~{::main})}">
<body>
<main th:replace="~{layout/parts :: errorPage(#{error.404.title}, #{error.404.text})}"></main>
</body>
</html>
