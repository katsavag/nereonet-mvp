<!DOCTYPE html>
<!-- Step 4 of an import (P24): what the import did, once, right after it (flash attribute "importResult",
     core/importfile/ImportResult); opened again later it leads to the list. -->
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/layout :: layout(#{importFile.done.title}, ~{::main})}">
<body>
<main>
    <header th:replace="~{layout/parts :: pageHeader(heading=#{importFile.done.heading},
            crumbs=~{layout/parts :: importCrumbs(true)}, eyebrowShip=${flow.ship()})}"></header>
    <nav th:replace="~{layout/parts :: importSteps(4)}"></nav>

    <section class="card form-box" aria-labelledby="doneTitle">
        <div class="card-body p-3 p-md-4">
            <h2 class="visually-hidden" id="doneTitle" th:text="#{importFile.done.counts}">Rows</h2>
            <dl class="import-counts">
                <div class="import-count">
                    <dt th:text="#{${flow.key('done.created')}}">Invited</dt>
                    <dd class="num" th:text="${importResult.created()}">8</dd>
                </div>
                <div class="import-count">
                    <dt th:text="#{importFile.done.updated}">Updated</dt>
                    <dd class="num" th:text="${importResult.updated()}">0</dd>
                </div>
                <div class="import-count">
                    <dt th:text="#{importFile.done.skipped}">Skipped</dt>
                    <dd class="num" th:text="${importResult.skipped()}">2</dd>
                </div>
            </dl>
            <p class="form-text" th:text="#{${flow.key('done.hint')}}">Each new crew member got an invitation email.
                Skipped rows were excluded or changed nothing.</p>
            <div class="form-actions">
                <a class="btn btn-primary" th:href="@{${flow.listPath()}}" th:text="#{${flow.key('done.toList')}}">Go to crew</a>
                <a class="btn btn-outline-secondary" th:href="@{${flow.basePath()}}" th:text="#{importFile.done.another}">Import another file</a>
            </div>
        </div>
    </section>
</main>
</body>
</html>
