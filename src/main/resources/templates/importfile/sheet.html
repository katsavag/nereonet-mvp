<!DOCTYPE html>
<!-- Step 1 of an import (P24): a workbook with several sheets. The sheet that looks most like the import (the most
     columns recognised) is chosen already. -->
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/layout :: layout(#{importFile.sheet.title}, ~{::main})}">
<body>
<main>
    <header th:replace="~{layout/parts :: pageHeader(heading=#{importFile.sheet.heading},
            crumbs=~{layout/parts :: importCrumbs(true)}, eyebrowShip=${flow.ship()})}"></header>
    <nav th:replace="~{layout/parts :: importSteps(1)}"></nav>

    <div class="card form-box">
        <div class="card-body p-3 p-md-4">
            <form th:action="@{${flow.path('/sheet')}}" method="post">
                <fieldset>
                    <legend class="form-group-legend"
                            th:text="#{importFile.sheet.legend(${upload.filename}, ${upload.sheets.size()})}">
                        crew.xlsx has 3 sheets. Which one holds the rows to import?</legend>
                    <div class="import-sheets">
                        <label th:each="s, st : ${upload.sheets}" class="import-sheet">
                            <input type="radio" class="form-check-input" name="sheet" th:value="${st.index}"
                                   th:checked="${st.index == upload.sheetIndex}">
                            <span class="import-sheet-text">
                                <span class="import-sheet-name" th:text="${s.name()}">Crew</span>
                                <span class="import-sheet-meta" th:text="#{importFile.sheet.rows(${s.rows().size()})}">11 rows</span>
                                <span class="import-sheet-columns" th:text="${s.columnsPreview()}">Full name · Email · Rank</span>
                            </span>
                        </label>
                    </div>
                </fieldset>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary" th:text="#{importFile.continue}">Continue</button>
                    <button type="submit" class="btn btn-ghost" th:formaction="@{${flow.path('/cancel')}}"
                            th:data-busy-label="#{importFile.cancelling}" th:text="#{form.cancel}">Cancel</button>
                </div>
            </form>
        </div>
    </div>
</main>
</body>
</html>
