<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/layout :: layout(#{invitation.crew.title}, ~{::main})}">
<body>
<!-- Standalone page until the ship page exists; then this form becomes a modal there. The ship comes from the URL.
     The email is asked once; the success message names the address it went to. -->
<main>
    <header th:replace="~{layout/parts :: pageHeader(heading=#{invitation.crew.heading}, crumbs=~{::pageCrumbs}, eyebrow=${ship.name} + ' · ' + #{ship.codeValue(${ship.imoNumber})})}">
        <th:block th:fragment="pageCrumbs">
            <li th:replace="~{layout/parts :: crumb(#{nav.ships}, '/office/ships')}"></li>
            <li th:replace="~{layout/parts :: crumb(${ship.name}, ${'/office/ships/' + ship.id + '/library'})}"></li>
        </th:block>
    </header>

    <div class="card form-box">
        <div class="card-body p-3 p-md-4">
            <form th:action="@{/office/ships/{id}/invitations/new(id=${ship.id})}" th:object="${form}"
                  method="post" novalidate>
                <div th:replace="~{layout/parts :: errorSummary(${form}, '')}"></div>
                <div class="form-grid">
                    <div>
                        <label for="fullName" class="form-label" th:text="#{invitation.fullName}">Full name</label>
                        <input type="text" th:field="*{fullName}" class="form-control"
                               th:errorclass="is-invalid" autocomplete="off" aria-describedby="fullNameCounter" required>
                        <div class="invalid-feedback" th:errors="*{fullName}"></div>
                        <div class="form-meta">
                            <div th:replace="~{layout/parts :: counter(${form}, 'fullName', 'fullName')}"></div>
                        </div>
                    </div>
                    <div>
                        <label for="email" class="form-label" th:text="#{invitation.email}">Email</label>
                        <input type="email" th:field="*{email}" class="form-control"
                               th:errorclass="is-invalid" autocomplete="off" aria-describedby="emailCounter" required>
                        <div class="invalid-feedback" th:errors="*{email}"></div>
                        <div class="form-meta">
                            <div th:replace="~{layout/parts :: counter(${form}, 'email', 'email')}"></div>
                        </div>
                    </div>
                    <div class="field-half">
                        <label for="role" class="form-label" th:text="#{invitation.role}">Role</label>
                        <select th:field="*{role}" class="form-select" th:errorclass="is-invalid" required>
                            <option value="" th:text="#{invitation.form.chooseRole}">Choose a role</option>
                            <option th:each="r : ${roles}" th:value="${r}" th:text="#{${'role.' + r}}">Crew member</option>
                        </select>
                        <div class="invalid-feedback" th:errors="*{role}"></div>
                    </div>
                    <div class="field-half">
                        <label for="rank" class="form-label">[[#{user.rank}]] <span th:replace="~{layout/parts :: optional}"></span></label>
                        <select th:field="*{rank}" class="form-select" th:errorclass="is-invalid">
                            <option value="" th:text="#{user.chooseRank}">Choose a rank</option>
                            <option th:each="r : ${ranks}" th:value="${r}" th:text="#{${'rank.' + r}}">Second Officer</option>
                        </select>
                        <div class="invalid-feedback" th:errors="*{rank}"></div>
                    </div>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary" th:text="#{invitation.form.submit}">Send invitation</button>
                    <a class="btn btn-ghost" th:href="@{/office/crew(shipId=${ship.id})}" th:text="#{form.cancel}">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</main>
</body>
</html>
