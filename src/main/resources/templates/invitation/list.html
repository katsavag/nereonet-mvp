<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/layout :: layout(#{invitation.list.title}, ~{::main})}">
<body>
<main>
    <header th:replace="~{layout/parts :: pageHeader(heading=#{invitation.list.heading}, count=${invitations.size()}, actions=~{::pageActions})}">
        <th:block th:fragment="pageActions">
            <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#inviteModal">
                <svg th:replace="~{layout/parts :: icon('plus')}"></svg>
                <span th:text="#{invitation.list.invite}">Invite office user</span>
            </button>
        </th:block>
    </header>

    <!-- Filter. A GET form, so the filtered page can be bookmarked. -->
    <form class="row g-2 align-items-end mb-4" th:action="@{/office/invitations}" th:object="${filter}" method="get">
        <div class="col-12 col-sm-6 col-lg-4">
            <label for="status" class="form-label fw-semibold small" th:text="#{invitation.status}">Status</label>
            <select th:field="*{status}" class="form-select">
                <option value="" th:text="#{invitation.filter.allStatuses}">All statuses</option>
                <option th:each="st : ${statuses}" th:value="${st}"
                        th:text="#{${'invitation.status.' + st}}">Pending</option>
            </select>
        </div>
        <div class="col-12 col-sm-auto d-flex gap-2">
            <button type="submit" class="btn btn-outline-secondary flex-grow-1" th:text="#{invitation.filter.apply}">Filter</button>
            <a class="btn btn-ghost" th:href="@{/office/invitations}" th:text="#{invitation.filter.clear}">Clear</a>
        </div>
    </form>

    <div class="card">
        <p th:if="${invitations.isEmpty()}" class="card-body text-body-secondary mb-0"
           th:text="#{invitation.list.empty}">No invitations yet.</p>

        <!-- data-table: the shared list style; data-table-stack: one stacked card per row on phones. -->
        <div th:unless="${invitations.isEmpty()}" class="table-responsive">
            <table class="table data-table data-table-stack align-middle mb-0">
                <thead>
                <tr>
                    <th scope="col" th:text="#{invitation.fullName}">Full name</th>
                    <th scope="col" th:text="#{invitation.email}">Email</th>
                    <th scope="col" th:text="#{invitation.expires}">Expires</th>
                    <th scope="col" th:text="#{invitation.status}">Status</th>
                    <th scope="col"><span class="visually-hidden" th:text="#{invitation.actions}">Actions</span></th>
                </tr>
                </thead>
                <tbody>
                <!-- Invitations have no page of their own, so the name is not a link. -->
                <tr th:each="inv : ${invitations}">
                    <td class="cell-primary" th:text="${inv.fullName}">Jane Doe</td>
                    <td th:attr="data-label=#{invitation.email}">
                        <span th:replace="~{layout/parts :: email(${inv.email})}">jane@example.com</span>
                    </td>
                    <td th:attr="data-label=#{invitation.expires}">
                        <time th:replace="~{layout/parts :: localTime(${inv.expiresAt})}"></time>
                    </td>
                    <td class="cell-status" th:with="st=${inv.displayStatus.name()}">
                        <span th:replace="~{layout/parts :: status(${st == 'PENDING'} ? 'primary' : (${st == 'EXPIRED'} ? 'warning' : (${st == 'ACCEPTED'} ? 'ok' : 'neutral')), #{${'invitation.status.' + st}})}">Pending</span>
                    </td>
                    <td class="cell-actions">
                        <!-- PENDING, expired or not. -->
                        <div th:if="${inv.status.name() == 'PENDING'}" class="row-actions">
                            <form th:action="@{/office/invitations/{id}/resend(id=${inv.id})}" method="post">
                                <button type="submit" class="btn btn-ghost btn-sm"
                                        th:text="#{invitation.resend}">Resend</button>
                            </form>
                            <details th:replace="~{layout/parts :: rowMenu(#{common.moreActions(${inv.fullName})}, ~{::invitationMenuItems})}">
                                <th:block th:fragment="invitationMenuItems">
                                    <hr class="dropdown-divider">
                                    <form th:action="@{/office/invitations/{id}/cancel(id=${inv.id})}" method="post">
                                        <button type="submit" class="dropdown-item dropdown-item-danger"
                                                th:text="#{invitation.cancel}">Cancel</button>
                                    </form>
                                </th:block>
                            </details>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Invite office user. Full screen on phones. The email is asked once; the success message names the address it went to. -->
    <div class="modal fade" id="inviteModal" tabindex="-1" aria-labelledby="inviteModalTitle" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-fullscreen-sm-down">
            <form class="modal-content" th:action="@{/office/invitations}" th:object="${form}" method="post" novalidate>
                <div class="modal-header">
                    <h2 class="modal-title h5 fw-bold" id="inviteModalTitle"
                        th:text="#{invitation.office.heading}">Invite office user</h2>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"
                            th:attr="aria-label=#{common.close}"></button>
                </div>
                <div class="modal-body">
                    <div th:replace="~{layout/parts :: errorSummary(${form}, '')}"></div>
                    <div class="form-grid">
                        <div>
                            <label for="fullName" class="form-label" th:text="#{invitation.fullName}">Full name</label>
                            <input type="text" th:field="*{fullName}" class="form-control"
                                   th:errorclass="is-invalid" autocomplete="off" aria-describedby="fullNameCounter" required>
                            <div class="invalid-feedback" th:errors="*{fullName}"></div>
                            <div class="form-meta">
                                <div th:replace="~{layout/parts :: counter(${form}, 'fullName', 'fullName')}"></div>
                            </div>
                        </div>
                        <div>
                            <label for="email" class="form-label" th:text="#{invitation.email}">Email</label>
                            <input type="email" th:field="*{email}" class="form-control"
                                   th:errorclass="is-invalid" autocomplete="off" aria-describedby="emailCounter" required>
                            <div class="invalid-feedback" th:errors="*{email}"></div>
                            <div class="form-meta">
                                <div th:replace="~{layout/parts :: counter(${form}, 'email', 'email')}"></div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-ghost" data-bs-dismiss="modal"
                            th:text="#{form.cancel}">Cancel</button>
                    <button type="submit" class="btn btn-primary" th:text="#{invitation.form.submit}">Send invitation</button>
                </div>

                <!-- The form was posted with errors: open the modal again so they are visible. -->
                <script th:if="${#fields.hasAnyErrors()}">
                    document.addEventListener('DOMContentLoaded',
                        () => bootstrap.Modal.getOrCreateInstance('#inviteModal').show());
                </script>
            </form>
        </div>
    </div>
</main>
</body>
</html>
