<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/layout :: layout((${item == null} ? #{item.new.heading} : #{item.edit.heading}), ~{::main})}">
<body>
<!-- Add and edit. item is null when adding. -->
<main class="form-page form-page-aside">
    <header th:replace="~{layout/parts :: pageHeader(heading=${item == null} ? #{item.new.heading} : #{item.edit.heading}, crumbs=~{::pageCrumbs}, eyebrowShip=${ship})}">
        <th:block th:fragment="pageCrumbs">
            <th:block th:replace="~{ship/parts :: crumbs(${ship}, 'items')}"></th:block>
        </th:block>
    </header>

    <div class="card form-box">
        <div class="card-body p-3 p-md-4">
            <form th:object="${form}" method="post" novalidate
                  th:action="${item == null} ? @{/office/ships/{id}/items/new(id=${ship.id})} : @{/office/ships/{id}/items/{itemId}/edit(id=${ship.id},itemId=${item.id})}">
                <div th:replace="~{layout/parts :: errorSummary(${form}, '')}"></div>
                <div class="form-grid">
                    <div>
                        <label for="name" class="form-label" th:text="#{item.name}">Name</label>
                        <input type="text" th:field="*{name}" class="form-control" th:errorclass="is-invalid"
                               autocomplete="off" aria-describedby="nameCounter" required>
                        <div class="invalid-feedback" th:errors="*{name}"></div>
                        <div class="form-meta">
                            <div th:replace="~{layout/parts :: counter(${form}, 'name', 'name')}"></div>
                        </div>
                    </div>
                    <div class="field-half">
                        <label for="unit" class="form-label" th:text="#{item.unit}">Unit</label>
                        <input type="text" th:field="*{unit}" class="form-control" th:errorclass="is-invalid"
                               autocomplete="off" aria-describedby="unitHint unitCounter" required>
                        <div class="invalid-feedback" th:errors="*{unit}"></div>
                        <div class="form-meta">
                            <div id="unitHint" class="form-text" th:text="#{item.unitHint}">For example kg, lt or pcs.</div>
                            <div th:replace="~{layout/parts :: counter(${form}, 'unit', 'unit')}"></div>
                        </div>
                    </div>
                    <div class="field-half">
                        <label for="category" class="form-label" th:text="#{item.category}">Category</label>
                        <select th:field="*{category}" class="form-select" th:errorclass="is-invalid"
                                aria-describedby="categoryHint" required>
                            <option value="" th:text="#{item.categoryChoose}">Choose a category</option>
                            <option th:each="c : ${categories}" th:value="${c.name()}"
                                    th:text="#{${c.labelKey()}}">Provisions</option>
                        </select>
                        <div class="invalid-feedback" th:errors="*{category}"></div>
                        <div class="form-meta">
                            <div id="categoryHint" class="form-text" th:text="#{item.categoryHint}">Provisions: food and drink for the meals. Personal items: what the crew buy for themselves.</div>
                        </div>
                    </div>
                    <!-- Shown only while Category is Provisions (js/forms.js, data-shown-for); without the script it
                         stays visible, and ItemService does not save the place of a personal item. -->
                    <div class="field-half" data-shown-for="category" data-shown-value="PROVISIONS"
                         th:hidden="${form.category != null and form.category.name() != 'PROVISIONS'}">
                        <label for="place" class="form-label">[[#{item.place}]] <span th:replace="~{layout/parts :: optional}"></span></label>
                        <input type="text" th:field="*{place}" class="form-control" th:errorclass="is-invalid"
                               autocomplete="off" aria-describedby="placeHint placeCounter">
                        <div class="invalid-feedback" th:errors="*{place}"></div>
                        <div class="form-meta">
                            <div id="placeHint" class="form-text" th:text="#{item.placeHint}">For example Dry store or Cold room.</div>
                            <div th:replace="~{layout/parts :: counter(${form}, 'place', 'place')}"></div>
                        </div>
                    </div>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary" th:text="#{form.save}">Save</button>
                    <a class="btn btn-ghost" th:href="@{/office/ships/{id}/items(id=${ship.id})}"
                       th:text="#{form.cancel}">Cancel</a>
                </div>
            </form>
        </div>
    </div>
    <!-- The ship this form changes, beside it from 1200px (P29). -->
    <section th:replace="~{ship/parts :: formAside(${ship})}"></section>
</main>
</body>
</html>
