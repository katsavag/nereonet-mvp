<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/layout :: layout((${item == null} ? #{item.new.heading} : #{item.edit.heading}), ~{::main})}">
<body>
<!-- Add and edit. item is null when adding. -->
<main>
    <header th:replace="~{layout/parts :: pageHeader(heading=${item == null} ? #{item.new.heading} : #{item.edit.heading}, crumbs=~{::pageCrumbs}, eyebrow=${ship.name} + ' · ' + #{ship.codeValue(${ship.imoNumber})})}">
        <th:block th:fragment="pageCrumbs">
            <li th:replace="~{layout/parts :: crumb(#{nav.ships}, '/office/ships')}"></li>
            <li th:replace="~{layout/parts :: crumb(${ship.name}, ${'/office/ships/' + ship.id + '/library'})}"></li>
            <li th:replace="~{layout/parts :: crumb(#{item.list.heading}, ${'/office/ships/' + ship.id + '/items'})}"></li>
        </th:block>
    </header>

    <div class="card form-box">
        <div class="card-body p-3 p-md-4">
            <form th:object="${form}" method="post" novalidate
                  th:action="${item == null} ? @{/office/ships/{id}/items/new(id=${ship.id})} : @{/office/ships/{id}/items/{itemId}/edit(id=${ship.id},itemId=${item.id})}">
                <div th:replace="~{layout/parts :: errorSummary(${form}, '')}"></div>
                <div class="form-grid">
                    <div>
                        <label for="name" class="form-label" th:text="#{item.name}">Name</label>
                        <input type="text" th:field="*{name}" class="form-control" th:errorclass="is-invalid"
                               autocomplete="off" aria-describedby="nameCounter" required>
                        <div class="invalid-feedback" th:errors="*{name}"></div>
                        <div class="form-meta">
                            <div th:replace="~{layout/parts :: counter(${form}, 'name', 'name')}"></div>
                        </div>
                    </div>
                    <div class="field-half">
                        <label for="unit" class="form-label" th:text="#{item.unit}">Unit</label>
                        <input type="text" th:field="*{unit}" class="form-control" th:errorclass="is-invalid"
                               autocomplete="off" aria-describedby="unitHint unitCounter" required>
                        <div class="invalid-feedback" th:errors="*{unit}"></div>
                        <div class="form-meta">
                            <div id="unitHint" class="form-text" th:text="#{item.unitHint}">For example kg, lt or pcs.</div>
                            <div th:replace="~{layout/parts :: counter(${form}, 'unit', 'unit')}"></div>
                        </div>
                    </div>
                    <div class="field-half">
                        <label for="category" class="form-label">[[#{item.category}]] <span th:replace="~{layout/parts :: optional}"></span></label>
                        <input type="text" th:field="*{category}" class="form-control" th:errorclass="is-invalid"
                               autocomplete="off" aria-describedby="categoryHint categoryCounter">
                        <div class="invalid-feedback" th:errors="*{category}"></div>
                        <div class="form-meta">
                            <div id="categoryHint" class="form-text" th:text="#{item.categoryHint}">For example Dry goods.</div>
                            <div th:replace="~{layout/parts :: counter(${form}, 'category', 'category')}"></div>
                        </div>
                    </div>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary" th:text="#{form.save}">Save</button>
                    <a class="btn btn-ghost" th:href="@{/office/ships/{id}/items(id=${ship.id})}"
                       th:text="#{form.cancel}">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</main>
</body>
</html>
