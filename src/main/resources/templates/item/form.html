<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/layout :: layout(~{::title}, ~{::main})}">
<head>
    <!-- Add and edit. item is null when adding. -->
    <title th:text="${item == null} ? #{item.new.heading} : #{item.edit.heading}">Add item</title>
</head>
<body>
<main>
    <p class="eyebrow mb-1" th:text="${ship.name} + ' · ' + #{ship.codeValue(${ship.imoNumber})}">MV Demo · IMO 9074729</p>
    <h1 class="fw-bold mb-4" th:text="${item == null} ? #{item.new.heading} : #{item.edit.heading}">Add item</h1>

    <div class="card form-box">
        <div class="card-body p-3 p-md-4">
            <form th:object="${form}" method="post" novalidate
                  th:action="${item == null} ? @{/office/ships/{id}/items/new(id=${ship.id})} : @{/office/ships/{id}/items/{itemId}/edit(id=${ship.id},itemId=${item.id})}">
                <div class="mb-3">
                    <label for="name" class="form-label fw-semibold" th:text="#{item.name}">Name</label>
                    <input type="text" th:field="*{name}" class="form-control" th:errorclass="is-invalid"
                           autocomplete="off" required>
                    <div class="invalid-feedback" th:errors="*{name}"></div>
                </div>
                <div class="mb-3">
                    <label for="unit" class="form-label fw-semibold" th:text="#{item.unit}">Unit</label>
                    <input type="text" th:field="*{unit}" class="form-control" th:errorclass="is-invalid"
                           autocomplete="off" aria-describedby="unitHint" required>
                    <div class="invalid-feedback" th:errors="*{unit}"></div>
                    <div id="unitHint" class="form-text" th:text="#{item.unitHint}">For example kg, lt or pcs.</div>
                </div>
                <div class="mb-4">
                    <label for="category" class="form-label fw-semibold" th:text="#{item.category}">Category</label>
                    <input type="text" th:field="*{category}" class="form-control" th:errorclass="is-invalid"
                           autocomplete="off" aria-describedby="categoryHint">
                    <div class="invalid-feedback" th:errors="*{category}"></div>
                    <div id="categoryHint" class="form-text" th:text="#{item.categoryHint}">Optional, e.g. Dry goods.</div>
                </div>
                <div class="d-flex flex-wrap gap-2">
                    <button type="submit" class="btn btn-primary" th:text="#{item.form.save}">Save</button>
                    <a class="btn btn-outline-secondary" th:href="@{/office/ships/{id}/items(id=${ship.id})}"
                       th:text="#{item.form.cancel}">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</main>
</body>
</html>
