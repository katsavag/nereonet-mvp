<!DOCTYPE html>
<!-- Step 3 of the item import (P24): every item from the file, editable. The row filters, the plan and "Exclude all
     rows with errors" are layout/parts :: importSummary; the first two columns (row, name) stay in place when the
     table scrolls sideways. Each row says what it does: a new item, an update of the item with that name (unit,
     category and place), or no change (skipped). Category is the file's text: Provisions or Personal items. The cells
     check themselves as they are corrected (P39, js/import-check.js); the server checks everything again. -->
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/layout :: layout(#{itemImport.review.title}, ~{::main})}">
<body>
<main>
    <header th:replace="~{layout/parts :: pageHeader(heading=#{itemImport.review.heading},
            crumbs=~{layout/parts :: importCrumbs(true)}, actions=~{::pageActions}, eyebrowShip=${ship})}">
        <th:block th:fragment="pageActions">
            <a class="btn btn-outline-secondary" th:href="@{${flow.path('/map')}}" th:text="#{importFile.review.changeMapping}">Change column mapping</a>
        </th:block>
    </header>
    <nav th:replace="~{layout/parts :: importSteps(3)}"></nav>

    <p th:if="${itemImport.rows.isEmpty()}" class="alert alert-warning" th:text="#{itemImport.review.empty}">
        The file has no items.</p>

    <form th:action="@{${flow.path('/check')}}" th:object="${itemImport}" method="post" novalidate class="import-review">
        <!-- Enter in a field checks again: the first submit button is the form's default one. -->
        <button type="submit" class="visually-hidden" tabindex="-1" aria-hidden="true" name="show" th:value="${show}"
                th:text="#{importFile.review.check}">Check again</button>
        <div th:replace="~{layout/parts :: importSummary(${itemImport}, ${show})}"></div>

        <div class="card mb-3">
            <p class="card-header bg-transparent small text-body-secondary py-3 mb-0" th:text="#{itemImport.review.hint}">
                Correct the highlighted cells or exclude those rows, then check again.</p>
            <!-- Scrolls sideways inside the card; the row and the name stay in place. -->
            <div class="table-responsive">
                <table class="table align-top mb-0 import-table">
                    <thead>
                    <tr class="small text-body-secondary">
                        <th scope="col" class="import-col-row" th:text="#{importFile.review.row}">Row</th>
                        <th scope="col" class="import-col-name" th:text="#{item.name}">Name</th>
                        <th scope="col" th:text="#{item.unit}">Unit</th>
                        <th scope="col" th:text="#{item.category}">Category</th>
                        <th scope="col" th:text="#{item.place}">Place</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="row, stat : *{rows}" th:if="${row.isShownFor(show)}"
                        th:classappend="${row.excluded} ? 'is-excluded'">
                        <td th:replace="~{layout/parts :: importRowHead(${row}, ${stat.index})}"></td>
                        <td th:replace="~{layout/parts :: importTextCell(${row}, ${stat.index}, 'name', #{item.name},
                                'text', 'item.error.nameRequired', 'item.error.tooLong', 'import-col-name')}"></td>
                        <td th:replace="~{layout/parts :: importTextCell(${row}, ${stat.index}, 'unit', #{item.unit},
                                'text', 'item.error.unitRequired', 'item.error.tooLong', null)}"></td>
                        <td th:replace="~{layout/parts :: importTextCell(${row}, ${stat.index}, 'category', #{item.category},
                                'text', 'item.error.categoryRequired', 'item.error.tooLong', null)}"></td>
                        <td th:replace="~{layout/parts :: importTextCell(${row}, ${stat.index}, 'place', #{item.place},
                                'text', null, 'item.error.tooLong', null)}"></td>
                    </tr>
                    <tr th:replace="~{layout/parts :: importNoRows(${itemImport}, ${show}, 5)}"></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <th:block th:replace="~{layout/parts :: importReviewActions(${itemImport}, ${show},
                #{itemImport.review.submit}, #{itemImport.review.submitHint})}"></th:block>
    </form>
</main>
</body>
</html>
