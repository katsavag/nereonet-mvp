<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/layout :: layout(${ship.name} + ' · ' + #{ship.tab.items}, ~{::main})}">
<body>
<!-- The Items tab of the ship page (see ship/ShipFrame). No items yet (P25): the empty state holds Add item and Import,
     so the tab heading leaves them out. -->
<main th:with="noItems=${list.emptyUnfiltered(items)}">
    <th:block th:replace="~{ship/parts :: header}"></th:block>
    <div th:replace="~{ship/parts :: tabHeading(#{item.list.heading}, ${noItems} ? null : ~{::tabActions})}">
        <th:block th:fragment="tabActions">
            <a class="btn btn-primary" th:href="@{/office/ships/{id}/items/new(id=${ship.id})}">
                <svg th:replace="~{layout/parts :: icon('plus')}"></svg>
                <span th:text="#{item.list.add}">Add item</span>
            </a>
            <a class="btn btn-outline-secondary" th:href="@{/office/ships/{id}/items/import(id=${ship.id})}">
                <svg th:replace="~{layout/parts :: icon('upload')}"></svg>
                <span th:text="#{item.list.import}">Import</span>
            </a>
        </th:block>
    </div>

    <!-- Search, filters and chips (P19). A GET form, so the filtered page can be bookmarked. -->
    <div th:replace="~{layout/parts :: filterBar(${list}, #{item.search}, ~{::listFilters})}">
        <th:block th:fragment="listFilters">
            <div class="filter-field">
                <label for="filterStatus" class="form-label" th:text="#{item.status}">Status</label>
                <select id="filterStatus" name="status" class="form-select">
                    <option value="" th:text="#{item.filter.allStatuses}">All statuses</option>
                    <option value="active" th:selected="${status == 'active'}" th:text="#{item.status.active}">Active</option>
                    <option value="inactive" th:selected="${status == 'inactive'}" th:text="#{item.status.inactive}">Inactive</option>
                </select>
            </div>
            <div class="filter-field">
                <label for="filterCategory" class="form-label" th:text="#{item.category}">Category</label>
                <select id="filterCategory" name="category" class="form-select">
                    <option value="" th:text="#{item.filter.allCategories}">All categories</option>
                    <option th:each="c : ${categories}" th:value="${c.name()}" th:selected="${c == category}"
                            th:text="#{${c.labelKey()}}">Provisions</option>
                </select>
            </div>
        </th:block>
    </div>

    <div class="card">
        <th:block th:replace="~{layout/parts :: listEmpty(rows=${items}, list=${list}, icon='items',
                title=#{item.list.empty.title}, text=#{item.list.empty.text}, action=~{::tabActions})}"></th:block>

        <!-- data-table: the shared list style; data-table-stack: one stacked card per row on phones; table-sticky:
             the header stays visible while the page scrolls. -->
        <div th:unless="${items.isEmpty()}" class="table-responsive table-sticky">
            <table class="table data-table data-table-stack align-middle mb-0">
                <thead>
                <tr>
                    <th th:replace="~{layout/parts :: sortHeader(${list}, 'name', #{item.name})}"></th>
                    <th th:replace="~{layout/parts :: sortHeader(${list}, 'unit', #{item.unit})}"></th>
                    <th th:replace="~{layout/parts :: sortHeader(${list}, 'category', #{item.category})}"></th>
                    <th th:replace="~{layout/parts :: sortHeader(${list}, 'place', #{item.place})}"></th>
                    <th th:replace="~{layout/parts :: sortHeader(${list}, 'status', #{item.status})}"></th>
                    <th scope="col"><span class="visually-hidden" th:text="#{item.actions}">Actions</span></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="i : ${items}" th:classappend="${!i.active} ? 'text-body-secondary'">
                    <td class="cell-primary">
                        <a th:href="@{/office/ships/{id}/items/{itemId}/edit(id=${ship.id},itemId=${i.id})}"
                           th:text="${i.name}">Rice</a>
                    </td>
                    <td th:attr="data-label=#{item.unit}" th:text="${i.unit}">kg</td>
                    <td th:attr="data-label=#{item.category}" th:text="#{${i.category.labelKey()}}">Provisions</td>
                    <td th:attr="data-label=#{item.place}" th:text="${i.place} ?: '—'">Dry store</td>
                    <td class="cell-status">
                        <span th:replace="~{layout/parts :: status(${i.active} ? 'ok' : 'neutral', ${i.active} ? #{item.status.active} : #{item.status.inactive})}">Active</span>
                    </td>
                    <td class="cell-actions">
                        <div class="row-actions">
                            <details th:replace="~{layout/parts :: rowMenu(#{common.moreActions(${i.name})}, ~{::itemMenuItems})}">
                                <th:block th:fragment="itemMenuItems">
                                    <a class="dropdown-item"
                                       th:href="@{/office/ships/{id}/items/{itemId}/edit(id=${ship.id},itemId=${i.id})}"
                                       th:text="#{item.edit}">Edit</a>
                                    <form th:unless="${i.active}" method="post"
                                          th:action="@{/office/ships/{id}/items/{itemId}/activate(id=${ship.id},itemId=${i.id})}">
                                        <button type="submit" class="dropdown-item"
                                                th:text="#{item.activate}">Activate</button>
                                    </form>
                                    <th:block th:if="${i.active}">
                                        <hr class="dropdown-divider">
                                        <form th:replace="~{layout/parts :: confirmForm(
                                                action=${'/office/ships/' + ship.id + '/items/' + i.id + '/deactivate'},
                                                label=#{item.deactivate}, linkClass='dropdown-item dropdown-item-danger',
                                                title=#{item.deactivate.confirm.title(${i.name})},
                                                body=#{item.deactivate.confirm.body(${i.name}, ${ship.name})},
                                                confirm=#{item.deactivate}, tone='neutral')}"></form>
                                    </th:block>
                                </th:block>
                            </details>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
        <nav th:replace="~{layout/parts :: pager(${items}, ${list})}"></nav>
    </div>
</main>
</body>
</html>
