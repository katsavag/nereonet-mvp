<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/layout :: layout(~{::title}, ~{::main})}">
<head>
    <title th:text="#{item.list.title}">Galley items</title>
</head>
<body>
<main>
    <div class="d-flex flex-wrap align-items-end justify-content-between gap-3 mb-4">
        <div>
            <p class="eyebrow mb-1" th:text="${ship.name} + ' · ' + #{ship.codeValue(${ship.imoNumber})}">MV Demo · IMO 9074729</p>
            <h1 class="fw-bold mb-0" th:text="#{item.list.heading}">Galley items</h1>
        </div>
        <div class="page-actions">
            <a class="btn btn-primary" th:href="@{/office/ships/{id}/items/new(id=${ship.id})}">
                <svg th:replace="~{layout/parts :: icon('plus')}"></svg>
                <span th:text="#{item.list.add}">Add item</span>
            </a>
            <a class="btn btn-outline-secondary" th:href="@{/office/ships/{id}/items/import(id=${ship.id})}">
                <svg th:replace="~{layout/parts :: icon('upload')}"></svg>
                <span th:text="#{item.list.import}">Import</span>
            </a>
        </div>
    </div>

    <!-- After an import (flash attributes from ItemImportController). -->
    <div th:if="${importedCount != null}" class="alert alert-success" role="status">
        <p class="mb-0" th:text="#{itemImport.added(${importedCount})}">12 items added.</p>
        <p th:unless="${skippedNames.isEmpty()}" class="mt-1 mb-0">
            <span th:text="#{itemImport.skipped(${skippedNames.size()})}">2 skipped because the ship already has them:</span>
            <span th:text="${#strings.listJoin(skippedNames, ', ')}">Rice, Flour</span>
        </p>
    </div>

    <div class="card">
        <div class="card-header bg-transparent py-3">
            <h2 th:replace="~{layout/parts :: cardTitle(#{item.list.heading}, ${items.size()})}">Galley items · 3</h2>
        </div>

        <p th:if="${items.isEmpty()}" class="card-body text-body-secondary mb-0"
           th:text="#{item.list.empty}">No items yet.</p>

        <!-- data-table: the shared list style; data-table-stack: one stacked card per row on phones. -->
        <div th:unless="${items.isEmpty()}" class="table-responsive">
            <table class="table data-table data-table-stack align-middle mb-0">
                <thead>
                <tr>
                    <th scope="col" th:text="#{item.name}">Name</th>
                    <th scope="col" th:text="#{item.unit}">Unit</th>
                    <th scope="col" th:text="#{item.category}">Category</th>
                    <th scope="col" th:text="#{item.status}">Status</th>
                    <th scope="col"><span class="visually-hidden" th:text="#{item.actions}">Actions</span></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="i : ${items}" th:classappend="${!i.active} ? 'text-body-secondary'">
                    <td class="cell-primary">
                        <a th:href="@{/office/ships/{id}/items/{itemId}/edit(id=${ship.id},itemId=${i.id})}"
                           th:text="${i.name}">Rice</a>
                    </td>
                    <td th:attr="data-label=#{item.unit}" th:text="${i.unit}">kg</td>
                    <td th:attr="data-label=#{item.category}" th:text="${i.category} ?: '—'">Dry goods</td>
                    <td class="cell-status">
                        <span th:replace="~{layout/parts :: status(${i.active} ? 'ok' : 'neutral', ${i.active} ? #{item.status.active} : #{item.status.inactive})}">Active</span>
                    </td>
                    <td class="cell-actions">
                        <div class="row-actions">
                            <details th:replace="~{layout/parts :: rowMenu(#{common.moreActions(${i.name})}, ~{::itemMenuItems})}">
                                <th:block th:fragment="itemMenuItems">
                                    <a class="dropdown-item"
                                       th:href="@{/office/ships/{id}/items/{itemId}/edit(id=${ship.id},itemId=${i.id})}"
                                       th:text="#{item.edit}">Edit</a>
                                    <form th:unless="${i.active}" method="post"
                                          th:action="@{/office/ships/{id}/items/{itemId}/activate(id=${ship.id},itemId=${i.id})}">
                                        <button type="submit" class="dropdown-item"
                                                th:text="#{item.activate}">Activate</button>
                                    </form>
                                    <th:block th:if="${i.active}">
                                        <hr class="dropdown-divider">
                                        <form method="post"
                                              th:action="@{/office/ships/{id}/items/{itemId}/deactivate(id=${ship.id},itemId=${i.id})}">
                                            <button type="submit" class="dropdown-item dropdown-item-danger"
                                                    th:text="#{item.deactivate}">Deactivate</button>
                                        </form>
                                    </th:block>
                                </th:block>
                            </details>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <a class="d-inline-block mt-3" th:href="@{/office/ships}" th:text="#{item.backToShips}">Back to ships</a>
</main>
</body>
</html>
