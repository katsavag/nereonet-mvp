<!DOCTYPE html>
<!--
  Shared layout. Pages use it like this:
    <html th:replace="~{layout/layout :: layout(#{ship.list.title}, ~{::main})}">
  title: the page name as text. The browser tab shows "Page name · Nereonet"; on phones the top bar shows the page
  name. The page's <main> starts with layout/parts :: pageHeader (breadcrumbs, heading, actions).
  Logged in: navy sidebar (an offcanvas below md) with the user's name and a logout button.
  Not logged in: the page's <main> fills the screen and brings its own container.
  Messages: add a flash attribute "successMessage" or "errorMessage"
  holding a message key, e.g. redirectAttributes.addFlashAttribute("successMessage", "ship.saved"); for a message
  with arguments add "successArgs", an Object[] (see layout/parts :: flash).
-->
<html th:fragment="layout(title, content)" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:lang="${#locale.language}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' · ' + #{app.name}">Ships · Nereonet</title>
    <!-- Every asset is served by the app itself (no external hosts); URLs carry a content hash, see README. -->
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
    <link rel="stylesheet" th:href="@{/vendor/bootstrap/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>

<div sec:authorize="isAuthenticated()" class="d-md-flex">
    <aside class="sidebar flex-shrink-0 bg-navy">
        <div class="offcanvas-md offcanvas-start bg-navy text-white h-100" tabindex="-1" id="sidebar"
             th:attr="aria-label=#{app.name}">
            <div class="offcanvas-body d-flex flex-column h-100 p-3">
                <div class="mb-4">
                    <div sec:authorize="hasRole('OFFICE_USER')"
                         th:replace="~{layout/parts :: brand(#{portal.office})}"></div>
                    <div sec:authorize="!hasRole('OFFICE_USER')"
                         th:replace="~{layout/parts :: brand(#{portal.ship})}"></div>
                </div>

                <nav class="flex-grow-1">
                    <ul sec:authorize="hasRole('OFFICE_USER')" class="nav flex-column">
                        <li class="nav-item">
                            <a class="nav-link d-flex align-items-center gap-3 px-2" th:href="@{/office/ships}">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                     stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                    <path d="M3 14h18l-2.5 5h-13z"/>
                                    <path d="M6 14V9h12v5M12 9V4"/>
                                </svg>
                                <span th:text="#{nav.ships}">Ships</span>
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link d-flex align-items-center gap-3 px-2" th:href="@{/office/crew}">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                     stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                    <circle cx="9" cy="8" r="3.5"/>
                                    <path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M18 14a6 6 0 0 1 3.5 6"/>
                                </svg>
                                <span th:text="#{nav.crew}">Crew</span>
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link d-flex align-items-center gap-3 px-2" th:href="@{/office/users}">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                     stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                    <rect x="3" y="5" width="18" height="14" rx="2"/>
                                    <circle cx="9" cy="11" r="2"/>
                                    <path d="M6 16a3 3 0 0 1 6 0M14 10h4M14 14h3"/>
                                </svg>
                                <span th:text="#{nav.officeUsers}">Office users</span>
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link d-flex align-items-center gap-3 px-2" th:href="@{/office/invitations}">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                     stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
                                    <rect x="3" y="5" width="18" height="14" rx="2"/>
                                    <path d="M3 7l9 6 9-6"/>
                                </svg>
                                <span th:text="#{nav.invitations}">Invitations</span>
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link d-flex align-items-center gap-3 px-2" th:href="@{/office/audit}">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                     stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                    <path d="M3 12a9 9 0 1 0 3-6.7L3 8"/>
                                    <path d="M3 3v5h5M12 7v5l3 2"/>
                                </svg>
                                <span th:text="#{nav.audit}">Audit log</span>
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link d-flex align-items-center gap-3 px-2" th:href="@{/office/certificates}">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                     stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                    <rect x="4" y="3" width="16" height="13" rx="2"/>
                                    <path d="M8 7h8M8 11h5M10 16l-1.5 5 3.5-2 3.5 2-1.5-5"/>
                                </svg>
                                <span th:text="#{nav.certificates}">Certificates</span>
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link d-flex align-items-center gap-3 px-2" th:href="@{/office/announcements}">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                     stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                    <path d="M3 10v4h4l7 5V5L7 10z"/>
                                    <path d="M17.5 9a4 4 0 0 1 0 6"/>
                                </svg>
                                <span th:text="#{nav.announcements}">Announcements</span>
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link d-flex align-items-center gap-3 px-2" th:href="@{/office/requests}">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                     stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                    <rect x="5" y="4" width="14" height="17" rx="2"/>
                                    <path d="M9 4V3h6v1M9 10h6M9 14h6M9 18h3"/>
                                </svg>
                                <span th:text="#{nav.requests}">Requests</span>
                            </a>
                        </li>
                    </ul>
                    <ul sec:authorize="!hasRole('OFFICE_USER')" class="nav flex-column">
                        <li class="nav-item">
                            <a class="nav-link d-flex align-items-center gap-3 px-2" th:href="@{/ship/library}">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                     stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                    <path d="M4 5a2 2 0 0 1 2-2h13v15H6a2 2 0 0 0-2 2z"/>
                                    <path d="M4 20a2 2 0 0 0 2 1h13v-3M9 7h6"/>
                                </svg>
                                <span th:text="#{nav.library}">Library</span>
                            </a>
                        </li>
                    </ul>
                    <!-- Every logged-in user. unreadNotifications comes from NotificationBellAdvice. -->
                    <ul class="nav flex-column">
                        <li class="nav-item">
                            <a class="nav-link d-flex align-items-center gap-3 px-2" th:href="@{/notifications}">
                                <th:block th:replace="~{layout/parts :: bellIcon}"></th:block>
                                <span class="flex-grow-1" th:text="#{nav.notifications}">Notifications</span>
                                <span th:if="${unreadNotifications != null and unreadNotifications > 0}"
                                      class="badge rounded-pill bg-danger"
                                      th:text="${unreadNotifications > 99} ? '99+' : ${unreadNotifications}">3</span>
                            </a>
                        </li>
                    </ul>
                </nav>

                <!-- Office screens are English and Greek; crew screens are English only. -->
                <div sec:authorize="hasRole('OFFICE_USER')" class="mb-3">
                    <div th:replace="~{layout/parts :: langSwitch('link-light link-underline-opacity-0')}"></div>
                </div>

                <div class="d-flex align-items-center gap-2 border-top border-light border-opacity-10 pt-3">
                    <div class="avatar" th:text="${#authentication.principal.initials}">JD</div>
                    <div class="flex-grow-1 lh-sm small text-break">
                        <div class="fw-semibold" th:text="${#authentication.principal.fullName}">John Doe</div>
                        <div class="text-white-50"
                             th:text="#{${'role.' + #authentication.principal.role}}">Office user</div>
                    </div>
                    <form th:action="@{/logout}" method="post">
                        <button type="submit" class="btn btn-outline-light btn-sm text-nowrap"
                                th:text="#{nav.signOut}">Sign out</button>
                    </form>
                </div>
            </div>
        </div>
    </aside>

    <!-- min-width: 0, so a wide table scrolls inside its card instead of widening the page. -->
    <div class="app-main flex-grow-1">
        <header class="d-md-none bg-navy text-white d-flex align-items-center gap-2 px-2 py-2">
            <button type="button" class="btn text-white p-2" data-bs-toggle="offcanvas" data-bs-target="#sidebar"
                    aria-controls="sidebar" th:attr="aria-label=#{nav.toggle}">
                <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
            </button>
            <!-- The current page's name; the brand is in the sidebar. -->
            <span class="topbar-title fw-bold" th:text="${title}">Ships</span>
            <!-- Notification bell with the unread count, always visible on phones. -->
            <a class="btn text-white p-2 ms-auto position-relative" th:href="@{/notifications}"
               th:attr="aria-label=#{notification.bell(${unreadNotifications ?: 0})}">
                <th:block th:replace="~{layout/parts :: bellIcon}"></th:block>
                <span th:if="${unreadNotifications != null and unreadNotifications > 0}"
                      class="position-absolute top-0 end-0 badge rounded-pill bg-danger"
                      th:text="${unreadNotifications > 99} ? '99+' : ${unreadNotifications}">3</span>
            </a>
        </header>
        <!-- At most 1280px wide, left aligned next to the sidebar. -->
        <div class="app-content">
            <th:block th:replace="~{layout/parts :: flash}"></th:block>
            <main th:replace="${content}"></main>
        </div>
    </div>
</div>

<div sec:authorize="!isAuthenticated()">
    <div th:if="${successMessage != null or errorMessage != null}" class="container pt-3">
        <th:block th:replace="~{layout/parts :: flash}"></th:block>
    </div>
    <main th:replace="${content}"></main>
</div>

<script th:src="@{/vendor/bootstrap/bootstrap.bundle.min.js}"></script>
<script th:src="@{/js/local-time.js}"></script>
<script th:src="@{/js/row-menu.js}"></script>
<script th:src="@{/js/forms.js}"></script>
</body>
</html>
