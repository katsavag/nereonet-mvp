<!DOCTYPE html>
<!--
  Shared layout. Pages use it like this:
    <html th:replace="~{layout/layout :: layout(#{ship.list.title}, ~{::main})}">
  title: the page name as text. The browser tab shows "Page name · Nereonet"; on phones the top bar shows the page
  name. The page's <main> starts with layout/parts :: pageHeader (breadcrumbs, heading, actions).
  Logged in: navy sidebar from md: grouped navigation with the active entry and counters (P07, see the comment on the
  aside), the user's name and a logout button. From md it is a 64px icon rail or the full sidebar, as this browser
  chose (P29: body.sidebar-collapsed / sidebar-expanded, from the cookie read by navigation/SidebarPreference; the
  toggle is layout/parts :: sidebarToggle, js/sidebar.js). Below md, office users open it as an offcanvas from the top
  bar (closed with its X, a tap outside, Esc or choosing an entry); ship crew have the bottom tab bar instead (P26,
  layout/parts :: tabBar) and no menu button. Office pages have "EN | ΕΛ" at the right of the top bar at every width
  (P29); crew pages are English only.
  Not logged in: the page's <main> fills the screen and brings its own container (signed-out error pages use
  layout/parts :: authFrame, P13). The sign-in, registration and password reset pages use layout/auth instead, which
  never shows the signed-in frame (P30): someone still signed in who opens an invitation or reset link sees that page
  alone, not inside the sidebar and top bar.
  Messages: add a flash attribute "successMessage" or "errorMessage"
  holding a message key, e.g. redirectAttributes.addFlashAttribute("successMessage", "ship.saved"); for a message
  with arguments add "successArgs", an Object[] (see layout/parts :: flash).
  Confirmations (P10): an action that must be confirmed is a layout/parts :: confirmForm; the one dialog it opens,
  layout/parts :: confirmDialog, is at the end of the signed-in frame.
  Times (P11): shown in UTC with layout/parts :: localTime; data-local-time on the body is the wording js/local-time.js
  uses for the viewer's own time ("Your time: {time}").
  Saving on a bad connection (P15, js/save.js): every POST form shows "Saving…" once sent and cannot be sent twice; a
  form with data-draft keeps its text in the browser while the user types. data-user on the body (signed in only) is
  the user's id, so drafts are per user; layout/parts :: offlineBanner and draftNotice hold the texts.
-->
<html th:fragment="layout(title, content)" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:lang="${#locale.language}">
<!-- head(title) and scripts are shared with layout/auth (P30). -->
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' · ' + #{app.name}">Ships · Nereonet</title>
    <!-- Every asset is served by the app itself (no external hosts); URLs carry a content hash, see README. -->
    <link rel="icon" type="image/png" sizes="32x32" th:href="@{/img/brand/favicon-32.png}">
    <link rel="apple-touch-icon" sizes="180x180" th:href="@{/img/brand/apple-touch-icon.png}">
    <link rel="stylesheet" th:href="@{/vendor/bootstrap/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<!-- has-tab-bar: a signed-in ship user, who gets the bottom tab bar below md (P26); app.css leaves room for it.
     sidebar-collapsed / sidebar-expanded (signed in): the sidebar's state from md (P29), from the cookie, so the page is
     rendered in the chosen state and never flashes the other one first. -->
<body th:data-local-time="#{time.local('{time}')}"
      th:with="signedIn=${#authorization.expression('isAuthenticated()')}, sidebarExpanded=${@sidebarPreference.expanded()}"
      th:class="${#authorization.expression('isAuthenticated() and !hasRole(''OFFICE_USER'')')} ? 'has-tab-bar'"
      th:classappend="${signedIn} ? (${sidebarExpanded} ? 'sidebar-expanded' : 'sidebar-collapsed')"
      th:data-user="${#authorization.expression('isAuthenticated()')} ? ${#authentication.principal.id} : null">

<div sec:authorize="isAuthenticated()" class="d-md-flex">
    <!-- Sidebar (P07): brand, the navigation groups (scroll on their own when the window is short), and the user
         block pinned at the bottom. The active entry and the counters come from navigation/NavigationAdvice
         (navSection, navCounts) and notification/NotificationBellAdvice (unreadNotifications). -->
    <aside class="sidebar flex-shrink-0 bg-navy">
        <div class="offcanvas-md offcanvas-start bg-navy text-white h-100" tabindex="-1" id="sidebar"
             th:attr="aria-label=#{app.name}">
            <div class="offcanvas-body sidebar-body">
                <!-- The brand goes to the user's home page: /office or /ship. On phones the X closes the menu (P29). -->
                <div class="sidebar-head">
                    <a class="sidebar-brand" th:href="@{${#authentication.principal.homeUrl}}"
                       th:with="office=${#authentication.principal.role.name() == 'OFFICE_USER'}">
                        <div th:replace="~{layout/parts :: brand(${office} ? #{portal.office} : #{portal.ship})}"></div>
                    </a>
                    <!-- From md: "Collapse menu" / "Expand menu", an icon right of the brand, under the mark in the
                         rail (P29, at the top since P39). -->
                    <form th:replace="~{layout/parts :: sidebarToggle(${sidebarExpanded})}"></form>
                    <button type="button" class="sidebar-close" data-bs-dismiss="offcanvas"
                            data-bs-target="#sidebar" th:attr="aria-label=#{nav.close}">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                             stroke-linecap="round" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6 6 18"/></svg>
                    </button>
                </div>

                <nav class="sidebar-nav" th:attr="aria-label=#{nav.label}">
                    <th:block sec:authorize="hasRole('OFFICE_USER')">
                        <p class="nav-group-label" id="navGroupOperations" th:text="#{nav.group.operations}">Operations</p>
                        <ul class="nav flex-column" aria-labelledby="navGroupOperations">
                            <li th:replace="~{layout/parts :: navItem('overview', '/office', #{nav.overview}, null, null)}"></li>
                            <li th:replace="~{layout/parts :: navItem('ships', '/office/ships', #{nav.ships}, null, null)}"></li>
                            <li th:replace="~{layout/parts :: navItem('crew', '/office/crew', #{nav.crew}, null, null)}"></li>
                            <!-- Certificates opens exactly what its counter counts (P20): expired or within 30 days. -->
                            <li th:replace="~{layout/parts :: navItem('certificates',
                                    ${navCounts.certificates > 0} ? '/office/certificates?status=expired,30' : '/office/certificates', #{nav.certificates},
                                    ${navCounts.certificates}, #{nav.count.certificates(${navCounts.certificates})})}"></li>
                            <!-- Vetting (P40): RightShip, SIRE 2.0 from P41; the number of vessels whose RightShip
                                 inspection is expired or expires within 60 days. -->
                            <li th:replace="~{layout/parts :: navItem('vetting', '/office/vetting', #{nav.vetting},
                                    ${navCounts.vetting}, #{nav.count.vetting(${navCounts.vetting})})}"></li>
                            <li th:replace="~{layout/parts :: navItem('announcements', '/office/announcements', #{nav.announcements}, null, null)}"></li>
                            <li th:replace="~{layout/parts :: navItem('orders', '/office/orders', #{nav.orders},
                                    ${navCounts.orders}, #{nav.count.orders(${navCounts.orders})})}"></li>
                        </ul>
                        <p class="nav-group-label" id="navGroupAdministration" th:text="#{nav.group.administration}">Administration</p>
                        <ul class="nav flex-column" aria-labelledby="navGroupAdministration">
                            <li th:replace="~{layout/parts :: navItem('users', '/office/users', #{nav.officeUsers}, null, null)}"></li>
                            <li th:replace="~{layout/parts :: navItem('audit', '/office/audit', #{nav.audit}, null, null)}"></li>
                        </ul>
                    </th:block>
                    <!-- Ship: the same entries as the phone tab bar (layout/parts :: tabBar, P26), News (P27
                         announcements, "News" for the crew since P39) between Home and Library in both. My crew and My profile (P31) are under the tab bar's More, and
                         so are the Master's Approvals (P33) and Ship order (P35). -->
                    <th:block sec:authorize="!hasRole('OFFICE_USER')">
                        <p class="nav-group-label" id="navGroupShip" th:text="#{nav.group.ship}">On board</p>
                        <ul class="nav flex-column" aria-labelledby="navGroupShip">
                            <li th:replace="~{layout/parts :: navItem('home', '/ship', #{nav.home}, null, null)}"></li>
                            <!-- With the number not opened yet (P37, P39). -->
                            <li th:replace="~{layout/parts :: navItem('announcements', '/ship/news', #{nav.news},
                                    ${announcementsToAcknowledge}, #{nav.count.announcements(${announcementsToAcknowledge ?: 0})})}"></li>
                            <li th:replace="~{layout/parts :: navItem('library', '/ship/library', #{nav.library}, null, null)}"></li>
                            <li th:replace="~{layout/parts :: navItem('crew', '/ship/crew', #{nav.myCrew}, null, null)}"></li>
                            <!-- The Master's approvals (P33), with the number waiting for them. -->
                            <th:block sec:authorize="hasRole('MASTER')">
                                <li th:replace="~{layout/parts :: navItem('approvals', '/ship/approvals', #{nav.approvals},
                                        ${approvalsWaiting}, #{nav.count.approvals(${approvalsWaiting ?: 0})})}"></li>
                                <!-- The ship order (P35), with the number of lines in the OPEN order. -->
                                <li th:replace="~{layout/parts :: navItem('order', '/ship/order', #{nav.order},
                                        ${orderLines}, #{nav.count.order(${orderLines ?: 0})})}"></li>
                            </th:block>
                        </ul>
                    </th:block>
                    <p class="nav-group-label" id="navGroupAccount" th:text="#{nav.group.account}">Account</p>
                    <ul class="nav flex-column" aria-labelledby="navGroupAccount">
                        <th:block sec:authorize="!hasRole('OFFICE_USER')">
                            <li th:replace="~{layout/parts :: navItem('profile', '/ship/profile', #{nav.profile}, null, null)}"></li>
                        </th:block>
                        <li th:replace="~{layout/parts :: navItem('notifications', '/notifications', #{nav.notifications},
                                ${unreadNotifications}, #{nav.count.notifications(${unreadNotifications ?: 0})})}"></li>
                    </ul>
                </nav>

                <div class="sidebar-user">
                    <div class="avatar" aria-hidden="true" th:text="${#authentication.principal.initials}">JD</div>
                    <div class="sidebar-user-text flex-grow-1 lh-sm small text-break">
                        <div class="fw-semibold" th:text="${#authentication.principal.fullName}">John Doe</div>
                        <div class="sidebar-user-role"
                             th:text="#{${'role.' + #authentication.principal.role}}">Office user</div>
                    </div>
                    <form th:replace="~{layout/parts :: sidebarSignOut}"></form>
                </div>
            </div>
        </div>
    </aside>

    <!-- min-width: 0, so a wide table scrolls inside its card instead of widening the page. -->
    <div class="app-main flex-grow-1">
        <!-- Office: menu button, page name, "EN | ΕΛ", bell; from md only "EN | ΕΛ", on the right (P29). Ship crew:
             the page name only, on phones; the tab bar at the bottom has the navigation and Notifications (P26). -->
        <header class="topbar" th:with="office=${#authorization.expression('hasRole(''OFFICE_USER'')')}"
                th:classappend="${office} ? 'topbar-office' : 'd-md-none'">
            <button sec:authorize="hasRole('OFFICE_USER')" type="button" class="btn topbar-button d-md-none"
                    data-bs-toggle="offcanvas" data-bs-target="#sidebar"
                    aria-controls="sidebar" th:attr="aria-label=#{nav.toggle}">
                <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
            </button>
            <!-- The current page's name; the brand is in the sidebar. -->
            <span class="topbar-title fw-bold" th:text="${title}">Ships</span>
            <!-- Office screens are English and Greek (P16), the switch top right at every width (P29). -->
            <div sec:authorize="hasRole('OFFICE_USER')" class="topbar-lang">
                <div th:replace="~{layout/parts :: langSwitch(null)}"></div>
            </div>
            <!-- Notification bell with the unread count, always visible on phones. js/notifications.js updates the
                 count and the label in place after Mark as read (P23). -->
            <a sec:authorize="hasRole('OFFICE_USER')" class="btn topbar-button d-md-none position-relative"
               id="notificationBell" th:href="@{/notifications}"
               th:attr="aria-label=#{notification.bell(${unreadNotifications ?: 0})}">
                <th:block th:replace="~{layout/parts :: bellIcon}"></th:block>
                <span th:if="${unreadNotifications != null and unreadNotifications > 0}"
                      class="position-absolute top-0 end-0 badge rounded-pill bg-danger"
                      th:text="${unreadNotifications > 99} ? '99+' : ${unreadNotifications}">3</span>
            </a>
        </header>
        <!-- The full width of the window next to the sidebar, with 32px side gutters (16px on phones) (P29). Form
             pages keep their 720px column inside it (main.form-page, app.css). -->
        <div class="app-content">
            <th:block th:replace="~{layout/parts :: flash}"></th:block>
            <main th:replace="${content}"></main>
        </div>
    </div>
    <!-- Ship crew on phones (P26): Home, News (P39), Library, Notifications and More (P31) at the bottom of the
         screen. -->
    <th:block sec:authorize="!hasRole('OFFICE_USER')">
        <nav th:replace="~{layout/parts :: tabBar}"></nav>
    </th:block>
    <!-- The confirmation dialog of every confirmForm on the page (P10, js/confirm.js). -->
    <dialog th:replace="~{layout/parts :: confirmDialog}"></dialog>
    <!-- "Draft restored from 12:40 UTC · Discard" (P15), copied into a form with a draft by js/save.js. -->
    <template th:replace="~{layout/parts :: draftNotice}"></template>
</div>

<div sec:authorize="!isAuthenticated()">
    <div th:if="${successMessage != null or errorMessage != null}" class="container pt-3">
        <th:block th:replace="~{layout/parts :: flash}"></th:block>
    </div>
    <main th:replace="${content}"></main>
</div>

<!-- "No connection." (P15): empty and invisible until js/save.js sees the browser go offline. -->
<div th:replace="~{layout/parts :: offlineBanner}"></div>

<th:block th:fragment="scripts">
<script th:src="@{/vendor/bootstrap/bootstrap.bundle.min.js}"></script>
<script th:src="@{/js/local-time.js}"></script>
<script th:src="@{/js/row-menu.js}"></script>
<script th:src="@{/js/forms.js}"></script>
<script th:src="@{/js/password.js}"></script>
<script th:src="@{/js/ship-tabs.js}"></script>
<script th:src="@{/js/confirm.js}"></script>
<script th:src="@{/js/list-filter.js}"></script>
<script th:src="@{/js/list-rows.js}"></script>
<script th:src="@{/js/save.js}"></script>
<script th:src="@{/js/download.js}"></script>
<script th:src="@{/js/notifications.js}"></script>
<script th:src="@{/js/import-map.js}"></script>
<script th:src="@{/js/import-check.js}"></script>
<script th:src="@{/js/ship-picker.js}"></script>
<script th:src="@{/js/sidebar.js}"></script>
</th:block>
</body>
</html>
