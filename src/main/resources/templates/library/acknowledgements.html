<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/layout :: layout(#{library.acknowledgements.heading}, ~{::main})}">
<body>
<main th:with="ship=${overview.item.ship}">
    <header th:replace="~{core/library/parts :: acknowledgementsHeader(~{::pageCrumbs})}">
        <th:block th:fragment="pageCrumbs">
            <li th:replace="~{layout/parts :: crumb(#{nav.library}, '/ship/library')}"></li>
            <li th:replace="~{layout/parts :: crumb(${overview.item.title}, ${'/ship/library/' + overview.item.id})}"></li>
        </th:block>
    </header>
    <th:block th:replace="~{core/library/parts :: acknowledgements(${'/ship/library/' + overview.item.id + '/acknowledgements/remind'})}"></th:block>
</main>
</body>
</html>
