<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/layout :: layout(#{library.edit.heading}, ~{::main})}">
<body>
<main th:with="itemUrl=${'/ship/library/' + item.id}">
    <header th:replace="~{layout/parts :: pageHeader(heading=#{library.edit.heading}, crumbs=~{::pageCrumbs}, eyebrow=${item.ship.name} + ' · ' + #{ship.codeValue(${item.ship.imoNumber})})}">
        <th:block th:fragment="pageCrumbs">
            <li th:replace="~{layout/parts :: crumb(#{nav.library}, '/ship/library')}"></li>
            <li th:replace="~{layout/parts :: crumb(${item.title}, ${itemUrl})}"></li>
        </th:block>
    </header>

    <div class="card form-box">
        <div class="card-body p-3 p-md-4">
            <form th:replace="~{core/library/parts :: versionForm(${itemUrl + '/edit'}, ${itemUrl})}"></form>
        </div>
    </div>
</main>
</body>
</html>
