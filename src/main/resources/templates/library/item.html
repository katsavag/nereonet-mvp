<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout/layout :: layout(${item.title}, ~{::main})}">
<body>
<main th:with="toAcknowledge=${item.required and acknowledgement == null}">
    <header th:replace="~{layout/parts :: pageHeader(heading=${item.title}, crumbs=~{::pageCrumbs}, subtitleParts=~{core/library/parts :: itemSubtitle}, eyebrowShip=${item.ship}, actions=${#authorization.expression('hasRole(''MASTER'')')} ? ~{::pageActions} : null)}">
        <th:block th:fragment="pageCrumbs">
            <li th:replace="~{layout/parts :: crumb(#{nav.library}, '/ship/library')}"></li>
        </th:block>
        <!-- Only the Master (the item is always of the user's own ship). -->
        <th:block th:fragment="pageActions">
            <a class="btn btn-outline-secondary"
               th:href="@{/ship/library/{id}/edit(id=${item.id})}" th:text="#{library.edit}">New version</a>
            <form th:replace="~{core/library/parts :: retire(${'/ship/library/' + item.id + '/retire'}, ${item})}"></form>
        </th:block>
    </header>

    <!-- The content, then (Required item) the acknowledgement. The wrapper ends with the acknowledgement, so on phones
         the pinned acknowledge button (.ack-bar.is-pinned) stays at the bottom of the screen while the content
         scrolls and comes to rest right after it (P22). -->
    <div class="item-read">
        <th:block th:replace="~{core/library/parts :: itemContent(${'/ship/library/' + item.id + '/file'}, ${toAcknowledge})}"></th:block>

        <!-- Required item: acknowledge the current version. Never a condition for anything else. -->
        <div th:if="${item.required}" class="ack-bar" th:classappend="${toAcknowledge} ? 'is-pinned'">
            <form th:if="${toAcknowledge}" method="post"
                  th:action="@{/ship/library/{id}/acknowledge(id=${item.id})}">
                <button type="submit" class="btn btn-primary btn-lg" th:text="#{library.acknowledge}">I have read this</button>
            </form>
            <p th:unless="${toAcknowledge}" class="alert alert-success mb-0">
                <span th:text="#{library.acknowledged(${item.currentVersion.versionLabel})}">Acknowledged · Version 1 ·</span>
                <time th:replace="~{layout/parts :: localTime(${acknowledgement.acknowledgedAt})}"></time>
            </p>
        </div>
    </div>

    <!-- The Master only (versions is null for the other crew). -->
    <th:block th:if="${versions != null}">
        <section th:replace="~{core/library/parts :: versionHistory(${versions})}"></section>
    </th:block>
</main>
</body>
</html>
