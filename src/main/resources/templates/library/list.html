<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout/layout :: layout(#{library.title}, ~{::main})}">
<body>
<main>
    <header th:replace="~{layout/parts :: pageHeader(heading=#{library.heading}, eyebrow=${ship.name} + ' · ' + #{ship.codeValue(${ship.imoNumber})}, actions=${#authorization.expression('hasRole(''MASTER'')')} ? ~{::pageActions} : null)}">
        <!-- Only the Master adds items. -->
        <th:block th:fragment="pageActions">
            <a class="btn btn-primary" th:href="@{/ship/library/new}">
                <svg th:replace="~{layout/parts :: icon('plus')}"></svg>
                <span th:text="#{library.add}">Add an item</span>
            </a>
        </th:block>
    </header>

    <th:block th:replace="~{core/library/parts :: content(${ship}, ${itemsByCategory}, true, ${acknowledgedItemIds}, ${acknowledgementCounts}, ${#authorization.expression('hasRole(''MASTER'')')} ? '/ship/library/particulars' : null)}"></th:block>
</main>
</body>
</html>
