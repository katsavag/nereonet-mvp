<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/layout :: layout(~{::title}, ~{::main})}">
<head>
    <title th:text="#{library.particulars.edit}">Edit ship particulars</title>
</head>
<body>
<main>
    <p class="mb-2"><a th:href="@{/ship/library}" th:text="#{library.back}">← Library</a></p>
    <p class="eyebrow mb-1" th:text="${ship.name}">MV Demo</p>
    <h1 class="fw-bold mb-4" th:text="#{library.particulars.edit}">Edit ship particulars</h1>

    <div class="card form-box">
        <div class="card-body p-3 p-md-4">
            <form th:replace="~{core/library/parts :: particularsForm('/ship/library/particulars', '/ship/library')}"></form>
        </div>
    </div>
</main>
</body>
</html>
