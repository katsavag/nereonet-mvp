<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/layout :: layout(#{ship.title}, ~{::main})}">
<body>
<!-- Placeholder until the real ship screens exist. -->
<main>
    <header th:replace="~{layout/parts :: pageHeader(heading=#{ship.heading})}"></header>
    <div class="card">
        <div class="card-body">
            <p class="small text-body-secondary mb-1" th:text="#{placeholder.signedInAs}">Signed in as</p>

            <p class="mb-0" th:text="#{${'role.' + #authentication.principal.role}}">Crew member</p>
        </div>
    </div>
</main>
</body>
</html>
