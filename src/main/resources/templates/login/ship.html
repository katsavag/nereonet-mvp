<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/layout :: layout(~{::title}, ~{::main})}">
<head>
    <title th:text="#{ship.title}">Overview</title>
</head>
<body>
<!-- Placeholder until the real ship screens exist. -->
<main>
    <p class="eyebrow mb-1" th:text="#{portal.ship}">Ship portal</p>
    <h1 class="fw-bold mb-4" th:text="#{ship.heading}">Overview</h1>
    <div class="card">
        <div class="card-body">
            <p class="small text-body-secondary mb-1" th:text="#{placeholder.signedInAs}">Signed in as</p>
            <p class="fs-5 fw-semibold mb-0" th:text="${#authentication.principal.fullName}">Jane Doe</p>
            <p class="mb-0" th:text="#{${'role.' + #authentication.principal.role}}">Crew member</p>
        </div>
    </div>
</main>
</body>
</html>
