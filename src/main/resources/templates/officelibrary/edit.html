<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/layout :: layout(#{library.edit.heading}, ~{::main})}">
<body>
<!-- "New version" of the item's read view (P22). Cancel and Publish go back to the read view; Retire is there too. -->
<main class="form-page form-page-aside" th:with="itemUrl=${'/office/ships/' + item.ship.id + '/library/' + item.id}">
    <header th:replace="~{layout/parts :: pageHeader(heading=#{library.edit.heading}, crumbs=~{::pageCrumbs}, eyebrowShip=${item.ship})}">
        <th:block th:fragment="pageCrumbs">
            <th:block th:replace="~{ship/parts :: crumbs(${item.ship}, 'library')}"></th:block>
            <li th:replace="~{layout/parts :: crumb(${item.title}, ${itemUrl})}"></li>
        </th:block>
    </header>

    <div class="card form-box">
        <div class="card-body p-3 p-md-4">
            <form th:replace="~{core/library/parts :: versionForm(${itemUrl + '/edit'}, ${itemUrl})}"></form>
        </div>
    </div>
    <!-- The ship this form changes, beside it from 1200px (P29). -->
    <section th:replace="~{ship/parts :: formAside(${item.ship})}"></section>
</main>
</body>
</html>
