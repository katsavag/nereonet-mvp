<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/layout :: layout(#{library.edit.heading}, ~{::main})}">
<body>
<main th:with="libraryUrl=${'/office/ships/' + item.ship.id + '/library'}">
    <header th:replace="~{layout/parts :: pageHeader(heading=#{library.edit.heading}, crumbs=~{::pageCrumbs}, eyebrowShip=${item.ship})}">
        <th:block th:fragment="pageCrumbs">
            <th:block th:replace="~{ship/parts :: crumbs(${item.ship}, 'library')}"></th:block>
        </th:block>
    </header>

    <div class="card form-box">
        <div class="card-body p-3 p-md-4">
            <form th:replace="~{core/library/parts :: versionForm(${libraryUrl + '/' + item.id + '/edit'}, ${libraryUrl})}"></form>
        </div>
    </div>

    <div class="mt-4">
        <form th:replace="~{core/library/parts :: retire(${libraryUrl + '/' + item.id + '/retire'}, ${item})}"></form>
    </div>
</main>
</body>
</html>
