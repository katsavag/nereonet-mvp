<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/layout :: layout(#{library.edit.heading}, ~{::main})}">
<body>
<main th:with="libraryUrl=${'/office/ships/' + item.ship.id + '/library'}">
    <header th:replace="~{layout/parts :: pageHeader(heading=#{library.edit.heading}, crumbs=~{::pageCrumbs}, eyebrow=${item.ship.name} + ' · ' + #{ship.codeValue(${item.ship.imoNumber})})}">
        <th:block th:fragment="pageCrumbs">
            <li th:replace="~{layout/parts :: crumb(#{nav.ships}, '/office/ships')}"></li>
            <li th:replace="~{layout/parts :: crumb(${item.ship.name}, ${libraryUrl})}"></li>
        </th:block>
    </header>

    <div class="card form-box">
        <div class="card-body p-3 p-md-4">
            <form th:replace="~{core/library/parts :: versionForm(${libraryUrl + '/' + item.id + '/edit'}, ${libraryUrl})}"></form>
        </div>
    </div>

    <div class="mt-4">
        <th:block th:replace="~{core/library/parts :: retire(${libraryUrl + '/' + item.id + '/retire'})}"></th:block>
    </div>
</main>
</body>
</html>
