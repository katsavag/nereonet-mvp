<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/layout :: layout(~{::title}, ~{::main})}">
<head>
    <title th:text="#{library.edit.heading}">Publish new version</title>
</head>
<body>
<main th:with="libraryUrl=${'/office/ships/' + item.ship.id + '/library'}">
    <p class="mb-2"><a th:href="@{${libraryUrl}}" th:text="#{library.back}">← Library</a></p>
    <p class="eyebrow mb-1" th:text="${item.ship.name}">MV Demo</p>
    <h1 class="fw-bold mb-4" th:text="#{library.edit.heading}">Publish new version</h1>

    <div class="card form-box">
        <div class="card-body p-3 p-md-4">
            <form th:replace="~{core/library/parts :: versionForm(${libraryUrl + '/' + item.id + '/edit'}, ${libraryUrl})}"></form>
        </div>
    </div>

    <div class="mt-4">
        <th:block th:replace="~{core/library/parts :: retire(${libraryUrl + '/' + item.id + '/retire'})}"></th:block>
    </div>
</main>
</body>
</html>
