<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/layout :: layout(#{library.title}, ~{::main})}">
<body>
<main>
    <header th:replace="~{layout/parts :: pageHeader(heading=#{library.heading}, crumbs=~{::pageCrumbs}, actions=~{::pageActions}, eyebrow=${ship.name} + ' · ' + #{ship.codeValue(${ship.imoNumber})})}">
        <!-- No crumb for the ship: its name links to this page; the eyebrow names it. -->
        <th:block th:fragment="pageCrumbs">
            <li th:replace="~{layout/parts :: crumb(#{nav.ships}, '/office/ships')}"></li>
        </th:block>
        <th:block th:fragment="pageActions">
            <a class="btn btn-primary" th:href="@{/office/ships/{id}/library/new(id=${ship.id})}">
                <svg th:replace="~{layout/parts :: icon('plus')}"></svg>
                <span th:text="#{library.add}">Add an item</span>
            </a>
        </th:block>
    </header>

    <th:block th:replace="~{core/library/parts :: content(${ship}, ${itemsByCategory}, false, null, ${acknowledgementCounts}, ${'/office/ships/' + ship.id + '/library/particulars'})}"></th:block>
</main>
</body>
</html>
