<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/layout :: layout(${ship.name} + ' · ' + #{ship.tab.library}, ~{::main})}">
<body>
<!-- The Library tab of the ship page (see ship/ShipFrame). -->
<main>
    <th:block th:replace="~{ship/parts :: header}"></th:block>
    <div th:replace="~{ship/parts :: tabHeading(#{library.heading}, ~{::tabActions})}">
        <th:block th:fragment="tabActions">
            <a class="btn btn-primary" th:href="@{/office/ships/{id}/library/new(id=${ship.id})}">
                <svg th:replace="~{layout/parts :: icon('plus')}"></svg>
                <span th:text="#{library.add}">Add an item</span>
            </a>
        </th:block>
    </div>

    <th:block th:replace="~{core/library/parts :: content(${ship}, ${itemsByCategory}, false, null, ${acknowledgementCounts}, ${'/office/ships/' + ship.id + '/library/particulars'})}"></th:block>
</main>
</body>
</html>
