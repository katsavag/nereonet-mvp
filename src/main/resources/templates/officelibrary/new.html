<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/layout :: layout(#{library.new.heading}, ~{::main})}">
<body>
<main class="form-page form-page-aside" th:with="libraryUrl=${'/office/ships/' + ship.id + '/library'}">
    <header th:replace="~{layout/parts :: pageHeader(heading=#{library.new.heading}, crumbs=~{::pageCrumbs}, eyebrowShip=${ship})}">
        <th:block th:fragment="pageCrumbs">
            <th:block th:replace="~{ship/parts :: crumbs(${ship}, 'library')}"></th:block>
        </th:block>
    </header>

    <div class="card form-box">
        <div class="card-body p-3 p-md-4">
            <form th:replace="~{core/library/parts :: itemForm(${libraryUrl + '/new'}, ${libraryUrl})}"></form>
        </div>
    </div>
    <!-- The ship this form changes, beside it from 1200px (P29). -->
    <section th:replace="~{ship/parts :: formAside(${ship})}"></section>
</main>
</body>
</html>
