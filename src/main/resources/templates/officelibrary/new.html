<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/layout :: layout(#{library.new.heading}, ~{::main})}">
<body>
<main th:with="libraryUrl=${'/office/ships/' + ship.id + '/library'}">
    <header th:replace="~{layout/parts :: pageHeader(heading=#{library.new.heading}, crumbs=~{::pageCrumbs}, eyebrow=${ship.name} + ' · ' + #{ship.codeValue(${ship.imoNumber})})}">
        <th:block th:fragment="pageCrumbs">
            <li th:replace="~{layout/parts :: crumb(#{nav.ships}, '/office/ships')}"></li>
            <li th:replace="~{layout/parts :: crumb(${ship.name}, ${libraryUrl})}"></li>
        </th:block>
    </header>

    <div class="card form-box">
        <div class="card-body p-3 p-md-4">
            <form th:replace="~{core/library/parts :: itemForm(${libraryUrl + '/new'}, ${libraryUrl})}"></form>
        </div>
    </div>
</main>
</body>
</html>
