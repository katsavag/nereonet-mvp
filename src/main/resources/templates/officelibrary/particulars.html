<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/layout :: layout(#{library.particulars.edit}, ~{::main})}">
<body>
<main th:with="libraryUrl=${'/office/ships/' + ship.id + '/library'}">
    <header th:replace="~{layout/parts :: pageHeader(heading=#{library.particulars.edit}, crumbs=~{::pageCrumbs}, eyebrowShip=${ship})}">
        <th:block th:fragment="pageCrumbs">
            <th:block th:replace="~{ship/parts :: crumbs(${ship}, 'library')}"></th:block>
        </th:block>
    </header>

    <div class="card form-box">
        <div class="card-body p-3 p-md-4">
            <form th:replace="~{core/library/parts :: particularsForm(${libraryUrl + '/particulars'}, ${libraryUrl})}"></form>
        </div>
    </div>
</main>
</body>
</html>
