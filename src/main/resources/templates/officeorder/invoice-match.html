<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/layout :: layout(#{officeorder.compare.match.title}, ~{::main})}">
<body>
<!-- P64, Change the product of an invoice line after receipt: the order's lines, the vessel's other active items, or
     Not ordered (a radio each, the current one checked). Saving corrects the comparison and the name learned for the
     supplier; the store is not moved, so the vessel's Chief cook is asked to count these items.
     Model: order, line (DeliveryInvoiceLine), choices (InvoiceComparisonService.Choices). -->
<main>
    <header th:replace="~{layout/parts :: pageHeader(heading=#{officeorder.compare.match.title}, crumbs=~{::pageCrumbs},
            eyebrowShip=${order.ship}, actions=null)}">
        <th:block th:fragment="pageCrumbs">
            <li th:replace="~{layout/parts :: crumb(#{nav.orders}, '/office/orders')}"></li>
            <li th:replace="~{layout/parts :: crumb(#{officeorder.number(${order.id})}, ${'/office/orders/' + order.id})}"></li>
        </th:block>
    </header>

    <section class="card form-box" aria-labelledby="matchTitle">
        <div class="card-body p-3 p-md-4">
            <h2 class="h5 fw-bold text-break" id="matchTitle" th:text="#{officeorder.compare.match.line(${line.description})}">On the invoice: FISH FILLET HAKE</h2>
            <p class="small text-body-secondary" th:text="#{officeorder.compare.match.hint}">The comparison and the name
                learned for this supplier change. The store does not.</p>
            <form method="post" th:action="@{/office/orders/{o}/invoice/lines/{l}/match(o=${order.id}, l=${line.id})}">
                <fieldset class="mb-3" th:unless="${choices.orderLines().isEmpty()}">
                    <legend class="h6 fw-semibold" th:text="#{officeorder.compare.match.onOrder}">On this order</legend>
                    <div th:each="o : ${choices.orderLines()}" class="form-check">
                        <input class="form-check-input" type="radio" name="choice" th:id="${'choice-o' + o.id}" th:value="${'o' + o.id}"
                               th:checked="${line.orderLine != null and line.orderLine.id == o.id}">
                        <label class="form-check-label" th:for="${'choice-o' + o.id}" th:text="#{officeorder.edit.add.option(${o.item.name}, ${o.item.unit})}">Basmati rice (kg)</label>
                    </div>
                </fieldset>
                <fieldset class="mb-3" th:unless="${choices.items().isEmpty()}">
                    <legend class="h6 fw-semibold" th:text="#{officeorder.compare.match.otherItems}">Other items of the vessel</legend>
                    <div class="item-picker-list" tabindex="0">
                        <div th:each="i : ${choices.items()}" class="form-check">
                            <input class="form-check-input" type="radio" name="choice" th:id="${'choice-i' + i.id}" th:value="${'i' + i.id}">
                            <label class="form-check-label" th:for="${'choice-i' + i.id}" th:text="#{officeorder.edit.add.option(${i.name}, ${i.unit})}">Olive oil (lt)</label>
                        </div>
                    </div>
                </fieldset>
                <div class="form-check mb-3">
                    <input class="form-check-input" type="radio" name="choice" id="choice-none" value="none"
                           th:checked="${line.item == null}">
                    <label class="form-check-label" for="choice-none">
                        [[#{officeorder.compare.match.notOrdered}]]
                        <span class="d-block small text-body-secondary" th:text="#{officeorder.compare.match.notOrderedHint}">Not one of the vessel's items.</span>
                    </label>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary" th:text="#{officeorder.compare.match.save}">Save</button>
                    <a class="btn btn-ghost" th:href="@{/office/orders/{id}(id=${order.id})} + '#compare'" th:text="#{form.cancel}">Cancel</a>
                </div>
            </form>
        </div>
    </section>
</main>
</body>
</html>
