<!DOCTYPE html>
<!-- Parts of the office's ship orders (P36). -->
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!-- An order's status as the office sees it: Pending (info: waiting for the office), Delivery pending (neutral:
     waiting for the vessel's receipt, P51), Received (ok).
     The words carry the state, the colour repeats it.
     Use: <span th:replace="~{officeorder/parts :: statusBadge(${order.status})}"></span> -->
<span th:fragment="statusBadge(status)"
      th:replace="~{layout/parts :: status(${status.name() == 'SENT'} ? 'info' : (${status.name() == 'CLOSED'} ? 'ok'
              : 'neutral'), #{${'officeorder.status.' + status.name()}})}"></span>

<!-- Whether an order was exported: when (the last export), or "Not yet".
     Use: <th:block th:replace="~{officeorder/parts :: exported(${order})}"></th:block> -->
<th:block th:fragment="exported(order)">
    <span th:if="${order.exportedAt != null}" class="exported-by">
        <span th:replace="~{layout/parts :: status('ok', #{officeorder.exported.yes})}">Exported</span>
        <time th:replace="~{layout/parts :: localTime(${order.exportedAt})}"></time>
    </span>
    <span th:unless="${order.exportedAt != null}" class="text-body-secondary" th:text="#{officeorder.exported.no}">Not yet</span>
</th:block>

<!-- P64: where the office stands with the order's invoice: Matched (ok), "3 differ" (warning), To confirm (info: all
     lines agree, not marked matched yet), or None (no read invoice, or not received yet).
     Use: <th:block th:replace="~{officeorder/parts :: invoiceBadge(${order})}"></th:block> -->
<th:block th:fragment="invoiceBadge(order)">
    <th:block th:if="${order.invoiceStatus != null and order.invoiceStatus.name() == 'MATCHED'}"><span th:replace="~{layout/parts :: status('ok', #{officeorder.invoice.matched})}">Matched</span></th:block>
    <th:block th:if="${order.invoiceToMatch and order.invoiceDiffLines > 0}"><span th:replace="~{layout/parts :: status('warning', #{officeorder.invoice.differ(${order.invoiceDiffLines})})}">3 differ</span></th:block>
    <th:block th:if="${order.invoiceToMatch and order.invoiceDiffLines == 0}"><span th:replace="~{layout/parts :: status('info', #{officeorder.invoice.toConfirm})}">To confirm</span></th:block>
    <span th:if="${order.invoiceStatus == null}" class="text-body-secondary" th:text="#{officeorder.invoice.none}">None</span>
</th:block>

</body>
</html>
