<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/layout :: layout(~{::title}, ~{::main})}">
<head>
    <title th:text="#{request.list.title}">Approved requests</title>
</head>
<body>
<main>
    <div class="mb-4">
        <p class="eyebrow mb-1" th:text="#{portal.office}">Office portal</p>
        <h1 class="fw-bold mb-1" th:text="#{request.list.heading}">Approved requests</h1>
        <p class="text-body-secondary mb-0" th:text="#{request.list.hint}">Item requests approved by the Master, newest first.</p>
    </div>

    <!-- Filters. A GET form, so the filtered page can be bookmarked. -->
    <form class="row g-2 align-items-end mb-4" th:action="@{/office/requests}" method="get">
        <div class="col-12 col-md-5">
            <label for="filterShipId" class="form-label fw-semibold small" th:text="#{user.ship}">Ship</label>
            <select id="filterShipId" name="shipId" class="form-select">
                <option value="" th:text="#{crew.filter.allShips}">All ships</option>
                <option th:each="s : ${ships}" th:value="${s.id}" th:selected="${s.id == shipId}"
                        th:text="${s.name} + ' · ' + #{ship.codeValue(${s.imoNumber})}">MV Demo · IMO 9074729</option>
            </select>
        </div>
        <div class="col-12 col-md-auto">
            <div class="form-check mb-md-2">
                <input class="form-check-input" type="checkbox" id="filterNotExported" name="notExported"
                       value="true" th:checked="${notExported}">
                <label class="form-check-label" for="filterNotExported" th:text="#{request.filter.notExported}">Not exported yet</label>
            </div>
        </div>
        <div class="col-12 col-md-auto d-flex gap-2">
            <button type="submit" class="btn btn-outline-secondary flex-grow-1" th:text="#{crew.filter.apply}">Filter</button>
            <a class="btn btn-ghost" th:href="@{/office/requests}" th:text="#{crew.filter.clear}">Clear</a>
        </div>
    </form>

    <!-- Check requests and export them. The download does not reload this page. -->
    <form th:action="@{/office/requests/export}" method="post">
        <div class="card">
            <div class="card-header bg-transparent d-flex justify-content-between align-items-center gap-2 py-3">
                <h2 th:replace="~{layout/parts :: cardTitle(#{request.heading}, ${requests.size()})}">Requests · 3</h2>
                <button th:unless="${requests.isEmpty()}" type="submit" class="btn btn-primary btn-sm"
                        th:text="#{request.export}">Export CSV</button>
            </div>

            <p th:if="${requests.isEmpty()}" class="card-body text-body-secondary mb-0"
               th:text="#{request.list.empty}">No approved requests.</p>

            <!-- data-table: the shared list style; data-table-stack: one stacked card per row on phones,
                 stack-hide: not shown there. -->
            <div th:unless="${requests.isEmpty()}" class="table-responsive">
                <table class="table data-table data-table-stack align-middle mb-0">
                    <thead>
                    <tr>
                        <th scope="col"><span class="visually-hidden" th:text="#{request.select}">Select</span></th>
                        <th scope="col" th:text="#{request.id}">Request</th>
                        <th scope="col" th:text="#{user.ship}">Ship</th>
                        <th scope="col" th:text="#{request.requestedBy}">Requested by</th>
                        <th scope="col" th:text="#{request.approvedBy}">Approved by</th>
                        <th scope="col" th:text="#{request.approvedAt}">Approved at</th>
                        <th scope="col" class="num" th:text="#{request.lineCount}">Lines</th>
                        <th scope="col" th:text="#{request.exported}">Exported</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="r : ${requests}">
                        <td class="cell-select">
                            <input class="form-check-input" type="checkbox" name="ids" th:value="${r.id}"
                                   th:id="'select' + ${r.id}" th:attr="aria-label=#{request.number(${r.id})}">
                        </td>
                        <td class="cell-primary text-nowrap">
                            <a th:href="@{/office/requests/{id}(id=${r.id})}" th:text="#{request.number(${r.id})}">#12</a>
                        </td>
                        <td th:attr="data-label=#{user.ship}" th:text="${r.ship.name}">MV Demo</td>
                        <td class="stack-hide" th:text="${r.requestedBy} ? ${r.requestedBy.fullName} : #{audit.deletedUser}">Jane Doe</td>
                        <td class="stack-hide" th:text="${r.decidedBy} ? ${r.decidedBy.fullName} : #{audit.deletedUser}">John Smith</td>
                        <td th:attr="data-label=#{request.approvedAt}">
                            <time th:replace="~{layout/parts :: localTime(${r.decidedAt})}"></time>
                        </td>
                        <td class="num" th:attr="data-label=#{request.lineCount}" th:text="${r.lines.size()}">2</td>
                        <td class="cell-status">
                            <th:block th:if="${r.exportedAt}"><span
                                    th:replace="~{layout/parts :: status('ok', #{request.exported})}">Exported</span></th:block>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </form>
</main>
</body>
</html>
