<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/auth :: layout(#{passwordReset.reset.title}, ~{::main})}">
<body>
<!-- Password reset (P14), from the emailed link: the new password with the rules, show / hide and checklist of
     registration (layout/parts :: newPasswordFields). The language switch keeps the token. -->
<main th:replace="~{layout/parts :: authFrame(content=~{::authContent}, lang=true, token=${form.token})}">
    <th:block th:fragment="authContent">
        <header th:replace="~{layout/parts :: pageHeader(heading=#{passwordReset.reset.heading})}"></header>

        <form th:action="@{/password/reset}" th:object="${form}" method="post" novalidate>
            <input type="hidden" th:field="*{token}">
            <div th:replace="~{layout/parts :: errorSummary(${form}, '')}"></div>
            <div class="form-grid">
                <!-- The account the link is for: plain text, not an input. -->
                <dl class="static-fields">
                    <dt th:text="#{login.email}">Email</dt>
                    <dd th:text="${email}">jane@example.com</dd>
                </dl>
                <!-- Not shown and not sent: lets password managers save the new password with the email address. -->
                <input type="email" hidden th:value="${email}" autocomplete="username" aria-hidden="true">
                <th:block th:replace="~{layout/parts :: newPasswordFields(${form}, #{passwordReset.reset.password},
                        #{passwordReset.reset.confirmPassword})}"></th:block>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn btn-primary btn-lg w-100"
                        th:text="#{passwordReset.reset.submit}">Save new password</button>
            </div>
        </form>
    </th:block>
</main>
</body>
</html>
