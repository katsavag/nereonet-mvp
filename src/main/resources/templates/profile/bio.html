<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/layout :: layout(#{profile.field.bio}, ~{::main})}">
<body>
<!-- My profile, Bio (P31): plain text, at most 280 characters (the counter of P05), line breaks kept; shown as text,
     so a link is never a link. Empty is stored as nothing ("Not given"). The text is kept as a draft in the browser
     while the user types (P15, data-draft). -->
<main class="form-page">
    <header th:replace="~{layout/parts :: pageHeader(heading=#{profile.field.bio}, crumbs=~{::pageCrumbs})}">
        <th:block th:fragment="pageCrumbs">
            <li th:replace="~{layout/parts :: crumb(#{profile.title}, '/ship/profile')}"></li>
        </th:block>
    </header>

    <div class="card form-box">
        <div class="card-body p-3 p-md-4">
            <form th:action="@{/ship/profile/bio}" th:object="${form}" method="post" novalidate
                  th:data-draft="@{/ship/profile/bio}">
                <div>
                    <label for="bio" class="form-label" th:text="#{profile.bio.label}">A few words about you</label>
                    <textarea th:field="*{bio}" class="form-control" rows="5" th:errorclass="is-invalid"
                              aria-describedby="bioHint bioCounter"></textarea>
                    <div class="invalid-feedback" th:errors="*{bio}"></div>
                    <div class="form-meta">
                        <p id="bioHint" class="form-text" th:text="#{profile.bio.hint}">For your crewmates.</p>
                        <div th:replace="~{layout/parts :: counter(${form}, 'bio', 'bio')}"></div>
                    </div>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary" th:text="#{form.save}">Save</button>
                    <a class="btn btn-ghost" th:href="@{/ship/profile}" th:text="#{form.cancel}">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</main>
</body>
</html>
