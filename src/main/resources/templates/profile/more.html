<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:replace="~{layout/layout :: layout(#{more.title}, ~{::main})}">
<body>
<!-- More: the last tab of the crew's phone tab bar, an ordinary page (works without JavaScript). Who is signed
     in (picture, name, "rank · ship", so the next person on a shared PC sees whose session it is), then Notifications
     with its unread count and My profile, then what is not in this role's tab
     bar under the sidebar's headings, each with its counter: On board (News and Library for the Master and the Chief
     cook, My crew for everyone), Supplies (Vessel order for the Chief cook, Requests for crew members), and Sign out.
     From 768px the sidebar has the same entries; the page still works there.
     Model: me (User), ship, profile (CrewProfile). -->
<main class="more-page">
    <header th:replace="~{layout/parts :: pageHeader(heading=#{more.title})}"></header>

    <section class="more-user" aria-labelledby="moreUserName">
        <span th:replace="~{layout/parts :: personAvatar(${#authentication.principal.initials}, ${profile.photoUrl(96)}, 'lg')}"></span>
        <p class="more-user-text">
            <span class="more-user-label" th:text="#{more.signedInAs}">Signed in as</span>
            <span class="more-user-name" id="moreUserName" th:text="${me.fullName}">Demo Cook</span>
            <span class="more-user-meta"
                  th:text="(${me.rank != null} ? #{${'rank.' + me.rank}} : #{department.none}) + ' · ' + ${ship.name}">Chief Cook · MV Demo</span>
        </p>
    </section>

    <nav class="more-links" th:attr="aria-label=#{more.title}">
        <ul class="profile-rows">
            <!-- Notifications, with the number not read yet. -->
            <li class="profile-row-item">
                <a class="profile-row" th:href="@{/notifications}">
                    <svg th:replace="~{layout/parts :: navIcon('notifications')}"></svg>
                    <span class="profile-row-main"><span class="profile-row-title" th:text="#{nav.notifications}">Notifications</span></span>
                    <th:block th:if="${unreadNotifications != null and unreadNotifications > 0}">
                        <span class="more-count num" aria-hidden="true" th:text="${unreadNotifications > 99} ? '99+' : ${unreadNotifications}">3</span>
                        <span class="visually-hidden" th:text="${#messages.msg('nav.count.notifications', unreadNotifications)}">3 unread</span>
                    </th:block>
                    <svg class="profile-row-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m9 5 7 7-7 7"/></svg>
                </a>
            </li>
            <li class="profile-row-item">
                <a class="profile-row" th:href="@{/ship/profile}">
                    <svg th:replace="~{layout/parts :: navIcon('profile')}"></svg>
                    <span class="profile-row-main"><span class="profile-row-title" th:text="#{nav.profile}">My profile</span></span>
                    <svg class="profile-row-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m9 5 7 7-7 7"/></svg>
                </a>
            </li>
        </ul>

        <!-- What is not in the tab bar, under the sidebar's headings (navigation/ShipNav); a group with nothing
             left is not shown (the Master's Supplies are both tabs). -->
        <th:block th:replace="~{profile/more :: moreGroup('moreOnBoard', #{nav.group.ship}, ${shipNav.moreOnBoard()})}"></th:block>
        <th:block th:replace="~{profile/more :: moreGroup('moreSupplies', #{nav.group.supplies}, ${shipNav.moreSupplies()})}"></th:block>
    </nav>

    <form th:replace="~{layout/parts :: signOut('btn btn-outline-secondary more-sign-out')}"></form>
</main>

<!-- One group of the More page, outside main so it is shown only where it is used: its heading (id, the
     sidebar's group name) and a row per entry (navigation/ShipNav.Entry) with its counter; nothing when entries is
     empty (the Master's Supplies are both tabs). -->
<th:block th:fragment="moreGroup(id, heading, entries)">
    <th:block th:unless="${entries.isEmpty()}">
        <h2 class="more-group-title" th:id="${id}" th:text="${heading}">On board</h2>
        <ul class="profile-rows" th:attr="aria-labelledby=${id}">
            <li class="profile-row-item" th:each="e : ${entries}">
                <a class="profile-row" th:href="@{${e.url}}">
                    <svg th:replace="~{layout/parts :: navIcon(${e.section})}"></svg>
                    <span class="profile-row-main"><span class="profile-row-title" th:text="${#messages.msg(e.labelKey)}">News</span></span>
                    <th:block th:if="${e.countValue() > 0}">
                        <span class="more-count num" aria-hidden="true" th:text="${e.count > 99} ? '99+' : ${e.count}">2</span>
                        <span class="visually-hidden" th:text="${#messages.msg(e.countKey, e.count)}">2 not opened yet</span>
                    </th:block>
                    <svg class="profile-row-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m9 5 7 7-7 7"/></svg>
                </a>
            </li>
        </ul>
    </th:block>
</th:block>
</body>
</html>
