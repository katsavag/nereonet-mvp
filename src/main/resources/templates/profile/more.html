<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:replace="~{layout/layout :: layout(#{more.title}, ~{::main})}">
<body>
<!-- More (P31): the last tab of the crew's phone tab bar, an ordinary page (works without JavaScript). Who is signed
     in (picture, name, "rank · ship", so the next person on a shared PC sees whose session it is), then Notifications
     with its unread count (P47: no longer a tab of its own), (the Master only, P33, P35) Approvals with the number
     waiting and Ship order (the Chief cook too since P55, read only, without the number), (the Chief cook and crew members, P54) Requests with the number still waiting for the Master,
     (the Chief cook only, P52) Stores with the number Low or Out of stock, My profile, My crew and Sign out. From 768px the sidebar has the same entries; the page still works there.
     Model: me (User), ship, profile (CrewProfile). -->
<main class="more-page">
    <header th:replace="~{layout/parts :: pageHeader(heading=#{more.title})}"></header>

    <section class="more-user" aria-labelledby="moreUserName">
        <span th:replace="~{layout/parts :: personAvatar(${#authentication.principal.initials}, ${profile.photoUrl(96)}, 'lg')}"></span>
        <p class="more-user-text">
            <span class="more-user-label" th:text="#{more.signedInAs}">Signed in as</span>
            <span class="more-user-name" id="moreUserName" th:text="${me.fullName}">Demo Cook</span>
            <span class="more-user-meta"
                  th:text="(${me.rank != null} ? #{${'rank.' + me.rank}} : #{department.none}) + ' · ' + ${ship.name}">Chief Cook · MV Demo</span>
        </p>
    </section>

    <nav class="more-links" th:attr="aria-label=#{more.title}">
        <ul class="profile-rows">
            <!-- Notifications (P47), with the number not read yet. -->
            <li class="profile-row-item">
                <a class="profile-row" th:href="@{/notifications}">
                    <svg th:replace="~{layout/parts :: navIcon('notifications')}"></svg>
                    <span class="profile-row-main"><span class="profile-row-title" th:text="#{nav.notifications}">Notifications</span></span>
                    <th:block th:if="${unreadNotifications != null and unreadNotifications > 0}">
                        <span class="more-count num" aria-hidden="true" th:text="${unreadNotifications > 99} ? '99+' : ${unreadNotifications}">3</span>
                        <span class="visually-hidden" th:text="${#messages.msg('nav.count.notifications', unreadNotifications)}">3 unread</span>
                    </th:block>
                    <svg class="profile-row-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m9 5 7 7-7 7"/></svg>
                </a>
            </li>
            <!-- The Master's approvals (P33), with the number waiting for them. -->
            <li class="profile-row-item" sec:authorize="hasRole('MASTER')">
                <a class="profile-row" th:href="@{/ship/approvals}">
                    <svg th:replace="~{layout/parts :: navIcon('approvals')}"></svg>
                    <span class="profile-row-main"><span class="profile-row-title" th:text="#{nav.approvals}">Approvals</span></span>
                    <th:block th:if="${approvalsWaiting != null and approvalsWaiting > 0}">
                        <span class="more-count num" aria-hidden="true" th:text="${approvalsWaiting > 99} ? '99+' : ${approvalsWaiting}">2</span>
                        <span class="visually-hidden" th:text="${#messages.msg('nav.count.approvals', approvalsWaiting)}">2 waiting for you</span>
                    </th:block>
                    <svg class="profile-row-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m9 5 7 7-7 7"/></svg>
                </a>
            </li>
            <!-- The ship order (P35), with the number of lines in the OPEN order for the Master; the Chief cook reads it
                 (P55), without the counter (orderLines is null for them). -->
            <li class="profile-row-item" sec:authorize="hasAnyRole('MASTER', 'CHIEF_COOK')">
                <a class="profile-row" th:href="@{/ship/order}">
                    <svg th:replace="~{layout/parts :: navIcon('order')}"></svg>
                    <span class="profile-row-main"><span class="profile-row-title" th:text="#{nav.order}">Ship order</span></span>
                    <th:block th:if="${orderLines != null and orderLines > 0}">
                        <span class="more-count num" aria-hidden="true" th:text="${orderLines > 99} ? '99+' : ${orderLines}">2</span>
                        <span class="visually-hidden" th:text="${#messages.msg('nav.count.order', orderLines)}">2 lines</span>
                    </th:block>
                    <svg class="profile-row-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m9 5 7 7-7 7"/></svg>
                </a>
            </li>
            <!-- The Chief cook's and crew members' requests to the Master (P54), with the number still waiting. -->
            <li class="profile-row-item" sec:authorize="hasAnyRole('CHIEF_COOK', 'CREW_MEMBER')">
                <a class="profile-row" th:href="@{/ship/requests}">
                    <svg th:replace="~{layout/parts :: navIcon('requests')}"></svg>
                    <span class="profile-row-main"><span class="profile-row-title" th:text="#{nav.requests}">Requests</span></span>
                    <th:block th:if="${requestsWaiting != null and requestsWaiting > 0}">
                        <span class="more-count num" aria-hidden="true" th:text="${requestsWaiting > 99} ? '99+' : ${requestsWaiting}">1</span>
                        <span class="visually-hidden" th:text="${#messages.msg('nav.count.requests', requestsWaiting)}">1 waiting for the master</span>
                    </th:block>
                    <svg class="profile-row-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m9 5 7 7-7 7"/></svg>
                </a>
            </li>
            <!-- The Chief cook's store (P52), with the number of provisions Low or Out of stock. -->
            <li class="profile-row-item" sec:authorize="hasRole('CHIEF_COOK')">
                <a class="profile-row" th:href="@{/ship/stores}">
                    <svg th:replace="~{layout/parts :: navIcon('stores')}"></svg>
                    <span class="profile-row-main"><span class="profile-row-title" th:text="#{nav.stores}">Stores</span></span>
                    <th:block th:if="${storesBelowThreshold != null and storesBelowThreshold > 0}">
                        <span class="more-count num" aria-hidden="true" th:text="${storesBelowThreshold > 99} ? '99+' : ${storesBelowThreshold}">3</span>
                        <span class="visually-hidden" th:text="${#messages.msg('nav.count.stores', storesBelowThreshold)}">3 low or out of stock</span>
                    </th:block>
                    <svg class="profile-row-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m9 5 7 7-7 7"/></svg>
                </a>
            </li>
            <li class="profile-row-item">
                <a class="profile-row" th:href="@{/ship/profile}">
                    <svg th:replace="~{layout/parts :: navIcon('profile')}"></svg>
                    <span class="profile-row-main"><span class="profile-row-title" th:text="#{nav.profile}">My profile</span></span>
                    <svg class="profile-row-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m9 5 7 7-7 7"/></svg>
                </a>
            </li>
            <li class="profile-row-item">
                <a class="profile-row" th:href="@{/ship/crew}">
                    <svg th:replace="~{layout/parts :: navIcon('crew')}"></svg>
                    <span class="profile-row-main"><span class="profile-row-title" th:text="#{nav.myCrew}">My crew</span></span>
                    <svg class="profile-row-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m9 5 7 7-7 7"/></svg>
                </a>
            </li>
        </ul>
    </nav>

    <form th:replace="~{layout/parts :: signOut('btn btn-outline-secondary more-sign-out')}"></form>
</main>
</body>
</html>
