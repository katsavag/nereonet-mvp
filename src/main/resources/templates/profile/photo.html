<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/layout :: layout(#{profile.field.photo}, ~{::main})}">
<body>
<!-- My profile, Photo (P31). The current photo (the 512px version) or "No photo: your initials are shown.", then the
     upload: JPEG or PNG, at most 5 MB, said before a file is chosen (P05); js/forms.js shows the chosen file's name and
     size. With js/profile.js (this page and Languages only) the browser makes the photo smaller first (at most 800px
     on its longest side, JPEG) and shows a preview; without it the original is sent. Either way the server makes its
     own JPEGs without any metadata (core/profile/PhotoImages). "Delete my profile photo" asks first (P10, neutral).
     ?fileTooLarge comes from UploadTooLargeFilter. Model: me, ship, profile, maxPhotoSize; photoError: a message key. -->
<main class="form-page">
    <header th:replace="~{layout/parts :: pageHeader(heading=#{profile.field.photo}, crumbs=~{::pageCrumbs})}">
        <th:block th:fragment="pageCrumbs">
            <li th:replace="~{layout/parts :: crumb(#{profile.title}, '/ship/profile')}"></li>
        </th:block>
    </header>

    <div class="card form-box">
        <div class="card-body p-3 p-md-4">
            <div class="photo-current">
                <p class="form-label" th:text="#{profile.photo.current}">Your photo now</p>
                <img th:if="${profile.photoKey != null}" class="photo-large" th:src="@{${profile.photoUrl(512)}}"
                     th:alt="#{profile.photo.alt(${me.fullName})}" width="512" height="512">
                <div th:unless="${profile.photoKey != null}" class="photo-none">
                    <span th:replace="~{layout/parts :: personAvatar(${#authentication.principal.initials}, null, 'lg')}"></span>
                    <span th:text="#{profile.photo.none}">No photo: your initials are shown.</span>
                </div>
            </div>

            <form th:action="@{/ship/profile/photo}" method="post" enctype="multipart/form-data" novalidate
                  data-photo-form>
                <div>
                    <label for="photo" class="form-label" th:text="#{profile.photo.label}">Choose a photo</label>
                    <input type="file" id="photo" name="photo" class="form-control" accept="image/jpeg,image/png"
                           aria-describedby="photoHint photoInfo" data-file-info="photoInfo"
                           th:data-max-size="${maxPhotoSize}" th:data-too-large="#{profile.photo.error.tooLarge}"
                           th:data-resizing="#{profile.photo.resizing}" data-photo-input
                           th:classappend="${photoError != null} ? 'is-invalid'" required>
                    <div th:if="${photoError != null}" class="invalid-feedback" th:text="#{${photoError}}">Choose a photo.</div>
                    <div id="photoHint" class="form-text" th:text="#{profile.photo.hint}">JPEG or PNG, at most 5 MB.</div>
                    <p id="photoInfo" class="form-file-info" aria-live="polite" hidden></p>
                    <!-- js/profile.js puts the preview image in here, with data-alt as its alt text. -->
                    <figure class="photo-preview" data-photo-preview th:data-alt="#{profile.photo.preview}" hidden></figure>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary" th:text="#{form.save}">Save</button>
                    <a class="btn btn-ghost" th:href="@{/ship/profile}" th:text="#{form.cancel}">Cancel</a>
                </div>
            </form>

            <div th:if="${profile.photoKey != null}" class="photo-delete">
                <form th:replace="~{layout/parts :: confirmForm(action='/ship/profile/photo/delete',
                        label=#{profile.photo.delete}, linkClass='btn btn-outline-secondary',
                        title=#{profile.photo.delete.confirm.title}, body=#{profile.photo.delete.confirm.body},
                        confirm=#{profile.photo.delete.confirm.submit}, tone='neutral')}"></form>
            </div>
        </div>
    </div>
    <script th:src="@{/js/profile.js}" defer></script>
</main>
</body>
</html>
