<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/layout :: layout(#{registration.invalid.title}, ~{::main})}">
<body>
<main class="row g-0 min-vh-100 align-content-start align-content-md-stretch">
    <div class="col-md-5 col-lg-4 bg-navy bg-grid p-4 p-md-5">
        <div th:replace="~{layout/parts :: brand(#{login.tagline})}"></div>
    </div>

    <div class="col-md-7 col-lg-8 d-flex align-items-md-center justify-content-center p-3 p-md-4">
        <div class="login-box w-100 py-4">
            <header th:replace="~{layout/parts :: pageHeader(heading=#{registration.invalid.heading}, subtitle=#{registration.invalid.text})}"></header>
            <a th:href="@{/login}" class="btn btn-primary btn-lg w-100" th:text="#{registration.invalid.signIn}">Go to sign in</a>
        </div>
    </div>
</main>
</body>
</html>
