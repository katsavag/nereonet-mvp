<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/layout :: layout(#{ship.list.title}, ~{::main})}">
<body>
<!-- No ships yet (P25): the empty state holds Add ship, so the page header leaves it out. -->
<main th:with="noShips=${ships.isEmpty()}">
    <header th:replace="~{layout/parts :: pageHeader(heading=#{ship.list.heading}, count=${ships.size()}, actions=${noShips} ? null : ~{::pageActions})}">
        <th:block th:fragment="pageActions">
            <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#newShipModal">
                <svg th:replace="~{layout/parts :: icon('plus')}"></svg>
                <span th:text="#{ship.list.add}">Add ship</span>
            </button>
        </th:block>
    </header>

    <div class="card">
        <th:block th:if="${noShips}">
            <div th:replace="~{layout/parts :: emptyState(icon='ships', title=#{ship.list.empty.title},
                    text=#{ship.list.empty.text}, action=~{::pageActions})}"></div>
        </th:block>

        <!-- data-table: the shared list style; data-table-stack: one stacked card per row on phones. -->
        <div th:unless="${noShips}" class="table-responsive">
            <table class="table data-table data-table-stack align-middle mb-0">
                <thead>
                <tr>
                    <th th:replace="~{layout/parts :: sortHeader(${list}, 'name', #{ship.name})}"></th>
                    <th scope="col" th:text="#{ship.code}">Ship code</th>
                    <th scope="col" th:text="#{ship.type}">Type</th>
                    <th scope="col" th:text="#{ship.flag}">Flag</th>
                    <th th:replace="~{layout/parts :: sortHeader(${list}, 'score', #{vetting.score})}"></th>
                    <th scope="col" th:text="#{ship.status}">Status</th>
                    <th scope="col"><span class="visually-hidden" th:text="#{ship.actions}">Actions</span></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="s : ${ships}" th:classappend="${!s.active} ? 'text-body-secondary'">
                    <td class="cell-primary">
                        <a th:replace="~{layout/parts :: shipLink(${s})}">MV Demo</a>
                    </td>
                    <td class="text-nowrap" th:attr="data-label=#{ship.code}"
                        th:text="#{ship.codeValue(${s.imoNumber})}">IMO 9074729</td>
                    <td th:attr="data-label=#{ship.type}" th:text="${s.type} ? #{${'ship.type.' + s.type}} : '—'">Bulk carrier</td>
                    <!-- P43: the flag's image before the country. -->
                    <td th:attr="data-label=#{ship.flag}">
                        <th:block th:if="${s.flag}"><span th:replace="~{layout/parts :: country(${s.flag}, ${countries[s.flag]} ?: ${s.flag})}">Greece (GR)</span></th:block>
                        <th:block th:unless="${s.flag}">—</th:block>
                    </td>
                    <!-- The RightShip Safety Score (P40); for an active vessel a link to its Vetting page. -->
                    <td th:attr="data-label=#{vetting.score}" th:with="v=${rightShip[s.id] ?: noVetting}">
                        <a th:if="${s.active}" class="score-cell score-link" th:href="@{/office/vetting/{id}(id=${s.id})}">
                            <span th:replace="~{vetting/parts :: scoreBar(${v.score()}, ${v.scoreTone()}, null)}"></span>
                            <span th:replace="~{vetting/parts :: scoreText(${v})}">3/5</span>
                            <span class="visually-hidden" th:text="#{vetting.score.linkHint(${s.name})}">RightShip of MV Demo</span>
                        </a>
                        <th:block th:unless="${s.active}"><span th:replace="~{vetting/parts :: scoreText(${v})}">3/5</span></th:block>
                    </td>
                    <td class="cell-status">
                        <span th:replace="~{layout/parts :: status(${s.active} ? 'ok' : 'neutral', ${s.active} ? #{ship.status.active} : #{ship.status.inactive})}">Active</span>
                    </td>
                    <!-- Only the "more" menu: the ship page (its name) has everything else. Edit opens the pop-up; the
                         data-* values fill it (see the script below). Without JavaScript it opens the Edit page. -->
                    <td class="cell-actions">
                        <div class="row-actions">
                            <details th:replace="~{layout/parts :: rowMenu(#{common.moreActions(${s.name})}, ~{::shipMenuItems})}">
                                <th:block th:fragment="shipMenuItems">
                                    <a class="dropdown-item" th:href="@{/office/ships/{id}/edit(id=${s.id})}"
                                       data-bs-toggle="modal" data-bs-target="#editShipModal"
                                       th:data-action="@{/office/ships/{id}/edit(id=${s.id})}"
                                       th:data-imo="#{ship.codeValue(${s.imoNumber})}"
                                       th:data-name="${s.name}" th:data-type="${s.type}"
                                       th:data-flag="${s.flag} ? (${countries[s.flag]} ?: ${s.flag}) : ''"
                                       th:text="#{ship.edit}">Edit</a>
                                    <form th:unless="${s.active}" th:action="@{/office/ships/{id}/activate(id=${s.id})}" method="post">
                                        <button type="submit" class="dropdown-item"
                                                th:text="#{ship.activate}">Activate</button>
                                    </form>
                                    <th:block th:if="${s.active}">
                                        <hr class="dropdown-divider">
                                        <form th:replace="~{layout/parts :: confirmForm(action=${'/office/ships/' + s.id + '/deactivate'},
                                                label=#{ship.deactivate}, linkClass='dropdown-item dropdown-item-danger',
                                                title=#{ship.deactivate.confirm.title(${s.name})},
                                                body=#{ship.deactivate.confirm.body(${s.name})},
                                                confirm=#{ship.deactivate}, tone='neutral')}"></form>
                                    </th:block>
                                </th:block>
                            </details>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Add ship. Full screen on phones. -->
    <div class="modal fade" id="newShipModal" tabindex="-1" aria-labelledby="newShipModalTitle" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-fullscreen-sm-down">
            <form class="modal-content" th:action="@{/office/ships/new}" th:object="${newForm}" method="post" novalidate>
                <div class="modal-header">
                    <h2 class="modal-title h5 fw-bold" id="newShipModalTitle" th:text="#{ship.new.heading}">Add ship</h2>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"
                            th:attr="aria-label=#{common.close}"></button>
                </div>
                <div class="modal-body">
                    <div th:replace="~{layout/parts :: errorSummary(${newForm}, '')}"></div>
                    <div class="form-grid">
                        <div>
                            <label for="imoNumber" class="form-label" th:text="#{ship.imoNumber}">IMO number</label>
                            <input type="text" th:field="*{imoNumber}" class="form-control num"
                                   th:classappend="${#fields.hasErrors('imoNumber') or #fields.hasErrors('imoNumberValid')} ? 'is-invalid'"
                                   inputmode="numeric" autocomplete="off" aria-describedby="imoNumberHint" required>
                            <div class="invalid-feedback" th:errors="*{imoNumber}"></div>
                            <div class="invalid-feedback" th:errors="*{imoNumberValid}"></div>
                            <div id="imoNumberHint" class="form-text" th:text="#{ship.imoNumberHint}">7 digits, e.g. 9074729.</div>
                        </div>
                        <div>
                            <label for="name" class="form-label" th:text="#{ship.name}">Name</label>
                            <input type="text" th:field="*{name}" class="form-control" th:errorclass="is-invalid"
                                   autocomplete="off" aria-describedby="nameCounter" required>
                            <div class="invalid-feedback" th:errors="*{name}"></div>
                            <div class="form-meta">
                                <div th:replace="~{layout/parts :: counter(${newForm}, 'name', 'name')}"></div>
                            </div>
                        </div>
                        <div class="field-half">
                            <label for="type" class="form-label">[[#{ship.type}]] <span th:replace="~{layout/parts :: optional}"></span></label>
                            <select th:field="*{type}" class="form-select" th:errorclass="is-invalid">
                                <option value="" th:text="#{ship.type.none}">Not set</option>
                                <option th:each="t : ${types}" th:value="${t}" th:text="#{${'ship.type.' + t}}">Bulk carrier</option>
                            </select>
                            <div class="invalid-feedback" th:errors="*{type}"></div>
                        </div>
                        <div class="field-half">
                            <label for="flag" class="form-label">[[#{ship.flag}]] <span th:replace="~{layout/parts :: optional}"></span></label>
                            <input type="text" th:field="*{flag}" class="form-control" list="countryOptions"
                                   th:classappend="${#fields.hasErrors('flagValid')} ? 'is-invalid'"
                                   autocomplete="off" aria-describedby="flagHint">
                            <div class="invalid-feedback" th:errors="*{flagValid}"></div>
                            <div id="flagHint" class="form-text" th:text="#{ship.flagHint}">Country of registry.</div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-ghost" data-bs-dismiss="modal"
                            th:text="#{form.cancel}">Cancel</button>
                    <button type="submit" class="btn btn-primary" th:text="#{form.save}">Save</button>
                </div>

                <!-- The form was posted with errors: open the modal again so they are visible. -->
                <script th:if="${#fields.hasAnyErrors()}">
                    document.addEventListener('DOMContentLoaded',
                        () => bootstrap.Modal.getOrCreateInstance('#newShipModal').show());
                </script>
            </form>
        </div>
    </div>

    <!-- Edit ship: one modal for all rows. editShip is set only when a save failed. -->
    <div th:replace="~{ship/parts :: editModal(${editShip}, null)}"></div>

    <!-- Countries for the flag fields of both modals. -->
    <datalist th:replace="~{ship/parts :: countryOptions}"></datalist>

    <!-- Fills the edit modal from the Edit entry that opened it. -->
    <script>
        document.getElementById('editShipModal').addEventListener('show.bs.modal', event => {
            const button = event.relatedTarget;
            if (!button) {
                return; // reopened after a failed save: keep the posted values and errors
            }
            const form = event.target.querySelector('form');
            form.action = button.dataset.action;
            form.querySelector('#editImo').textContent = button.dataset.imo;
            form.querySelector('#editName').value = button.dataset.name;
            form.querySelector('#editType').value = button.dataset.type ?? '';
            form.querySelector('#editFlag').value = button.dataset.flag ?? '';
            form.querySelector('#editName').dispatchEvent(new Event('input')); // update the counter
            form.querySelectorAll('.is-invalid').forEach(field => field.classList.remove('is-invalid'));
            form.querySelector('.error-summary')?.remove();
        });
    </script>
</main>
</body>
</html>
