<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/layout :: layout(#{ship.new.heading}, ~{::main})}">
<body>
<!-- Add vessel as a page (P45): where Add vessel leads without JavaScript (the ships list opens a pop-up), where
     "Look up by IMO" shows what VesselAPI returned (ship/parts :: lookupResults, inside the form, so a flag choice is
     posted with it), and where a failed save from here or after a lookup shows its errors. -->
<main class="form-page">
    <header th:replace="~{layout/parts :: pageHeader(heading=#{ship.new.heading}, crumbs=~{::pageCrumbs})}">
        <th:block th:fragment="pageCrumbs">
            <li th:replace="~{layout/parts :: crumb(#{nav.ships}, '/office/ships')}"></li>
        </th:block>
    </header>

    <div class="card form-box">
        <div class="card-body p-3 p-md-4">
            <form th:action="@{/office/ships/new}" th:object="${newForm}" method="post" novalidate>
                <input type="hidden" name="page" value="true">
                <th:block th:replace="~{ship/parts :: newFields}"></th:block>
                <th:block th:if="${lookup != null}"><section th:replace="~{ship/parts :: lookupResults}"></section></th:block>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary" th:text="#{form.save}">Save</button>
                    <a class="btn btn-ghost" th:href="@{/office/ships}" th:text="#{form.cancel}">Cancel</a>
                </div>
            </form>
        </div>
    </div>

    <datalist th:replace="~{ship/parts :: countryOptions}"></datalist>
</main>
</body>
</html>
