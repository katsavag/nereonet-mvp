<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/layout :: layout(#{home.title}, ~{::main})}">
<body>
<!-- The crew home page (P26), for the Chief cook and Crew members (the Master has masterhome/home): what this person is asked to read and whether their certificates are in order, in one
     phone screen. English only, as every crew screen. Read only except Sign out. No images (but the person's own
     profile photo, P31), no script of its own.
     Phones: one column (To read, My certificates); from 992px To read on the left, the certificates on the right.
     The header says who is signed in, their rank and ship; on a shared PC "Not Demo Cook? Sign out" sits next to the
     name, from 768px only (P39, .from-md: on phones Sign out is under More). P31: the person's profile photo (96px version) or initials before the name. -->
<main class="crew-home" th:with="u=${home.user}, today=${@dates.today()},
        photo=${home.photoKey != null} ? ${'/ship/crew/' + u.id + '/photo/' + home.photoKey + '/96'} : null">
    <header th:replace="~{layout/parts :: pageHeader(heading=${u.fullName}, eyebrowShip=${home.ship},
            subtitle=${u.rank != null} ? #{${'rank.' + u.rank}} : #{${'role.' + u.role}}, actions=~{::pageActions},
            media=~{::pageMedia})}">
        <th:block th:fragment="pageMedia">
            <span th:replace="~{layout/parts :: personAvatar(${#authentication.principal.initials}, ${photo}, 'lg')}"></span>
        </th:block>
        <th:block th:fragment="pageActions">
            <div class="home-sign-out from-md">
                <span class="home-sign-out-name" th:text="#{home.notYou(${u.fullName})}">Not Demo Cook?</span>
                <form th:replace="~{layout/parts :: signOut('btn btn-outline-secondary')}"></form>
            </div>
        </th:block>
    </header>

    <div class="row g-4">
        <div class="col-lg-7">
            <!-- To read: Required library items not yet acknowledged and news items (P27) not opened yet (P39), oldest
                 first. Each card opens the item: a library item has "I have read this"; a news item is read by opening
                 it. -->
            <section class="home-section" aria-labelledby="toReadTitle">
                <h2 class="home-section-title" id="toReadTitle">
                    <span th:text="#{home.toRead.heading}">To read</span>
                    <span th:unless="${home.toRead.isEmpty()}" class="title-count"><span aria-hidden="true">·</span>
                        <span class="num" th:text="${home.toRead.size()}">1</span></span>
                </h2>
                <ul th:unless="${home.toRead.isEmpty()}" class="read-list">
                    <li th:each="r : ${home.toRead}">
                        <a class="read-card" th:href="@{${r.url}}">
                            <th:block th:if="${r.version != null}"><span
                                    th:replace="~{core/library/parts :: typeIcon(${r.version})}"></span></th:block>
                            <!-- A news item: the sidebar's News icon; the type below says it in words. -->
                            <span th:if="${r.version == null}" class="read-card-icon" aria-hidden="true"><svg
                                    th:replace="~{layout/parts :: navIcon('announcements')}"></svg></span>
                            <span class="read-card-main">
                                <span class="read-card-type" th:text="#{${'home.toRead.kind.' + r.kind}}">Library</span>
                                <span class="read-card-title" th:text="${r.title}">Drug and alcohol policy</span>
                                <span class="read-card-date"><span th:text="#{${'home.toRead.date.' + r.kind}}">Published</span>
                                    <time th:replace="~{layout/parts :: utcDate(${r.date})}"></time></span>
                            </span>
                            <svg class="read-card-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"
                                 focusable="false"><path d="m9 5 7 7-7 7"/></svg>
                        </a>
                    </li>
                </ul>
                <p th:if="${home.toRead.isEmpty()}" class="up-to-date">
                    <svg th:replace="~{layout/parts :: icon('check')}"></svg>
                    <span th:text="#{home.toRead.empty}">You are up to date.</span>
                </p>
                <p class="home-links">
                    <a class="btn btn-ghost" th:href="@{/ship/news}" th:text="#{home.links.announcements}">All news</a>
                    <a class="btn btn-ghost" th:href="@{/ship/library}" th:text="#{home.links.library}">Open the Library</a>
                </p>
            </section>
        </div>

        <div class="col-lg-5">
            <!-- The person's own certificates, soonest expiry first (expired, then expiring soon). Read only. -->
            <section class="home-section" aria-labelledby="certificatesTitle">
                <h2 class="home-section-title" id="certificatesTitle" th:text="#{home.certificates.heading}">My certificates</h2>
                <!-- P42: "2 required documents missing", to My profile; only when something is. -->
                <th:block th:replace="~{crew/parts :: documentsMissingLink(${documentsMissing})}"></th:block>
                <div th:replace="~{crew/parts :: myCertificates(${home.certificates}, ${today}, false, null)}"></div>
                <p th:replace="~{layout/parts :: infoNote(null, #{home.certificates.contact})}"></p>
            </section>
        </div>
    </div>
</main>
</body>
</html>
