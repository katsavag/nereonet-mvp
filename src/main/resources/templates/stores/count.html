<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/layout :: layout(#{stores.count.title}, ~{::main})}">
<body>
<!-- Counting the inventory by hand, the Chief cook only. One form for the whole page; nothing is saved before
     "Save count".
     - Count by voice first (stores/parts :: voiceCard, js/stores-voice.js), always there: when the server is not set
       up or there is nothing to count it says so and has no button. Then the link to a voice count waiting for review.
     - Every active provisions item, by storage place as on Inventory ("Other" last; two cards per row from 992px): a row is the name, one quantity
       field with the quantity the inventory has now, and the unit. The hidden shown[id] is the quantity the page
       showed, so a row left as it was writes nothing.
     - "Add an item that is not on the list": name, unit, quantity counted and where it is kept (the vessel's places
       as suggestions). Filled in, the item joins the vessel's list and is counted by the same Save.
     - The bar at the bottom of the screen: "Save count", always enabled. Anything wrong: the page comes back with
       every typed value, the message under each wrong row or field, and nothing saved.
     - js/stores-changed.js marks the rows whose number was changed and says how many in the bar and in each card's
       header; without it there is no mark, no number in the bar, and the headers say what the server rendered.
     - data-draft: js/save.js keeps what is typed in the browser if the connection drops, and removes it once the
       count is saved.
     English only. Model: stores (StoresService.Stores), form (CountForm), rowErrors (item id: message),
     firstError (the item id of the first refused row, or null),
     voiceEnabled, voicePending. Each count follows the rule of the item's unit, 0 allowed, up to the inventory
     maximum (README 35). -->
<main class="stores-count" th:with="s=${stores}">
    <header th:replace="~{layout/parts :: pageHeader(heading=#{stores.count.title}, crumbs=~{::pageCrumbs},
            eyebrowShip=${s.ship}, subtitle=#{stores.count.hint})}">
        <th:block th:fragment="pageCrumbs">
            <li th:replace="~{layout/parts :: crumb(#{stores.title}, '/ship/stores')}"></li>
        </th:block>
    </header>

    <section th:replace="~{stores/parts :: voiceCard(@{/ship/stores/count/voice}, #{stores.voice.hint},
            ${!voiceEnabled} ? #{stores.voice.off.notSetUp} : (${s.total == 0} ? #{stores.voice.failure.NO_ITEMS} : null))}"></section>

    <!-- A voice count waiting in the session for its review (VoiceCountController). -->
    <p th:if="${voicePending}" class="alert alert-info voice-pending" role="status">
        <span th:text="#{stores.voice.pending}">A voice count is waiting for your review.</span>
        <a class="alert-link" th:href="@{/ship/stores/count/voice}" th:text="#{stores.voice.pendingLink}">Review it</a>
    </p>

    <form method="post" novalidate class="stores-count-form" data-count-form th:object="${form}"
          th:action="@{/ship/stores/count}" th:data-draft="@{/ship/stores/count}">
        <div th:if="${s.total == 0}" class="card mb-4">
            <div th:replace="~{layout/parts :: emptyState(icon='stores', title=#{stores.empty.title},
                    text=#{stores.empty.text}, action=null)}"></div>
        </div>

        <!-- The storage places, each a card that can be closed (layout/parts :: foldCard), flowing in two columns from
             992px (.card-flow; the browser balances them again whenever a card opens or closes). Nothing is
             remembered, so every visit starts with every card open. A card with a refused row cannot be closed. -->
        <div th:unless="${s.groups.isEmpty()}" class="card-flow mb-4">
        <th:block th:each="g, it : ${s.groups}" th:with="groupId=${'storesCountPlace' + it.index},
                changed=${form.changed(g.levels)}, refused=${g.countOf(rowErrors.keySet())}">
        <details th:replace="~{layout/parts :: foldCard(id=${groupId},
                title=${g.place != null} ? ${g.place} : #{stores.place.other}, facts=~{::placeFacts},
                body=~{::placeRows}, key=null, locked=${refused > 0}, extra=null)}">
            <th:block th:fragment="placeFacts">
                <span class="fold-fact text-meta" th:text="#{fold.items(${g.levels.size()})}">12 items</span>
                <span class="fold-fact text-meta text-danger-emphasis" data-fold-refused th:hidden="${refused == 0}"
                      th:data-text="#{fold.refused('{n}')}" th:text="#{fold.refused(${refused})}">1 to correct</span>
                <span class="fold-fact fold-done text-meta"><span th:replace="~{layout/parts :: foldTick}"></span><span
                        data-fold-changed th:data-none="#{stores.count.fold.none}"
                        th:data-many="#{stores.count.fold.changed('{count}')}"
                        th:text="${changed == 0} ? #{stores.count.fold.none} : #{stores.count.fold.changed(${changed})}">nothing changed</span></span>
            </th:block>
            <th:block th:fragment="placeRows">
            <ul class="list-group list-group-flush">
                <li th:each="l : ${g.levels}" class="list-group-item stores-count-row" data-count-row
                    th:with="id=${l.item.id}, error=${rowErrors.get(l.item.id)},
                             rule=${@quantityRules.forItem(l.item, 'COUNT')},
                             now=${l.quantity.stripTrailingZeros().toPlainString()}">
                    <div class="stores-count-name">
                        <label class="stores-row-name" th:for="${'count-' + id}" th:text="${l.item.name}">Basmati rice</label>
                        <span class="text-meta" data-count-mark hidden th:text="#{stores.count.changed}">changed</span>
                    </div>
                    <input type="hidden" data-count-shown th:name="${'shown[' + id + ']'}"
                           th:value="${form.shown.get(id) ?: now}">
                    <input th:replace="~{layout/parts :: quantityInput(id=${'count-' + id},
                            name=${'quantities[' + id + ']'}, value=${form.quantities.get(id) ?: now},
                            rule=${rule}, cls='stores-count-input', invalid=${error != null}, kept=${l.quantity},
                            autofocus=${id == firstError},
                            describedBy=${'count-' + id + '-unit count-' + id + '-hint'
                                    + (error != null ? ' count-' + id + '-error' : '')})}">
                    <span class="stores-count-unit" th:id="${'count-' + id + '-unit'}" th:text="${l.item.unit}">kg</span>
                    <p th:if="${error != null}" class="stores-count-error" th:id="${'count-' + id + '-error'}"
                       th:text="${error}">Enter zero or more.</p>
                    <span th:replace="~{layout/parts :: quantityHint(${rule}, ${'count-' + id + '-hint'})}"></span>
                </li>
            </ul>
            </th:block>
        </details>
        </th:block>
        </div>

        <!-- An item on the shelf that is not on the list: saved, and counted, by the same "Save count". -->
        <section class="card stores-add" aria-labelledby="countAddTitle">
            <div class="card-body p-3 p-md-4">
                <h2 class="h5 fw-bold" id="countAddTitle" th:text="#{stores.count.add.heading}">Add an item that is
                    not on the list</h2>
                <p class="text-body-secondary small" th:text="#{stores.count.add.hint}">It joins the vessel's list
                    when you save the count.</p>
                <div class="stores-add-grid">
                    <div class="stores-add-name">
                        <label for="newName" class="form-label" th:text="#{stores.count.add.name}">Name</label>
                        <input type="text" class="form-control" th:field="*{newName}" th:errorclass="is-invalid"
                               autocomplete="off" aria-describedby="newNameCounter">
                        <div class="invalid-feedback" th:errors="*{newName}"></div>
                        <div class="form-meta">
                            <div th:replace="~{layout/parts :: counter(${form}, 'newName', 'newName')}"></div>
                        </div>
                    </div>
                    <div>
                        <label for="newUnit" class="form-label" th:text="#{stores.count.add.unit}">Unit</label>
                        <!-- Required once a field of the new item is filled (StoresController), so not "required" here. -->
                        <select th:replace="~{layout/parts :: unitSelect(id='newUnit', name='newUnit', value=*{newUnit},
                                current=null, required=false, invalid=${#fields.hasErrors('newUnit')},
                                describedBy=${#fields.hasErrors('newUnit')} ? 'newUnitError' : null)}"></select>
                        <div class="invalid-feedback" id="newUnitError" th:errors="*{newUnit}"></div>
                    </div>
                    <!-- The rule of the unit chosen beside it (js/quantity.js follows the unit as it changes). -->
                    <div th:with="newRule=${@quantityRules.forUnit(form.newUnit, 'COUNT')},
                                  err=${#fields.hasErrors('newQuantity')}">
                        <label for="newQuantity" class="form-label" th:text="#{stores.count.add.quantity}">Quantity
                            counted</label>
                        <input th:replace="~{layout/parts :: quantityInput(id='newQuantity', name='newQuantity',
                                value=*{newQuantity}, rule=${newRule}, cls='', invalid=${err},
                                describedBy=${'newQuantityHint' + (err ? ' newQuantityError' : '')},
                                unitField='newUnit')}">
                        <div class="invalid-feedback" id="newQuantityError" th:errors="*{newQuantity}"></div>
                        <span th:replace="~{layout/parts :: quantityHint(${newRule}, 'newQuantityHint')}"></span>
                    </div>
                    <div class="stores-add-place">
                        <label for="newPlace" class="form-label">[[#{stores.count.add.place}]] <span th:replace="~{layout/parts :: optional}"></span></label>
                        <input type="text" class="form-control" th:field="*{newPlace}" th:errorclass="is-invalid"
                               autocomplete="off" list="countPlaces" aria-describedby="newPlaceCounter">
                        <datalist id="countPlaces">
                            <option th:each="place : ${s.places()}" th:value="${place}"></option>
                        </datalist>
                        <div class="invalid-feedback" th:errors="*{newPlace}"></div>
                        <div class="form-meta">
                            <div th:replace="~{layout/parts :: counter(${form}, 'newPlace', 'newPlace')}"></div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- The one Save of the page, stuck to the bottom of the screen (above the tab bar on phones). The text is
             written by js/stores-changed.js: "3 items changed". -->
        <div class="stores-count-bar">
            <p class="stores-count-total text-meta" role="status" data-count-total
               th:data-none="#{stores.count.changed.none}" th:data-one="#{stores.count.changed.one}"
               th:data-many="#{stores.count.changed.many('{count}')}"></p>
            <button type="submit" class="btn btn-primary" th:text="#{stores.count.save}">Save count</button>
        </div>
    </form>

    <th:block th:with="units=${@quantityRules.unitsJson('COUNT')}">
        <div th:replace="~{layout/parts :: quantityTexts('COUNT', ${units})}"></div>
    </th:block>
    <script th:src="@{/js/fold-cards.js}" defer></script>
    <script th:src="@{/js/stores-changed.js}" defer></script>
    <script th:if="${voiceEnabled and s.total > 0}" th:src="@{/js/stores-voice.js}" defer></script>
</main>
</body>
</html>
