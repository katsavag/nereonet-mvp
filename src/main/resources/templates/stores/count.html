<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/layout :: layout(#{stores.count.title}, ~{::main})}">
<body>
<!-- Counting the store by hand (P53), the Chief cook only: every active provisions item, by storage place as on Stores
     ("Other" last), each row with the quantity the store expects in its own small form. Each row is saved on its own
     the moment it changes: there is no Save for the page, no draft and nothing to resume.
     - js/stores-count.js sends a row as soon as its input changes (Accept: application/json) and updates it in place:
       the input, the status badge and a short "Saved"; a refused value shows its error under that row only.
     - Without it each row's Save posts the form; the page comes back at the same row (#item-<id>) with "Saved", or
       with the error and the value sent (flash countSaved / countError, StoresController).
     - Offline or the connection dropped: the row says it was not saved (data-not-sent) and keeps the value typed.
     data-autosave: js/save.js does not ask "leave this page?" for these forms, everything changed is already stored.
     P57: Count by voice above the items (js/stores-voice.js), and a link to a voice count waiting for review.
     English only. Model: stores (StoresService.Stores), countSaved (an item id) or countError (CountError),
     voiceEnabled, voicePending. P60: each count follows the rule of the item's unit,
     0 allowed, up to the store maximum (README 35). -->
<main class="stores-count" th:with="s=${stores}" data-count-page
      th:attr="data-not-sent=#{stores.count.notSent}">
    <header th:replace="~{layout/parts :: pageHeader(heading=#{stores.count.title}, crumbs=~{::pageCrumbs},
            eyebrowShip=${s.ship}, subtitle=#{stores.count.hint})}">
        <th:block th:fragment="pageCrumbs">
            <li th:replace="~{layout/parts :: crumb(#{stores.title}, '/ship/stores')}"></li>
        </th:block>
    </header>

    <!-- P57: a voice count waiting in the session for its review (VoiceCountController). -->
    <p th:if="${voicePending}" class="alert alert-info voice-pending" role="status">
        <span th:text="#{stores.voice.pending}">A voice count is waiting for your review.</span>
        <a class="alert-link" th:href="@{/ship/stores/count/voice}" th:text="#{stores.voice.pendingLink}">Review it</a>
    </p>

    <!-- P57, Count by voice: only when both providers are configured (or faked) and there is something to count
         (stores/parts :: voiceCard). -->
    <th:block th:if="${voiceEnabled and s.total > 0}">
        <section th:replace="~{stores/parts :: voiceCard(@{/ship/stores/count/voice}, #{stores.voice.hint})}"></section>
    </th:block>

    <div th:if="${s.total == 0}" class="card">
        <div th:replace="~{layout/parts :: emptyState(icon='stores', title=#{stores.empty.title},
                text=#{stores.empty.text}, action=null)}"></div>
    </div>

    <section th:each="g, it : ${s.groups}" class="card mb-4" th:with="groupId=${'storesCountPlace' + it.index}"
             th:attr="aria-labelledby=${groupId}">
        <div class="card-header d-flex justify-content-between align-items-center py-3">
            <h2 class="h5 fw-bold mb-0" th:id="${groupId}"
                th:text="${g.place != null} ? ${g.place} : #{stores.place.other}">Dry store</h2>
            <span class="font-monospace small text-body-secondary" th:text="${g.levels.size()}">4</span>
        </div>
        <ul class="list-group list-group-flush">
            <li th:each="l : ${g.levels}" class="list-group-item stores-count-row" th:id="${'item-' + l.item.id}"
                data-count-row
                th:with="id=${l.item.id}, failed=${countError != null and countError.itemId == l.item.id},
                         rule=${@quantityRules.forItem(l.item, 'COUNT')},
                         saved=${countSaved != null and countSaved == l.item.id}">
                <label class="stores-row-name" th:for="${'count-' + id}" th:text="${l.item.name}">Basmati rice</label>
                <form class="stores-count-form" method="post" novalidate data-autosave data-count-form
                      th:action="@{/ship/stores/items/{id}/count(id=${id})}">
                    <input th:replace="~{layout/parts :: quantityInput(id=${'count-' + id}, name='quantity',
                            value=${failed} ? ${countError.value} : ${l.quantity.stripTrailingZeros().toPlainString()},
                            rule=${rule}, cls='form-control-sm stores-count-input', invalid=${failed},
                            describedBy=${'count-' + id + '-unit count-' + id + '-hint count-' + id + '-error'})}">
                    <span class="stores-count-unit" th:id="${'count-' + id + '-unit'}" th:text="${l.item.unit}">kg</span>
                    <button type="submit" class="btn btn-outline-secondary btn-sm" data-count-save
                            th:text="#{stores.count.save}">Save</button>
                </form>
                <span class="stores-count-status" data-count-status><span th:replace="~{stores/parts :: statusBadge(${l.status})}"></span></span>
                <span class="stores-count-saved" role="status" data-count-saved
                      th:text="${saved} ? #{stores.count.saved} : ''"></span>
                <p class="stores-count-error" th:id="${'count-' + id + '-error'}" data-count-error
                   th:text="${failed} ? ${#messages.msgWithParams(countError.message.codes[0], countError.message.arguments)} : ''"
                   th:hidden="${!failed}"></p>
                <span th:replace="~{layout/parts :: quantityHint(${rule}, ${'count-' + id + '-hint'})}"></span>
            </li>
        </ul>
    </section>

    <p th:if="${s.total > 0}" class="text-body-secondary small" th:text="#{stores.count.done}">
        Every change is saved as you go. Leave this page whenever you like.</p>

    <div th:replace="~{layout/parts :: quantityTexts('COUNT', null)}"></div>
    <script th:src="@{/js/stores-count.js}" defer></script>
    <script th:if="${voiceEnabled and s.total > 0}" th:src="@{/js/stores-voice.js}" defer></script>
</main>
</body>
</html>
