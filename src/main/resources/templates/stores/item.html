<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/layout :: layout(${detail.level.item.name}, ~{::main})}">
<body>
<!-- One provisions item of the Chief cook's store: its unit, place ("Not set" without one), quantity on board and
     status, then its history, newest first: date and time, type (Count, Delivery received with its order number, a
     link to the order page that the cook reads),
     before and after, for a count the difference, counted minus expected ("-3"; a dash for a delivery), who ("Deleted user" when the account is gone) and the
     note. Read only. English only.
     The history is 10 a page with the shared pager. Model: detail (StoresService.ItemDetail), list (ListQuery). -->
<main class="stores-item" th:with="l=${detail.level}, item=${detail.level.item}">
    <header th:replace="~{layout/parts :: pageHeader(heading=${item.name}, crumbs=~{::pageCrumbs},
            eyebrowShip=${detail.ship})}">
        <th:block th:fragment="pageCrumbs">
            <li th:replace="~{layout/parts :: crumb(#{stores.title}, '/ship/stores')}"></li>
        </th:block>
    </header>

    <div class="card mb-4">
        <dl class="card-body facts-grid">
            <div class="fact">
                <dt th:text="#{stores.item.quantity}">In stock</dt>
                <dd><span th:replace="~{stores/parts :: quantity(${l.quantity}, ${item.unit})}"></span></dd>
            </div>
            <div class="fact">
                <dt th:text="#{stores.item.status}">Status</dt>
                <dd><span th:replace="~{stores/parts :: statusBadge(${l.status})}"></span></dd>
            </div>
            <div class="fact">
                <dt th:text="#{stores.item.unit}">Unit</dt>
                <dd th:text="${item.unit}">kg</dd>
            </div>
            <div class="fact">
                <dt th:text="#{stores.item.place}">Place</dt>
                <dd th:text="${item.place != null} ? ${item.place} : #{stores.item.placeNone}">Dry store</dd>
            </div>
        </dl>
    </div>

    <section class="card mb-4" id="storesHistory" aria-labelledby="storesHistoryTitle">
        <div class="card-header py-3">
            <h2 class="h5 fw-bold mb-0" id="storesHistoryTitle" th:text="#{stores.history.heading}">History</h2>
        </div>
        <p th:if="${detail.history.isEmpty()}" class="card-body mb-0 text-body-secondary"
           th:text="#{stores.history.empty}">No counts or deliveries yet.</p>
        <div th:unless="${detail.history.isEmpty()}" class="table-responsive">
            <table class="table data-table data-table-stack align-middle mb-0 stores-history">
                <thead>
                <tr>
                    <th scope="col" th:text="#{stores.history.at}">Date</th>
                    <th scope="col" th:text="#{stores.history.type}">Type</th>
                    <th scope="col" class="text-end" th:text="#{stores.history.before}">Before</th>
                    <th scope="col" class="text-end" th:text="#{stores.history.after}">After</th>
                    <th scope="col" class="text-end" th:text="#{stores.history.difference}">Difference</th>
                    <th scope="col" th:text="#{stores.history.by}">By</th>
                    <th scope="col" th:text="#{stores.history.note}">Note</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="m : ${detail.history}">
                    <td th:attr="data-label=#{stores.history.at}"><time th:replace="~{layout/parts :: localTime(${m.at})}"></time></td>
                    <td th:attr="data-label=#{stores.history.type}">
                        <span th:text="#{${m.type.labelKey()}}">Count</span>
                        <span th:if="${m.order != null}" class="text-body-secondary">· <a th:href="@{/ship/orders/{id}(id=${m.order.id})}"
                                th:text="#{order.number(${m.order.id})}">Order #12</a></span>
                    </td>
                    <td class="text-end font-monospace" th:attr="data-label=#{stores.history.before}"
                        th:text="${m.quantityBefore.stripTrailingZeros().toPlainString()}">0</td>
                    <td class="text-end font-monospace" th:attr="data-label=#{stores.history.after}"
                        th:text="${m.quantityAfter.stripTrailingZeros().toPlainString()}">40</td>
                    <td class="text-end font-monospace" th:attr="data-label=#{stores.history.difference}"><th:block
                            th:if="${m.type.name() == 'COUNT'}"><span th:replace="~{stores/parts :: difference(${m.difference})}"></span></th:block><th:block
                            th:unless="${m.type.name() == 'COUNT'}">—</th:block></td>
                    <td th:attr="data-label=#{stores.history.by}"
                        th:text="${m.by != null} ? ${m.by.fullName} : #{audit.deletedUser}">Demo Cook</td>
                    <td class="stores-note" th:attr="data-label=#{stores.history.note}"
                        th:text="${m.note != null} ? ${m.note} : '—'">—</td>
                </tr>
                </tbody>
            </table>
        </div>
        <nav th:replace="~{layout/parts :: pager(${detail.history}, ${list})}"></nav>
    </section>
</main>
</body>
</html>
