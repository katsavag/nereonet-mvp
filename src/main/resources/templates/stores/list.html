<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/layout :: layout(#{stores.title}, ~{::main})}">
<body>
<!-- The Chief cook's store: the stock of their own ship's provisions. English only, as every crew screen.
     One action in the header, Count. Summary, one strip of chips (layout "Stat strip" in app.css): Low and Out of
     stock (each a link to that filter, tinted above zero), the date of the last
     count ("Not counted yet"; the chip is the link to History, every movement of the vessel, and says so),
     the cook's requests waiting for the Master (to Requests, Waiting), and the next delivery, port
     and date, linking to its order (read only for the cook), or "None scheduled".
     Then the search and the status filter (All, Low, Out of stock; GET, handled on the server) and the items in
     one card per storage place (alphabetical, the items without a place last under "Other"; two cards per row from
     768px), each row one link (the
     name, stretched over the row) to the item, with its quantity and unit and its status badge. A card can be closed
     (layout/parts :: foldCard): its header says how many items it has and how many are low or out of stock.
     Model: stores (StoresService.Stores), list (ListQuery), status ("low", "out" or null). -->
<main class="stores-page" th:with="s=${stores}">
    <header th:replace="~{layout/parts :: pageHeader(heading=#{stores.title}, eyebrowShip=${s.ship},
            subtitle=#{stores.hint}, actions=${s.total > 0} ? ~{::pageActions} : null)}">
        <!-- Count, counting by hand (only with something to count). -->
        <th:block th:fragment="pageActions">
            <a th:if="${s.total > 0}" class="btn btn-primary" th:href="@{/ship/stores/count}"
               th:text="#{stores.count.open}">Count</a>
        </th:block>
    </header>

    <section aria-labelledby="storesSummaryTitle">
        <h2 class="visually-hidden" id="storesSummaryTitle" th:text="#{stores.summary.heading}">Summary</h2>
        <ul class="stat-strip">
            <li>
                <a class="stat-chip" th:href="@{/ship/stores(status='low')}" th:classappend="${s.counts.low > 0} ? 'is-warning'">
                    <span class="stat-chip-label" th:text="#{stores.status.LOW}">Low</span>
                    <span class="stat-chip-value num" th:text="${s.counts.low}">2</span>
                </a>
            </li>
            <li>
                <a class="stat-chip" th:href="@{/ship/stores(status='out')}" th:classappend="${s.counts.out > 0} ? 'is-danger'">
                    <span class="stat-chip-label" th:text="#{stores.status.OUT}">Out of stock</span>
                    <span class="stat-chip-value num" th:text="${s.counts.out}">1</span>
                </a>
            </li>
            <!-- The chevron is for the eye; the hidden words give the link's name its end: "Last count 16 Nov 2026, open history". -->
            <li>
                <a class="stat-chip" th:href="@{/ship/stores/history}" th:classappend="${s.lastCount == null} ? 'is-empty'">
                    <span class="stat-chip-label" th:text="#{stores.summary.lastCount}">Last count</span>
                    <span th:if="${s.lastCount != null}" class="stat-chip-value"><time
                            th:replace="~{layout/parts :: utcDate(${s.lastCount})}"></time></span>
                    <span th:if="${s.lastCount == null}" class="stat-chip-value"
                          th:text="#{stores.summary.notCounted}">Not counted yet</span>
                    <span class="visually-hidden" th:text="#{stores.summary.openHistory}">, open history</span>
                    <span class="stat-chip-more" aria-hidden="true">›</span>
                </a>
            </li>
            <!-- The cook's own requests still waiting for the Master (requestsWaiting, from NavigationAdvice), to
                 Requests filtered to Waiting. -->
            <li>
                <a class="stat-chip" th:href="@{/ship/requests(status='waiting')}">
                    <span class="stat-chip-label" th:text="#{stores.summary.requestsWaiting}">Requests waiting</span>
                    <span class="stat-chip-value num" th:text="${requestsWaiting ?: 0}">1</span>
                </a>
            </li>
            <!-- The vessel's order with a scheduled delivery, to that order. -->
            <li>
                <a th:if="${s.nextDelivery != null}" class="stat-chip" th:href="@{/ship/orders/{id}(id=${s.nextDelivery.id})}">
                    <span class="stat-chip-label" th:text="#{stores.summary.nextDelivery}">Next delivery</span>
                    <span class="stat-chip-value"
                          th:text="#{stores.summary.nextDelivery.value(${s.nextDelivery.confirmedPort},
                                  ${@dates.date(s.nextDelivery.deliveryDate)})}">Antwerp, 20 Nov 2026</span>
                </a>
                <div th:if="${s.nextDelivery == null}" class="stat-chip is-empty">
                    <span class="stat-chip-label" th:text="#{stores.summary.nextDelivery}">Next delivery</span>
                    <span class="stat-chip-value" th:text="#{stores.summary.noDelivery}">None scheduled</span>
                </div>
            </li>
        </ul>
    </section>

    <!-- th:if on a wrapper: th:replace runs before th:if on the same element. -->
    <th:block th:if="${s.total > 0}">
    <div th:replace="~{layout/parts :: filterBar(${list}, #{stores.search}, ~{::listFilters})}">
        <th:block th:fragment="listFilters">
            <div class="filter-field">
                <label for="filterStatus" class="form-label" th:text="#{stores.filter.status}">Status</label>
                <select id="filterStatus" name="status" class="form-select">
                    <option value="" th:text="#{stores.filter.all}">All</option>
                    <option value="low" th:selected="${status == 'low'}" th:text="#{stores.status.LOW}">Low</option>
                    <option value="out" th:selected="${status == 'out'}" th:text="#{stores.status.OUT}">Out of stock</option>
                </select>
            </div>
        </th:block>
    </div>
    </th:block>

    <div th:if="${s.total == 0}" class="card">
        <div th:replace="~{layout/parts :: emptyState(icon='stores', title=#{stores.empty.title},
                text=#{stores.empty.text}, action=null)}"></div>
    </div>
    <div th:if="${s.total > 0 and s.isEmpty()}" class="card">
        <div class="card-body list-empty">
            <p class="list-empty-title" th:text="#{list.noResults}">No results for these filters</p>
            <a class="btn btn-outline-secondary" th:with="url=${list.clearUrl}" th:href="@{${url}}"
               th:text="#{list.clearAll}">Clear all</a>
        </div>
    </div>

    <!-- The places in two columns from 768px (s.columns(), split once on the server; closing a card moves up only
         the cards under it). data-fold-store: js/fold-cards.js remembers on this device which cards are closed; not
         while a search or a filter is on, when every card with a match is open. -->
    <div th:unless="${s.groups.isEmpty()}" class="card-columns card-columns-md" th:with="cols=${s.columns()}"
         th:attr="data-fold-store=${#strings.isEmpty(list.q) and status == null} ? ${'stores:' + s.ship.id} : null">
    <div th:each="col, c : ${cols.columns()}" class="card-column">
    <th:block th:each="g, it : ${col}" th:with="groupId=${'storesPlace' + (c.index * cols.left().size() + it.index)},
            low=${g.levels.?[status.name() == 'LOW'].size()}, out=${g.levels.?[status.name() == 'OUT'].size()}">
    <details th:replace="~{layout/parts :: foldCard(id=${groupId},
            title=${g.place != null} ? ${g.place} : #{stores.place.other}, facts=~{::placeFacts}, body=~{::placeRows},
            key=${g.place ?: ''}, locked=false, extra='stores-place')}">
        <th:block th:fragment="placeFacts">
            <span class="fold-fact text-meta" th:text="#{fold.items(${g.levels.size()})}">12 items</span>
            <span th:if="${low > 0}" class="fold-fact text-meta text-warning-emphasis" th:text="#{stores.fold.low(${low})}">2 low</span>
            <span th:if="${out > 0}" class="fold-fact text-meta text-danger-emphasis" th:text="#{stores.fold.out(${out})}">1 out of stock</span>
        </th:block>
        <th:block th:fragment="placeRows">
        <ul class="list-group list-group-flush">
            <li th:each="l : ${g.levels}" class="list-group-item list-group-item-action stores-row">
                <a class="stores-row-name stretched-link" th:href="@{/ship/stores/items/{id}(id=${l.item.id})}"
                   th:text="${l.item.name}">Basmati rice</a>
                <span th:replace="~{stores/parts :: quantity(${l.quantity}, ${l.item.unit})}"></span>
                <!--/* As wide as the widest badge, so the quantities of a card form one column. */-->
                <span class="stores-count-status d-inline-flex"><span th:replace="~{stores/parts :: statusBadge(${l.status})}"></span></span>
            </li>
        </ul>
        </th:block>
    </details>
    </th:block>
    </div>
    </div>
    <script th:src="@{/js/fold-cards.js}" defer></script>
</main>
</body>
</html>
