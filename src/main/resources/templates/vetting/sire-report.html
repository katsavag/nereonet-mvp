<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/layout :: layout(${ship.name} + ' · ' + #{sire.report.upload}, ~{::main})}">
<body>
<!-- "Upload report" (P41): the SIRE 2.0 report of one inspection, a PDF of at most 10 MB; it takes the place of the
     inspection's earlier upload. js/forms.js shows the chosen file's name and size and warns before uploading one over
     the limit; ?fileTooLarge: one over the multipart limit (UploadTooLargeFilter). Model: ship, inspection, form
     (SireReportForm). -->
<main class="form-page" th:with="base=${'/office/vetting/' + ship.id + '/sire'},
                                 action=${base + '/inspections/' + inspection.id + '/report'},
                                 inspectionLabel=#{sire.inspectionAt(${@dates.date(inspection.inspectionDate)}, ${inspection.port})}">
    <header th:replace="~{layout/parts :: pageHeader(heading=#{sire.report.upload}, crumbs=~{::pageCrumbs},
            subtitle=${inspectionLabel})}">
        <th:block th:fragment="pageCrumbs">
            <th:block th:replace="~{vetting/parts :: sireCrumbs(${ship})}"></th:block>
        </th:block>
    </header>

    <div class="card form-box">
        <div class="card-body p-3 p-md-4">
            <form th:object="${form}" method="post" enctype="multipart/form-data" novalidate th:action="@{${action}}">
                <div th:replace="~{layout/parts :: errorSummary(${form}, '')}"></div>
                <p th:if="${inspection.hasReport()}" class="form-text mt-0"
                   th:text="#{sire.report.replaces(${inspection.reportFileName})}">This replaces birch.pdf.</p>
                <div class="form-grid">
                    <div>
                        <label for="file" class="form-label" th:text="#{sire.report.file}">Report (PDF)</label>
                        <input type="file" id="file" name="file" class="form-control" accept=".pdf,application/pdf"
                               aria-describedby="fileHint fileInfo" data-file-info="fileInfo" required
                               th:data-max-size="${form.maxFileSize}" th:data-too-large="#{vetting.report.error.fileTooLarge}"
                               th:classappend="${param.fileTooLarge != null or #fields.hasErrors('filePresent') or #fields.hasErrors('fileTypeAllowed') or #fields.hasErrors('fileSizeAllowed')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:errors="*{filePresent}"></div>
                        <div class="invalid-feedback" th:errors="*{fileTypeAllowed}"></div>
                        <div class="invalid-feedback" th:errors="*{fileSizeAllowed}"></div>
                        <div th:if="${param.fileTooLarge != null}" class="invalid-feedback" th:text="#{vetting.report.error.fileTooLarge}">
                            The file is larger than 10 MB.</div>
                        <div id="fileHint" class="form-text" th:text="#{sire.report.fileHint}">A PDF, at most 10 MB.</div>
                        <p id="fileInfo" class="form-file-info" aria-live="polite" hidden></p>
                    </div>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary" th:text="#{vetting.report.uploadButton}">Upload</button>
                    <a class="btn btn-ghost" th:href="@{${base}(inspection=${inspection.id})}" th:text="#{form.cancel}">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</main>
</body>
</html>
