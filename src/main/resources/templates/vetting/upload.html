<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/layout :: layout(${ship.name} + ' · ' + #{vetting.report.upload}, ~{::main})}">
<body>
<!-- "Upload report" (P40): an official RightShip document of the vessel (PDF, PNG or JPEG, at most 10 MB) and the date
     on it. The newest by that date becomes the official document beside the RightShip dashboard. js/forms.js shows the
     chosen file's name and size and warns before uploading one over the limit; ?fileTooLarge: one over the multipart
     limit (UploadTooLargeFilter). Model: ship, form (RightShipReportForm). -->
<main class="form-page" th:with="action=${'/office/vetting/' + ship.id + '/rightship/reports/new'},
                                 backUrl=${'/office/vetting/' + ship.id + '/rightship'}">
    <header th:replace="~{layout/parts :: pageHeader(heading=#{vetting.report.upload}, crumbs=~{::pageCrumbs})}">
        <th:block th:fragment="pageCrumbs">
            <th:block th:replace="~{vetting/parts :: crumbs(${ship}, true)}"></th:block>
            <li th:replace="~{layout/parts :: crumb(#{vetting.rightship}, ${backUrl})}"></li>
        </th:block>
    </header>

    <div class="card form-box">
        <div class="card-body p-3 p-md-4">
            <form th:object="${form}" method="post" enctype="multipart/form-data" novalidate th:action="@{${action}}">
                <div th:replace="~{layout/parts :: errorSummary(${form}, '')}"></div>
                <div class="form-grid">
                    <div>
                        <label for="file" class="form-label" th:text="#{vetting.report.file}">File</label>
                        <input type="file" id="file" name="file" class="form-control" accept=".pdf,.png,.jpg,.jpeg"
                               aria-describedby="fileHint fileInfo" data-file-info="fileInfo" required
                               th:data-max-size="${form.maxFileSize}" th:data-too-large="#{vetting.report.error.fileTooLarge}"
                               th:classappend="${param.fileTooLarge != null or #fields.hasErrors('filePresent') or #fields.hasErrors('fileTypeAllowed') or #fields.hasErrors('fileSizeAllowed')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:errors="*{filePresent}"></div>
                        <div class="invalid-feedback" th:errors="*{fileTypeAllowed}"></div>
                        <div class="invalid-feedback" th:errors="*{fileSizeAllowed}"></div>
                        <div th:if="${param.fileTooLarge != null}" class="invalid-feedback" th:text="#{vetting.report.error.fileTooLarge}">
                            The file is larger than 10 MB.</div>
                        <div id="fileHint" class="form-text" th:text="#{vetting.report.fileHint}">PDF, PNG or JPEG, at most 10 MB.</div>
                        <p id="fileInfo" class="form-file-info" aria-live="polite" hidden></p>
                    </div>
                    <div class="field-half">
                        <label for="documentDate" class="form-label" th:text="#{vetting.report.date}">Document date</label>
                        <input type="date" th:field="*{documentDate}" class="form-control" th:errorclass="is-invalid"
                               th:min="${@formFields.minDate(form, 'documentDate')}"
                               th:max="${@formFields.maxDate(form, 'documentDate')}"
                               aria-describedby="documentDateHint" required>
                        <div class="invalid-feedback" th:errors="*{documentDate}"></div>
                        <div id="documentDateHint" class="form-text" th:text="#{vetting.report.dateHint}">The date on the report.</div>
                    </div>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary" th:text="#{vetting.report.uploadButton}">Upload</button>
                    <a class="btn btn-ghost" th:href="@{${backUrl}}" th:text="#{form.cancel}">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</main>
</body>
</html>
