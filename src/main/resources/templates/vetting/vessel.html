<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/layout :: layout(${ship.name} + ' · ' + #{nav.vetting}, ~{::main})}">
<body>
<!-- One vessel's Vetting page (P40): a card per vetting regime, how charterers vet the vessel. The whole card opens
     the regime's page (a stretched link on its title, so it works without JavaScript and the link has the card's
     name). P41: the SIRE 2.0 card. Tankers show SIRE 2.0 first, other types RightShip first; on a type where SIRE 2.0
     does not usually apply, its card collapses to one muted line with Add inspection until the vessel has one.
     Model: ship, rightShip (RightShipView), sire (SireView), sireApplies. -->
<main>
    <header th:replace="~{layout/parts :: pageHeader(heading=${ship.name}, crumbs=~{::pageCrumbs},
            subtitleParts=~{::pageSubtitle}, actions=~{::pageActions})}">
        <th:block th:fragment="pageCrumbs">
            <th:block th:replace="~{vetting/parts :: crumbs(${ship}, false)}"></th:block>
        </th:block>
        <th:block th:fragment="pageSubtitle">
            <span class="num" th:text="#{ship.codeValue(${ship.imoNumber})}">IMO 9300001</span>
            <th:block th:if="${ship.type}"><span aria-hidden="true">·</span>
                <span th:text="#{${'ship.type.' + ship.type}}">Bulk carrier</span></th:block>
        </th:block>
        <th:block th:fragment="pageActions">
            <a th:replace="~{vetting/parts :: openVessel(${ship})}"></a>
        </th:block>
    </header>

    <div class="card-grid">
        <th:block th:if="${sireApplies}">
            <th:block th:replace="~{vetting/parts :: sireCard(${ship}, ${sire}, ${sireApplies})}"></th:block>
        </th:block>
        <section th:replace="~{vetting/parts :: rightShipCard(${ship}, ${rightShip})}"></section>
        <th:block th:unless="${sireApplies}">
            <th:block th:replace="~{vetting/parts :: sireCard(${ship}, ${sire}, ${sireApplies})}"></th:block>
        </th:block>
    </div>
</main>
</body>
</html>
