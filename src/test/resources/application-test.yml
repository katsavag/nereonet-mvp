spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    username: sa
    password:
  mail:
    host: localhost
    port: 1025
    # Mailpit: no login, no TLS.
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false
      mail.smtp.starttls.required: false
app:
  base-url: http://localhost:8080
  mail:
    from: noreply@nereonet.local
  invitation:
    jwt-secret: dev-only-invitation-secret-change-me-0123456789
  bootstrap:
    office-email: office@example.com
    office-password: office123
  library:
    storage-dir: ${java.io.tmpdir}/nereonet-test-library
  # No organisation in tests, even with one in the environment or .env. LoginFlowTest sets one where it needs it.
  organisation:
    name: ""
    code: ""
  # No starter template of required documents in tests; RequirementsFlowTest seeds it where it needs it.
  requirements:
    starter-template: false
  # Never the real VesselAPI in tests, even with a key in the environment or .env. VesselLookupFlowTest switches
  # the fake on for itself.
  vesselapi:
    api-key: ""
    fake: false
  # Never the real AssemblyAI or Claude in tests, even with a key in the environment or .env: both fakes answer.
  assemblyai:
    api-key: ""
    fake: true
  claude:
    api-key: ""
    fake: true
  # The invoice's pages are read at once, in the request (and the test's transaction), by FakeInvoiceReader.
  invoice:
    fake: true
    read-in-background: false
